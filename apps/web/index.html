<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The served identity of every signed-in route: closed by default. The build
         writes each public route's own block (apps/web/src/lib/seo, ADR 0158). -->
    <!-- seo:head:start -->
    <title>Mudavym</title>
    <meta name="description" content="Restaurant back-office software for beverage inventory, purchasing, and checking vendor invoices against what was delivered." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- seo:head:end -->

    <!-- PWA manifest + Apple Safari meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A5E6B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mudavym" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Fraunces and JetBrains Mono are self-hosted (decision 0149 row 9:
         "self-host every face; no Google Fonts request"): woff2 files under
         /fonts, @font-face in src/styles/mudavym.css. Preload the two
         above-the-fold latin subsets so the Mudavym pages' first paint does
         not wait on the stylesheet that declares them. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin>

    <!-- Plus Jakarta Sans and DM Sans are NOT yet self-hosted. Doing so needs
         new woff2 files this session could not add: fetching them requires
         downloading from fonts.gstatic.com, which needs the founder's
         explicit go-ahead in chat (this repo's download rule) and this pass
         had no live chat turn to ask on. Tracked open in
         .planning/decisions/OPEN-DECISIONS.md ("Font hosting" row) and
         CLAIMS.jsonl (ADR-0158-FONTS-NOT-YET-SELF-HOSTED) until someone
         with that turn fetches the two families and removes this link. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
