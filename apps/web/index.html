<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ADR 0169 — the person's Mudavym ground choice, applied before first
         paint. It must run synchronously, before any stylesheet, or a
         charcoal choice would flash paper first.

         PAPER UNLESS THE ACCOUNT SAID OTHERWISE (founder, 2026-09-21). The
         default needs no lookup at all and is NEVER the device's light/dark
         setting — there is deliberately no `matchMedia` or
         `prefers-color-scheme` read anywhere on this path.

         The choice itself lives on the person's account
         (`user_preferences.preferences.ground`), which cannot be read before
         paint. So this reads the device MIRROR of it — and, because a device
         can be shared, only the mirror belonging to the person whose session
         is actually loaded: the user id is taken from the `sub` claim of the
         access token this browser is holding, exactly the id the gateway will
         answer for. No token, no `sub`, no mirror for that id, or anything at
         all going wrong ⇒ paper. Signing in as someone else on a shared
         terminal therefore shows THEIR ground (or paper), never the previous
         person's.

         Keep this in sync BY HAND with `src/lib/mudavym/groundChoice.ts`
         (same key prefix, same attribute) — there is no bundler step that
         shares code into a static HTML file. `groundChoiceNoFlash.test.ts`
         checks that they still agree. -->
    <script>
      (function () {
        var ground = 'paper';
        try {
          var token = window.localStorage.getItem('accessToken');
          var payload = token && token.split('.')[1];
          if (payload) {
            payload = payload.replace(/-/g, '+').replace(/_/g, '/');
            while (payload.length % 4) payload += '=';
            var sub = JSON.parse(window.atob(payload)).sub;
            if (sub) {
              var mirrored = window.localStorage.getItem('mudavym.ground.' + sub);
              if (mirrored === 'charcoal' || mirrored === 'paper') ground = mirrored;
            }
          }
        } catch (e) {
          ground = 'paper';
        }
        document.documentElement.setAttribute('data-mudavym-ground', ground);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The served identity of every signed-in route: closed by default. The build
         writes each public route's own block (apps/web/src/lib/seo, ADR 0158). -->
    <!-- seo:head:start -->
    <title>Mudavym</title>
    <meta name="description" content="Restaurant back-office software for beverage inventory, purchasing, and checking vendor invoices against what was delivered." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- seo:head:end -->

    <!-- PWA manifest + Apple Safari meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A5E6B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mudavym" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Fraunces and JetBrains Mono are self-hosted (decision 0149 row 9:
         "self-host every face; no Google Fonts request"): woff2 files under
         /fonts, @font-face in src/styles/mudavym.css. Preload the two
         above-the-fold latin subsets so the Mudavym pages' first paint does
         not wait on the stylesheet that declares them. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin-normal.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin>

    <!-- Plus Jakarta Sans and DM Sans are self-hosted too (styles/fonts-sans.css);
         no font is fetched from any other origin. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
