<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The served identity of every signed-in route: closed by default. The build
         writes each public route's own block (apps/web/src/lib/seo, ADR 0158). -->
    <!-- seo:head:start -->
    <title>Mudavym</title>
    <meta name="description" content="Restaurant back-office software for beverage inventory, purchasing, and checking vendor invoices against what was delivered." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- seo:head:end -->

    <!-- PWA manifest + Apple Safari meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A5E6B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mudavym" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fonts: Söhne-like alternatives (Graphik/Circular alternatives) -->
    <!-- Primary: Plus Jakarta Sans (clean, geometric like Söhne) -->
    <!-- Secondary: DM Sans (similar to Toast's clean feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
