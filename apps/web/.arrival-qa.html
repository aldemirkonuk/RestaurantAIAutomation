<!doctype html><html><head><meta charset="utf-8"><title>Arrival visual QA</title><style>body{margin:0;background:#383838;color:white;font:14px system-ui}header{padding:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}label{display:flex;gap:6px}select{padding:5px;font:inherit}iframe{display:block;margin:auto;max-width:100%;height:calc(100vh - 70px);border:0}output{font-variant-numeric:tabular-nums}</style></head><body><header><strong>Arrival fixture QA</strong><label>Width<select id="width"><option>375</option><option>768</option><option selected>1080</option></select></label><label>Ground<select id="ground"><option value="charcoal">Charcoal</option><option value="paper">Paper</option></select></label><label>State<select id="state"><option value="ready">Ready</option><option value="empty">Empty vendor book</option><option value="partial">Terms unreadable</option><option value="error">Read error</option><option value="loading">Loading</option></select></label><output id="measure"></output></header><iframe id="frame" title="Arrival under review" width="1080" src="/.arrival-fixture.html?ground=charcoal"></iframe><script>const f=document.querySelector('iframe'),w=document.querySelector('#width'),g=document.querySelector('#ground'),s=document.querySelector('#state'),m=document.querySelector('output');function measure(){m.textContent=`Viewport ${f.clientWidth}px · document ${f.contentDocument?.documentElement.scrollWidth}px`}function update(){f.src=`/.arrival-fixture.html?ground=${g.value}&state=${s.value}`;f.width=w.value}w.onchange=()=>{f.width=w.value;measure()};g.onchange=update;s.onchange=update;f.onload=()=>{measure();new ResizeObserver(measure).observe(f.contentDocument.documentElement)};</script></body></html>
