# Ruff configuration for agent-orchestrator CI lint gate.
target-version = "py311"
line-length = 100

exclude = [
    ".ruff_cache",
    "data",
    "demo",
]

[lint]
# Match default ruff CI profile (pyflakes + pycodestyle errors only).
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[lint.per-file-ignores]
# Sentry must initialize before FastAPI / router imports.
"main.py" = ["E402"]
"jobs/celery_app.py" = ["E402"]
# Live scripts and tests patch env / sys.path before importing app modules.
"scripts/**" = ["E402"]
"tests/**" = ["E402"]
"test_*.py" = ["E402"]
# Optional heavy deps probed at runtime, not used at import time.
"agents/menu_analyzer_agent.py" = ["F401"]
"services/pdf_extraction_service.py" = ["F401"]

[format]
quote-style = "double"
