name: CI

# TFND-05 (Phase 36 Testing Campaign):
# test-typescript  → unit + integration (Jest api-gateway + Vitest web via turbo/pnpm test)
# test-python      → unit + integration (pytest tests/; markers in pytest.ini not filtered today)
# test-e2e         → local Playwright smoke (NOT cloud prod E2E)
# Cloud nightly E2E remains .github/workflows/e2e-prod.yml (schedule: 0 2 * * *)
# Do NOT treat TFND-05 as green CI — Black debt on studio_routes.py may keep main red
# STATUS: schedule-present / capability-unverified until one wave XML lands

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20.x"
  PYTHON_VERSION: "3.11"

jobs:
  # The loop corpus is a contract, not prose. ORG_STRUCTURE §5.1 (OD-47) closes
  # `close_time` and `status` to fixed sets, and `active`/`running` must cite the
  # mechanism that closes them. Left unenforced, that rule drifted to 102 distinct
  # close_time values across 482 loops, and to a live-loop count nobody had checked
  # against the rule it claimed to follow.
  #
  # Unlike loop-watcher.yml, which reports and never blocks, this one fails: §5.1
  # calls a value outside the sets "a defect, not a variant". Stdlib only, so there
  # is no install step and a violation surfaces in seconds.
  loop-contract:
    name: Loop vocabulary contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard against loop vocabulary drift and a stale loop index
        run: python3 scripts/build_loop_index.py --check

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::Either a loop block breaks ORG_STRUCTURE §5.1, or the generated index is stale."
          echo "::notice::The permitted values are read from §5.1's own table — fix the block, or amend the table if the contract itself is wrong."
          echo "::notice::If the index is merely stale: run 'python3 scripts/build_loop_index.py' and commit the result."

  # The card layer's twin of loop-contract (ADR 0034/0038): every unit's
  # <slug>-agent-stack.md declares its agents as fenced YAML cards; this gate
  # parses all of them, enforces the contract (requirements-only, no model or
  # OD-03 candidate, mutate_stock_money_outbound: confirm on every card), and
  # fails if 00-index/cards.json or CARD-MAP.md is stale. Exit 2 means the gate
  # could not check at all — that blocks too; a vacuous pass is the failure mode
  # ADR 0025 exists to end.
  agent-card-contract:
    name: Agent-card contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Guard against card-contract drift and a stale card index
        run: python3 scripts/build_agent_card_index.py --check

      - name: Smoke-run the mechanical card runner (report-only, no writes)
        run: python3 scripts/agents/run_card.py

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::Either a card breaks the ADR 0034 contract, the card index is stale, or a mechanical runner crashed."
          echo "::notice::If the index is merely stale: run 'python3 scripts/build_agent_card_index.py' and commit the result."

  # OD-44. The UCC contract-formation guardrail exists in two runtimes that ship as
  # separate containers. They were two hand-written lists under a comment claiming
  # they were "ported verbatim" — TypeScript carried 19 patterns, Python carried 8,
  # and Python is the runtime that actually auto-sends. The runtime that could bind
  # the restaurant to a purchase had the weaker guardrail, and the comment kept that
  # invisible for as long as nobody counted.
  #
  # Syncing the lists fixes today. This job is what stops it recurring: the Python
  # module is generated from the TypeScript canon, and a hand-edit of either side
  # fails here. Like loop-contract it blocks; stdlib only, so no install step.
  commitment-guardrail-sync:
    name: Commitment guardrail is one source of truth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard against the two runtimes' guardrails diverging
        run: python3 scripts/sync_commitment_patterns.py --check

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::The commitment-language guardrail differs between the TypeScript gateway and the Python orchestrator."
          echo "::notice::Canon is apps/api-gateway/src/common/orchestrator/commitment-patterns.ts — edit it there, never the generated Python module."
          echo "::notice::Then run 'python3 scripts/sync_commitment_patterns.py' and commit both files."
          echo "::notice::Weakening the list to make this pass is a legal-guardrail regression, not a fix."

  # P1 §5 item 4. Defect D3 was that the entire NestJS gateway wrote nothing to
  # the spend ledger: seven raw `fetch("https://api.anthropic.com/...")` call
  # sites, and `grep -c api_spend apps/api-gateway/src` returning 0. Every one of
  # them, including `claude-opus-4-8` in the consultants path, spent money no
  # query could see.
  #
  # That did not happen in a single commit. Each new call site was written by
  # copying the last one, and the last one did not log either. So instrumenting
  # the 18 sites without this job fixes today and loses again in a month — P1
  # §5.4: "without this, D3 recurs".
  #
  # Like loop-contract and unlike loop-watcher.yml, this one blocks. Pure grep,
  # no install step, seconds to run. It reports exit 2 rather than green when it
  # cannot find the thing it measures against — a vacuously passing guard is the
  # failure mode that let D3 hide across seven files.
  model-call-ledger:
    name: Model calls reach the spend ledger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Full history: the scope step diffs this PR against its merge base.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this PR touch a runtime that calls models?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Pushes to main/develop always run — that is the backstop for anything
          # that reached a protected branch without a PR.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Push event — running the guard unconditionally."
            exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if echo "$changed" | grep -Eq '^(apps/api-gateway/|services/agent-orchestrator/|scripts/check_model_calls_logged\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No file under apps/api-gateway/ or services/agent-orchestrator/ changed."
          fi

      - name: Guard against a model call site that skips the ledger
        if: steps.scope.outputs.relevant == 'true'
        run: ./scripts/check_model_calls_logged.sh

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::A model call site does not reach the P1 emitter, or the guard could not verify one."
          echo "::notice::Gateway: route the call through apps/api-gateway/src/common/model-client/ instead of a raw fetch."
          echo "::notice::Python: call get_spend_logger().log(...) on the response — SpendLogger.log() never raises."
          echo "::notice::Exit 2 means the guard could not check what it claims to (missing wrapper, or a rotted pattern). That is a failure, not a skip: see the NEVER VACUOUS section in scripts/check_model_calls_logged.sh."
          echo "::notice::The pre-P1 debt list in that script is shrink-only. A new unlogged call site does not belong on it."

  # Does the decision register still describe reality?
  #
  # Added 2026-08-25, after five OPEN-DECISIONS entries were acted on in one day
  # and five turned out to be wrong in ways that changed the priority: two were
  # fixed the day before and never struck off, one overstated its severity, one
  # pointed at entirely the wrong packages, and one described spurious rows in a
  # table that does not exist.
  #
  # Prose rots because nothing re-reads it. Claims that a command can check are
  # written as commands in .planning/decisions/CLAIMS.jsonl, and this runs them.
  # Blocks, like the other guards, and exits 2 rather than green when it cannot
  # check what it claims to.
  #
  # Second step added 2026-08-26 with ADR 0025 §6. Same subject -- the decision
  # register -- so it shares this job rather than opening another required check:
  # both steps read .planning/decisions/, both are stdlib-only and hermetic, and a
  # citation defect and a claim defect want to be read side by side. That is the
  # same reason schema-code-parity carries two scripts in one job.
  #
  # The pairing check is the answer to a measurement, not a hunch: of the register
  # citations in this corpus that named both an id and a line, ZERO agreed. An id
  # alone renumbers and keeps resolving; a line alone moves under any of the 57
  # commits that touched OPEN-DECISIONS.md since Aug 1. Only the pair fails loudly.
  decision-claims:
    name: Decision register matches reality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Re-verify every executable claim
        run: ./scripts/check_decision_claims.sh

      - name: Every register citation names the row it points at
        run: ./scripts/check_citation_pairing.py

      - name: The --fix path still refuses what it must refuse
        run: ./scripts/check_citation_pairing.py --self-test

      - name: Every OD id names a register row
        run: ./scripts/check_od_ids_exist.py

      - name: The collision helper still catches what it claims to
        run: python3 ./scripts/_od_collisions.py --self-test

      - name: A merged-away id resolves, and prose alone still does not
        run: ./scripts/check_od_ids_exist.py --self-test

      - name: Every task type is graded or knowingly exempt
        run: ./scripts/check_task_types_are_graded.py

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::REGRESSED means a decision this repo considers settled has come undone."
          echo "::notice::STALE means an entry is listed as open but its claim already verifies — strike it off."
          echo "::notice::A register that lists fixed things is one people stop reading, which is how a critical SSRF sat unread."
          echo "::notice::COULD NOT RUN means a claim's verify command never executed — a missing file, a renamed symbol, a typo. Repoint it or strike it; it is not a skip."
          echo "::notice::A claim may not redirect its own stderr. Strict mode reads stderr to tell 'ran and disagreed' from 'never ran', and a muzzled claim certifies itself."
          echo "::notice::DISAGREEING means a citation's OD id and its OPEN-DECISIONS.md line name different rows. The guard prints the line the id is actually on — use that one."
          echo "::notice::NAMES NOTHING means an OD id in the corpus has no register row. File the fork and cite the number you are given — never borrow a number already in use: the design-foundation fork spent a day pointing at the resolved email-verification decision that way."
          echo "::notice::If the fork was MERGED into another, the fix belongs in the register, never in the citing document: write '**Absorbs OD-43 (merged 2026-08-27)**' in the absorbing row. Dated audits are snapshots — do not edit them to make a guard pass, and do not exempt them."
          echo "::notice::RESOLVES TWO WAYS means an id both owns a row and is declared absorbed into another. Delete whichever half is stale; a reference to it currently resolves two ways."
          echo "::notice::UNGRADED means a task type records only call_level_v0 — 'the HTTP request returned 200'. Grade it, or add it to EXEMPT with the reason. On 2026-08-27 six of the gateway's seven task types were in that state."
          echo "::notice::UNANCHORED means a bare OPEN-DECISIONS.md:N with no id beside it. ADR 0025 §6 requires both: write OD-88 (OPEN-DECISIONS.md:53)."
          echo "::notice::Do NOT add a citation to PAIRING_DEBT. That list is a two-PR handoff for six page dossiers owned by a concurrent branch, and it only ever shrinks."
          echo "::notice::Exit 2 means the guard could not check what it claims to. That is a failure, not a skip."

  # Does the schema the code queries actually exist, and does it live where it
  # will be applied?
  #
  # Added 2026-08-26 after five instances of one defect in a single day. In each,
  # a migration that CREATEs a table lives outside supabase/migrations/ -- in
  # supabase/migrations_archive/ or services/database/migrations_archive/, which
  # `supabase db push` has never read -- so it was never applied, production
  # silently lacks the table, and the code queries it anyway. PostgREST answers
  # PGRST205, the caller falls back to a default or swallows the error, and
  # nothing goes red. scheduled_reports has failed 100% of its inserts since the
  # baseline; push_subscriptions resolves zero recipients behind `catch { return
  # [] }`; enable_ai_negotiation could not be turned OFF because the failed read
  # defaulted to "enabled".
  #
  # schema-parity.yml cannot see any of this. It compares a database against a
  # database, and for all five tables BOTH sides are equally wrong -- local does
  # not create the table because the migration is archived, production does not
  # have it because it was never applied. The diff is empty and the job is green
  # BECAUSE the two agree. It also has no notion of application code at all.
  # 20260805000000_baseline_from_production.sql made that blindness total: it
  # captured production as it stood, so anything unapplied by then vanished from
  # the repo's own idea of the schema.
  #
  # These two guards add the corner nothing was comparing -- what the CODE
  # queries -- and the rule that schema has one home. Both block, like
  # loop-contract and model-call-ledger, and both exit 2 rather than green when
  # they cannot check what they claim to. Stdlib Python, no install step,
  # seconds to run, and no secret: the hermetic arm compares code against
  # supabase/migrations/. The arm that needs the database lives in
  # schema-parity.yml, where the connection secret already is.
  schema-code-parity:
    name: Code queries only schema that exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Every relation the code queries is declared by supabase/migrations
        run: ./scripts/check_queried_tables_exist.py

      - name: Schema lives in exactly one place
        run: ./scripts/check_migrations_single_home.py

      # OD-72/OD-73 ratchet, added 2026-08-26. Both were closed by one-time
      # sweeps, and the class came back the NEXT DAY: OD-73's row records
      # "0 public tables remain RLS-off", verified against the live database,
      # and roughly two hours later `20260826175836_evidence_gate_v1.sql`
      # created three more with no RLS, no policy, no GRANT and no REVOKE.
      #
      # The session that remembered was overwritten by the one after it, inside
      # an hour. That is what a sweep without a ratchet buys. This step is the
      # ratchet: every public table a migration creates must reach RLS-enabled
      # and anon/authenticated-revoked somewhere in the migration set.
      #
      # `if: !cancelled()` so it reports even when a step above already failed —
      # a guard hidden behind another guard is not a guard.
      - name: Every public table a migration creates is locked down
        if: ${{ !cancelled() }}
        run: ./scripts/check_new_tables_are_locked_down.py

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::RLS NEVER ENABLED means a migration creates a public table that no migration ever puts RLS on. Add it in the CREATING migration -- unless that migration has already shipped to production, in which case a follow-up is the only fix that reaches both production and a fresh build."
          echo "::notice::anon/authenticated STILL GRANTED means a table is client-reachable over PostgREST. The OD-72 default-privileges ratchet covers tables created after 20260825210000; an explicit GRANT after that undoes it."
          echo "::notice::Do NOT add a table to DEBT to make this pass. That list is shrink-only and MAX_DEBT only ever goes down."
          echo "::notice::The code queries a relation supabase/migrations does not define, or a migration was written somewhere it will never be applied."
          echo "::notice::If an archive directory already defines it, THAT is the defect: move the CREATE into supabase/migrations/ under a version past everything on main, and push it."
          echo "::notice::Do not copy the archived file blindly. restaurant_feature_flags had two definitions, 7 columns and 22, and the applied one was not the one the service was written against."
          echo "::notice::Do NOT add the relation to KNOWN_MISSING or SOLE_DEFINITION_DEBT. Both lists are shrink-only; they record what was already broken when the guards landed."
          echo "::notice::'is on the debt list but supabase/migrations now declares it' means someone FIXED it — delete that line. That is the handshake, not a collision."
          echo "::notice::Exit 2 means the guard could not check what it claims to (a root moved, or the SQL/call-site patterns rotted). That is a failure, not a skip."

  # Does the gateway's dependency graph actually resolve?
  #
  # Added 2026-08-24 after the api-gateway crash-looped in production on the P1
  # merge commit: PosHubModule and AnalyticsModule guard their controllers with
  # JwtAuthGuard but did not import AuthModule, which provides the
  # TokenBlacklistService the guard injects. `tsc --noEmit` was clean and 780 jest
  # tests passed — neither models Nest's runtime injector, and jest builds small
  # testing modules that carry their own providers. Only constructing the real
  # AppModule catches it, and nothing did until production did.
  #
  # Blocks, like loop-contract and model-call-ledger. Uses dummy env and binds no
  # port: if this job ever needs a real secret, a boot-time side effect has crept
  # into the graph and that is the finding.
  gateway-boot:
    name: Gateway dependency graph resolves
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot the AppModule injector
        run: ./scripts/check_gateway_boots.sh

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::The gateway cannot boot. Merging this crash-loops production — every route, not just the one that changed."
          echo "::notice::Most common cause: a controller uses @UseGuards(JwtAuthGuard) but its module does not import AuthModule."
          echo "::notice::AuthModule is not @Global(); a guard resolves in the context of the module declaring the controller."
          echo "::notice::Fix: add AuthModule to that module's imports — see conversations.module.ts for the house pattern."

  # Lint and type-check TypeScript/React code
  lint-typescript:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: No dependency directory is tracked in git
        run: ./scripts/check_no_vendored_deps.py

      - name: Every declared test script can actually fail
        run: ./scripts/check_test_scripts_are_real.py

      - name: Guard against direct stock_live/shadow_stock writes
        run: ./scripts/check_no_direct_stock_writes.sh

      - name: Guard against direct beverages.type_attributes access
        run: ./scripts/check_no_direct_type_attributes_access.sh

  # Lint Python code
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd services/agent-orchestrator
          pip install -r requirements.txt
          pip install "ruff==0.8.4" "black==24.10.0"

      - name: Run Ruff
        run: |
          cd services/agent-orchestrator
          ruff check .

      - name: Run Black
        run: |
          cd services/agent-orchestrator
          black --check .

  # Build all packages
  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    needs: [lint-typescript, lint-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 7

  # Test TypeScript/React code — unit + integration on push (TFND-05)
  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-latest
    needs: [lint-typescript]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        # Vitest auto-detects CI and runs once; jest runs once by default.
        # (Passing --run here would be consumed by turbo, not the test runners.)
        run: pnpm run test

  # E2E tests (Playwright)
  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @wineops/web exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm --filter @wineops/web test:e2e

  # Test Python code — unit + integration on push (TFND-05)
  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          cd services/agent-orchestrator
          # requirements.txt already pins pytest/pytest-asyncio/pytest-cov/pytest-mock.
          # Do NOT reinstall them unpinned here — that upgrades pytest-asyncio past
          # the pinned 0.23.3 and breaks ~20 async tests ("no current event loop").
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd services/agent-orchestrator
          pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./services/agent-orchestrator/coverage.xml
          flags: python
          name: agent-orchestrator

  # 0a (BEVERAGE_CATALOGUE_PLAN.md; arch §3.1/§3.8): the beverage/wine merge
  # identity policy is decided by a deterministic key, never a similarity
  # score — because measurement showed no threshold separates true matches
  # from false ones (worst true match 0.919, worst false pair 0.979). This
  # gate proves the key itself makes zero false merges against every
  # known-distinct pair derivable from the committed menu corpus, and it
  # must stay 0 forever — see the script header for why false merges and
  # false splits are never traded off against each other. Pure stdlib
  # Python, no dependency install, seconds to run.
  merge-identity-gate:
    name: Merge Identity Gate (0 false merges)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Rebuild the labelled eval set from the committed corpus
        run: python3 scripts/build_merge_eval_set.py

      - name: Score the identity policy — fails if any false merge exists
        run: python3 scripts/eval_merge_policies.py

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # Summary
  #
  # THIS JOB MUST RUN EVEN WHEN ITS DEPENDENCIES DO NOT, AND MUST COVER ALL OF THEM.
  #
  # Until 2026-08-27 it carried no `if:`, so any dependency that skipped took
  # this job down with it -- and GitHub reports a SKIPPED required check as
  # successful. A summary job that cannot report failure is worse than none,
  # because people trust it.
  #
  # The 2026-08-27 sequence, checked against the API rather than remembered
  # (an earlier version of this comment got the causal chain wrong):
  #
  #   15:04:27 / 15:04:33  #134 and #136 merge. Both PR runs were 15/15 green.
  #   15:08:25  first post-merge run on `main` fails `Decision register matches
  #             reality`; `CI Complete` SKIPS.
  #   15:10:56  `Lint Python` starts failing too -- six minutes AFTER the
  #             merges, so it did not gate them.
  #
  # So the merges were not pushed past a skipped gate. They were unblocked
  # because on 2026-08-27 `main` had NO branch protection at all -- `protected:
  # false`, `/protection` 404, `/rulesets` `[]`. Nothing was required, so
  # nothing could block.
  #
  # BOTH HALVES ARE CLOSED NOW. The skip hole is fixed here, and protection was
  # enabled on 2026-08-28: `CI Complete` is a required check with `strict: true`
  # (the branch must be up to date before it merges). `enforce_admins` is
  # deliberately false -- the owner can still override, which turns a silent
  # merge onto a red `main` into a deliberate one rather than locking a solo
  # founder out of their own repository. Turning it on is a settings change, not
  # a code change, so nothing here can assert it stays true; `gh api
  # repos/:owner/:repo/branches/main/protection` is where to look.
  #
  # A second hole, found by review: `needs` listed 9 of 15 jobs, and
  # loop-contract / commitment-guardrail-sync / model-call-ledger -- all
  # self-described blocking guards, one of them the spend ledger -- were root
  # jobs with no dependents, so they could fail while this printed success. They
  # are listed now, and the first step below asserts the list stays complete:
  # three separate commits added a job and none updated this list, so a
  # hand-maintained list is exactly what needs a check, not a promise.
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        build,
        decision-claims,
        gateway-boot,
        schema-code-parity,
        test-typescript,
        test-e2e,
        test-python,
        merge-identity-gate,
        security,
        # Root jobs with no dependents. Absent from this list until 2026-08-27,
        # so all three could fail while the summary said every check passed.
        # `lint-typescript` / `lint-python` are NOT listed and do not need to be:
        # build/test-* depend on them, so a lint failure skips a direct need and
        # is caught. The coverage step below proves that rather than trusting it.
        loop-contract,
        commitment-guardrail-sync,
        model-call-ledger,
        # Added 2026-08-28 with the job itself: the coverage step below failed
        # this PR because `agent-card-contract` was a root job nobody depended
        # on — exactly the drift the step exists to catch, caught on the commit
        # that introduced it.
        agent-card-contract,
      ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The gate polices its own coverage. `toJSON(needs)` removed one
      # hand-maintained list; `needs:` itself is still one, and it had already
      # drifted three times before anyone noticed. This is the claim a command
      # can check, so it is one.
      - name: The gate covers every job in this workflow
        run: |
          python3 - <<'PY'
          import sys, yaml

          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          jobs = wf["jobs"]
          gate = "ci-complete"
          direct = set(jobs[gate].get("needs") or [])
          if not direct:
              print("CANNOT CHECK -- ci-complete declares no needs.")
              sys.exit(2)

          closure, stack = set(direct), list(direct)
          while stack:
              for n in jobs.get(stack.pop(), {}).get("needs") or []:
                  if n not in closure:
                      closure.add(n)
                      stack.append(n)

          uncovered = sorted(set(jobs) - {gate} - closure)
          if uncovered:
              for j in uncovered:
                  name = jobs[j].get("name", j)
                  print(f"::error::job `{j}` ({name}) is not reachable from "
                        f"{gate}.needs -- it can fail while CI Complete passes")
              print(f"\nFAIL -- {len(uncovered)} job(s) outside the gate: "
                    f"{', '.join(uncovered)}")
              print("Add them to ci-complete.needs, or to a job already in it.")
              sys.exit(1)

          print(f"All {len(jobs) - 1} jobs are covered by {gate} "
                f"({len(direct)} directly, {len(closure) - len(direct)} transitively).")
          PY

      - name: Every gated job actually ran, and passed
        env:
          # `toJSON(needs)` is the only way to see a dependency's result without
          # naming each one twice; naming them twice is how this list drifts.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          # Unset, empty or unparseable are all "this gate could not check",
          # which is exit 2 -- not a KeyError landing on exit 1 wearing the
          # costume of a real failure. Same contract as check_decision_claims.sh.
          raw = os.environ.get("NEEDS", "").strip()
          if not raw:
              print("CANNOT CHECK -- NEEDS arrived unset or empty.")
              sys.exit(2)
          try:
              needs = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"CANNOT CHECK -- NEEDS is not JSON: {e}")
              sys.exit(2)
          if not needs:
              print("CANNOT CHECK -- `needs` came through empty.")
              sys.exit(2)

          results = {j: (v or {}).get("result") or "?" for j, v in needs.items()}
          for job, result in sorted(results.items()):
              print(f"  {result:<10} {job}")

          bad = {j: r for j, r in results.items() if r != "success"}
          if bad:
              print()
              for job, result in sorted(bad.items()):
                  if result == "skipped":
                      msg = (f"`{job}` was SKIPPED, not passed. Something it depends "
                             f"on failed, so its checks never ran.")
                  else:
                      msg = f"`{job}` came back `{result}`."
                  print(f"::error::{msg}")
                  print(f"FAIL -- {msg}")
              print("\nA skipped job is not a passing job. This gate exists so that "
                    "cannot be merged.")
              sys.exit(1)

          print(f"\nAll {len(results)} gated jobs in ci.yml passed -- and every one "
                f"of them actually ran. (Checks from other workflows are not in scope "
                f"here.)")
          PY

