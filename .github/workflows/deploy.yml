name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Railway and Vercel deployments are handled via their own GitHub integrations
# (Railway: auto-deploy on push to main; Vercel: auto-deploy via vercel.json)
# This workflow only runs the frontend build check to catch errors early.

env:
  NODE_VERSION: "20.x"

jobs:
  build-frontend:
    name: Build Frontend Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build --filter=web
        env:
          VITE_API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL || 'https://placeholder.railway.app' }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}
