name: Deploy to Production

on:
  # Safety gate: only run after CI succeeds on main (Railway/Vercel still auto-deploy on push;
  # this workflow validates health in dependency order and records an audit artifact).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy-audit (post-push health check) or rollback-guide (print revert steps)"
        type: choice
        options:
          - deploy-audit
          - rollback-guide
        default: deploy-audit
      rollback_target_sha:
        description: "Git SHA to roll back to (rollback-guide mode only)"
        type: string
        default: ""

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION: "20.x"
  ORCHESTRATOR_URL: ${{ secrets.RAILWAY_ORCHESTRATOR_URL }}
  API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
  ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
  VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}

jobs:
  # A GATE THAT DID NOT RUN MUST NOT LOOK LIKE A GATE THAT PASSED.
  #
  # This job used to carry `if: workflow_run.conclusion == 'success'`. When CI was
  # red on main the event still fired, every job's `if` evaluated false, and
  # GitHub recorded the whole workflow as **skipped** — a grey dash in the Actions
  # list and `"conclusion": "skipped"` over the API. Skipped is not a failure and
  # not a warning. It reads as *not applicable*.
  #
  # Measured 2026-09-02: **49 consecutive runs of this workflow concluded
  # `skipped`**, unbroken from 2026-09-01T13:06:36Z to 2026-09-02T16:14:18Z,
  # across 44 distinct revisions — over 27 hours in which the repository's own
  # docs called this audit the thing that catches what CI structurally cannot see
  # (NestJS DI failures), and it did not run once. 77 of the last 200 runs are
  # skipped. (A "last N runs" figure is not used here on purpose: it slid from 12
  # to 11 between measuring it and pushing the branch. See ADR 0097's correction.)
  #
  # So the job now ALWAYS runs and fails explicitly on a non-success trigger. Red,
  # not grey. The downstream stages still skip — correctly, because there is
  # nothing to verify — but they skip underneath a FAILED workflow, which is a
  # state nobody reads as "fine".
  #
  # For a sha that merged before this change, `scripts/check_deploy_audit_ran.sh`
  # answers the same question retrospectively.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: CI must have succeeded
        if: github.event_name == 'workflow_run'
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          if [ "$CONCLUSION" = "success" ]; then
            echo "✅ CI succeeded for $SHA — proceeding with the ordered health audit"
            exit 0
          fi
          echo "::error::CI concluded '$CONCLUSION' for $SHA, so the deploy audit"
          echo "::error::cannot verify anything — and Railway deployed on the push"
          echo "::error::regardless. This is a FAILURE, not a skip: production is"
          echo "::error::running an unverified build right now."
          echo ""
          echo "Re-run once CI is green:  gh workflow run deploy.yml -f mode=deploy-audit"
          exit 1

      - name: Manual dispatch acknowledged
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual deploy audit mode=${{ inputs.mode }} sha=${{ github.sha }}"

  # ── Stage 1: Agent orchestrator (9 agents must be Active) ─────────────────
  verify-orchestrator:
    name: "Stage 1 — Agent Orchestrator"
    runs-on: ubuntu-latest
    needs: [ci-gate]
    if: >-
      github.event_name == 'workflow_run'
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-audit')
    steps:
      - name: Check orchestrator URL
        id: check
        run: |
          # Same rule as the gateway stage below: a missing URL means this
          # audit cannot do its job, and saying "success" would be a lie the
          # next deploy relies on. It warned and passed until 2026-08-28.
          if [ -z "$ORCHESTRATOR_URL" ]; then
            echo "::error::RAILWAY_ORCHESTRATOR_URL is not set, so the"
            echo "::error::orchestrator cannot be health-checked."
            echo ""
            echo "  gh secret set RAILWAY_ORCHESTRATOR_URL --body 'https://<host>'"
            exit 1
          fi
          echo "RAILWAY_ORCHESTRATOR_URL is set."

      - name: Poll orchestrator /health (up to 10 min)
        run: |
          set -euo pipefail
          URL="${ORCHESTRATOR_URL%/}/health"
          echo "Polling $URL ..."
          for i in $(seq 1 60); do
            if curl -fsS "$URL" -o /tmp/orch-health.json; then
              echo "Orchestrator healthy on attempt $i"
              cat /tmp/orch-health.json
              exit 0
            fi
            echo "Attempt $i/60 — waiting 10s ..."
            sleep 10
          done
          echo "::error::Orchestrator /health did not become ready within 10 minutes"
          exit 1

      - name: Verify 9/9 agents Active
        run: |
          set -euo pipefail
          URL="${ORCHESTRATOR_URL%/}/api/v1/health/agents"
          HEADERS=()
          if [ -n "${ADMIN_API_KEY:-}" ]; then
            HEADERS=(-H "X-Admin-Key: ${ADMIN_API_KEY}")
          fi
          curl -fsS "${HEADERS[@]}" "$URL" -o /tmp/agents.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/agents.json"))
          agents = data if isinstance(data, list) else data.get("agents", data.get("data", []))
          if not agents:
              print("::error::No agents returned from /api/v1/health/agents")
              sys.exit(1)
          inactive = [a for a in agents if str(a.get("status", "")).lower() not in ("active", "healthy", "running")]
          print(f"Agents reported: {len(agents)}")
          if inactive:
              print("::error::Inactive agents:", inactive)
              sys.exit(1)
          print("✅ All agents Active")
          PY

  # ── Stage 2: API gateway (depends on orchestrator) ─────────────────────────
  verify-api-gateway:
    name: "Stage 2 — API Gateway"
    runs-on: ubuntu-latest
    needs: [verify-orchestrator]
    if: >-
      github.event_name == 'workflow_run'
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-audit')
    # Exposed so deploy-audit (a separate job) can record what was actually
    # VERIFIED, not just what was merged — see the audit-summary step below;
    # a false "provenance_verified: true" against the raw merge sha, on the
    # exact watch-path-skip case this whole file exists to make green, is
    # the same absence-reported-as-health shape one layer up (found by PR
    # #291's own security audit before this ever landed).
    outputs:
      gateway_commit: ${{ steps.expect.outputs.expect }}
    steps:
      # Pinned to the audited revision, not to whatever main has become — three
      # or four sessions merge into this repo concurrently, so `main` at audit
      # time is routinely a different commit from the one being audited, and the
      # check script must be the version that shipped with it.
      #
      # fetch-depth: 0 (full history) is required by the "resolve which commit
      # this service should be running" step below — it walks `git log` back
      # from the audited sha looking for the last commit that touched the
      # gateway's own watched paths, which a shallow clone would not have.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # A MISSING SECRET IS A BROKEN AUDIT, NOT A PASSING ONE.
      #
      # This step used to `::warning::` and set skip=true, so the whole stage
      # reported SUCCESS having verified nothing. On 2026-08-28 that is exactly
      # what happened: `API_GATEWAY_URL` was never set, every deploy audit since
      # this workflow was written reported a green "Stage 2 — API Gateway", and
      # the gateway was never once checked. A check that cannot check must say
      # so — the same rule the guard scripts in ci.yml keep, and the same
      # failure `CI Complete` was hardened against the same day.
      - name: API gateway URL is configured
        run: |
          if [ -z "$API_GATEWAY_URL" ]; then
            echo "::error::API_GATEWAY_URL is not set, so the gateway cannot be"
            echo "::error::health-checked and this audit cannot do its job."
            echo ""
            echo "Set it to the gateway origin with no trailing path, e.g."
            echo "  gh secret set API_GATEWAY_URL --body 'https://<your-gateway-host>'"
            echo ""
            echo "This step used to warn and pass. It failed silently for every"
            echo "deploy this workflow has ever audited."
            exit 1
          fi
          echo "API_GATEWAY_URL is set."

      # POLLS A URL THAT EXISTS.
      #
      # The old target was `${API_GATEWAY_URL}/health`, which has never resolved:
      # the gateway sets a global `api/v1` prefix, and the only `health`
      # controller is JWT-guarded. Measured against production on 2026-08-28 —
      # `/health` 404, `/api/v1/health` 404, `/api/v1/health/agents` 401. So even
      # with the secret set, this step would have failed for the wrong reason.
      #
      # `/api/v1/health/live` is the dependency-free liveness route added
      # alongside this change. A 200 from it proves the process started, Nest
      # built its injector and routing is live — the boot-failure class CI
      # structurally cannot see, because a module that fails to wire up compiles
      # and tests green.
      - name: Poll api-gateway liveness (up to 5 min)
        run: |
          set -euo pipefail
          URL="${API_GATEWAY_URL%/}/api/v1/health/live"
          echo "Polling $URL ..."
          for i in $(seq 1 30); do
            CODE="$(curl -sS -o /tmp/gw-health.json -w '%{http_code}' --max-time 15 "$URL" || echo 000)"
            if [ "$CODE" = "200" ]; then
              echo "API gateway live on attempt $i"
              cat /tmp/gw-health.json
              exit 0
            fi
            echo "Attempt $i/30 — HTTP $CODE, waiting 10s ..."
            sleep 10
          done
          echo "::error::API gateway did not answer 200 at $URL within 5 minutes."
          echo "::error::Last response: HTTP $CODE"
          echo "::error::A 404 here means the route is missing (check the api/v1"
          echo "::error::prefix); a 000 means the host never answered; a 502 means"
          echo "::error::the process is not up — the NestJS DI failure CI cannot see."
          exit 1

      # ── WHICH COMMIT SHOULD api-gateway ACTUALLY BE RUNNING? ─────────────────
      #
      # Not necessarily the raw merged sha. Railway's @wineops/api-gateway only
      # rebuilds when a push touches paths in ITS OWN watchPatterns
      # (apps/api-gateway/**, pnpm-lock.yaml, pnpm-workspace.yaml, package.json —
      # confirmed via `railway deployment list --json` ->
      # .meta.serviceManifest.build.watchPatterns). A merge that doesn't touch
      # those paths makes Railway correctly SKIP a rebuild
      # (meta.skippedReason: "No changes to watched files"), and the service
      # keeps serving whatever it already built — comparing that against the raw
      # merged sha is comparing against a sha the service was never going to
      # build from.
      #
      # Confirmed live twice in a row, 2026-09-03: PR #284 (docs only) and
      # PR #261 (CI/tooling/.claude/.planning only, ADR 0090) both correctly
      # skipped a gateway rebuild and both then failed "The deployed build IS
      # the merged build" for it — the running gateway (`2e9d0723`, the actual
      # last commit to touch apps/api-gateway) was reported as a MISMATCH
      # against a sha (`ce519d42`) whose own diff has zero lines under apps/.
      # Nothing was broken; the check was comparing against the wrong sha.
      #
      # scripts/resolve_watched_commit.py --self-test proves the resolution
      # logic against a real git repo before it is trusted to gate a real audit
      # — the same "prove the guard reaches the fault" rule the ci.yml guards
      # keep, applied here even though this workflow doesn't wire it into
      # ci.yml's required-check graph (it needs no live target, but neither did
      # check_deployed_sha.py's own self-test, and that one isn't wired in
      # either — this stays consistent with that precedent rather than growing
      # CI Complete's hand-maintained needs list for a post-merge-only guard).
      - name: The gateway's watched-path resolution logic still holds
        run: python3 scripts/resolve_watched_commit.py --self-test

      - name: Resolve which commit api-gateway should be running
        id: expect
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          RESOLVED="$(python3 scripts/resolve_watched_commit.py \
            --sha "$SHA" \
            --paths apps/api-gateway pnpm-lock.yaml pnpm-workspace.yaml package.json)"
          echo "Merged: $SHA"
          echo "api-gateway's watched paths were last touched at: $RESOLVED"
          echo "expect=$RESOLVED" >> "$GITHUB_OUTPUT"

      # ── THE STEP THAT MAKES THE STAGE ABOVE MEAN SOMETHING ──────────────────
      #
      # A 200 from liveness proves *a* process is up. It does not say WHICH ONE,
      # and the previous instance answers 200 perfectly — so a green audit during
      # a FAILED deploy was indistinguishable from a good one. Every "deployed
      # and healthy" claim in this repository rested on that gap.
      #
      # This compares the revision the running process was BUILT from against
      # the commit resolved above — the last commit (at or before the merge)
      # that actually touched something Railway watches for this service, NOT
      # necessarily the raw merged sha (see the step above). It polls, because
      # Railway builds and swaps the instance on its own schedule and "not yet"
      # and "never" look identical at any single instant; only a deadline
      # separates them.
      #
      # It fails on `commit: "unknown"` as well as on a mismatch. That is
      # deliberate — an audit that accepts "unknown" certifies its own blindness.
      # See the script's ADVICE block for exactly which variable to set.
      - name: The deployed build IS the build it should be
        run: |
          python3 scripts/check_deployed_sha.py \
            --url "$API_GATEWAY_URL" \
            --expect "${{ steps.expect.outputs.expect }}" \
            --timeout-seconds 600 \
            --poll-seconds 10

      # Readiness is a DIFFERENT question from liveness: liveness is
      # dependency-free by design, so it answers 200 while the Supabase client
      # was never initialised and every data route returns 500. This one cannot.
      #
      # Unauthenticated on purpose (see readiness.controller.ts): the previous
      # version of this step used the JWT-guarded proxy and therefore ran only
      # when `E2E_TEST_TOKEN` happened to be set — a check that silently does not
      # run, which is the fault this whole file is being repaired for.
      - name: Gateway is READY, not merely alive
        run: |
          set -uo pipefail
          URL="${API_GATEWAY_URL%/}/api/v1/health/ready"
          echo "Polling $URL ..."
          for i in $(seq 1 30); do
            CODE="$(curl -sS -o /tmp/gw-ready.json -w '%{http_code}' --max-time 15 "$URL" || echo 000)"
            if [ "$CODE" = "200" ]; then
              echo "Gateway ready on attempt $i"
              cat /tmp/gw-ready.json
              exit 0
            fi
            echo "Attempt $i/30 — HTTP $CODE"
            [ -s /tmp/gw-ready.json ] && cat /tmp/gw-ready.json
            sleep 10
          done
          echo "::error::The gateway never reported ready at $URL."
          echo "::error::A 503 carries a \`checks\` object naming which half failed:"
          echo "::error::  supabaseClient=missing  -> the process is up and was never"
          echo "::error::                             configured (liveness says 'ok')"
          echo "::error::  database=unreachable    -> the process is up and cannot"
          echo "::error::                             serve a single data route"
          echo "::error::A 404 means the route is missing; 000 means nothing answered."
          exit 1

  # ── Stage 3: Frontend build smoke + web provenance (ADR 0219) ──────────────
  verify-frontend:
    name: "Stage 3 — Frontend Build"
    runs-on: ubuntu-latest
    needs: [verify-api-gateway]
    if: >-
      github.event_name == 'workflow_run'
      || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-audit')
    # Exposed for the same reason Stage 2 exposes gateway_commit: deploy-audit
    # records what was actually VERIFIED (FLOOR — see resolve_watched_commit.py),
    # not just the raw merged sha (ADR 0219).
    outputs:
      web_commit_expected: ${{ steps.web-expect.outputs.expect }}
    steps:
      # fetch-depth: 0 (full history), same requirement as Stage 2 and for the
      # same reason: scripts/check_web_deployed_sha.py and
      # scripts/resolve_watched_commit.py both walk `git log`/`merge-base`
      # against this checkout, which a shallow clone cannot answer (their own
      # self-tests build a full throwaway repo precisely because a partial one
      # would prove nothing).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build --filter=web
        env:
          VITE_API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL || 'https://placeholder.railway.app' }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder' }}

      # ── WEB PROVENANCE (ADR 0219) ───────────────────────────────────────────
      #
      # On 2026-09-21 two production merges (#421, #424) were refused by
      # Vercel's deployment cap and mudavym.com kept serving #418's build for
      # hours. The only check here was the "Production URL smoke" step this
      # replaces — `curl` for HTTP 200, which the STALE previous build answers
      # perfectly — and it did not even run: it was gated on
      # VERCEL_PRODUCTION_URL, which is not set as a repository secret
      # (`gh secret list`, 2026-09-22), so it concluded "skipped" in all 37 of
      # the last 40 runs that reached this stage (2026-09-11 to 2026-09-22).
      # A 200 proves *a* build is serving, never WHICH one (ADR 0097's lesson
      # for the gateway, one service over). The founder, asked 2026-09-22 "may
      # I add a check that fails loudly when mudavym.com is not serving the
      # latest web commit?", chose the option "Yes, add it (Recommended)".
      #
      # The URL defaults to https://mudavym.com, the address named in the
      # question the founder approved, and a public name, not a secret. A
      # VERCEL_PRODUCTION_URL secret, if one is ever set, overrides it. It can
      # therefore never be empty, and this stage can no longer skip itself
      # into a pass.
      - name: Which production URL is checked
        env:
          WEB_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL || 'https://mudavym.com' }}
        run: |
          if [ -z "$WEB_PRODUCTION_URL" ]; then
            echo "::error::No production URL to check; this stage cannot do its job."
            exit 1
          fi
          echo "Checking $WEB_PRODUCTION_URL"

      # --self-test builds a real throwaway git repo, a clone of it and a real
      # HTTP server and drives every state (MATCH/UNCHANGED/SUPERSEDED/STALE/
      # PAGE_MALFORMED/NETWORK_UNREACHABLE/UNKNOWN_MARKER/DIVERGENT/
      # CANNOT_RESOLVE) end to end, including the tip refresh. --check-paths
      # fails when the web bundle imports a file the watched-path list does
      # not cover (a gap there lets a stale build pass). CLAIMS rows run both
      # on every pull request (ADR 0219), so this step re-proves them here.
      - name: The web provenance check's own logic still holds
        run: |
          set -euo pipefail
          python3 scripts/check_web_deployed_sha.py --self-test
          python3 scripts/check_web_deployed_sha.py --check-paths

      # ── WHICH COMMIT SHOULD THE WEB BE RUNNING, AT LEAST? ───────────────────
      #
      # Vercel builds every push to main (the web project has no Ignored Build
      # Step), but a push whose build is refused or fails leaves the previous
      # build serving. When that push touched nothing the web build reads, the
      # page is unchanged, so the floor is the last commit at or before the
      # merged sha that touched a watched path. --print-floor reads the same
      # DEFAULT_PATHS list the check below uses, so the recorded
      # web_commit_expected is the floor that was actually checked.
      - name: Resolve which commit the web should be running
        id: web-expect
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          RESOLVED="$(python3 scripts/check_web_deployed_sha.py --print-floor --sha "$SHA")"
          echo "Merged: $SHA"
          echo "web's watched paths were last touched at: $RESOLVED"
          echo "expect=$RESOLVED" >> "$GITHUB_OUTPUT"

      # tip(main) is fetched here, not read from HEAD: with no `ref`,
      # actions/checkout checks out github.sha, which for a workflow_run event
      # is main's tip when the event fired, so HEAD is already behind any
      # merge that landed while Stages 1-2 and the build above ran. The check also
      # gets --refresh-remote origin, so a merge that lands (and that Vercel
      # serves) during its own poll is fetched and classified against, rather
      # than read as DIVERGENT.
      - name: Resolve tip(main), fresh
        id: web-tip
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TIP="$(git rev-parse --verify "refs/remotes/origin/main^{commit}")"
          echo "tip(main) at check time: $TIP"
          echo "tip=$TIP" >> "$GITHUB_OUTPUT"

      # THE STEP THAT MAKES THIS STAGE MEAN SOMETHING. Polls the served
      # <meta name="mudavym:commit"> (written at build time by
      # apps/web/src/lib/build-provenance.ts) until it reports a commit inside
      # [FLOOR, tip(main)], or 600 s pass. Vercel's measured web build time
      # over 19 READY builds: median 72 s, max 104 s.
      - name: The deployed web build IS the build it should be
        env:
          WEB_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL || 'https://mudavym.com' }}
        run: |
          python3 scripts/check_web_deployed_sha.py \
            --url "${WEB_PRODUCTION_URL%/}/" \
            --sha "${{ github.event.workflow_run.head_sha || github.sha }}" \
            --tip "${{ steps.web-tip.outputs.tip }}" \
            --refresh-remote origin \
            --timeout-seconds 600 \
            --poll-seconds 15

  # ── Post-deploy audit artifact ─────────────────────────────────────────────
  deploy-audit:
    name: Deploy Audit Record
    runs-on: ubuntu-latest
    needs: [verify-orchestrator, verify-api-gateway, verify-frontend]
    if: >-
      always()
      && needs.ci-gate.result == 'success'
      && (github.event_name == 'workflow_run'
          || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-audit'))
    steps:
      # `provenance_verified` is the field that matters. Stage results alone say
      # only that nothing complained; this says the running gateway named the
      # EXPECTED revision as its own build. The record now distinguishes "we
      # checked and it is the right build" from "nothing failed".
      #
      # CORRECTED (found live, PR #291's own security audit): "the right
      # build" is not always `commit` below. Stage 2 compares against
      # `gateway_commit` (verify-api-gateway's resolved watch-path commit —
      # see resolve_watched_commit.py), which on the exact watch-path-skip
      # case this file exists to make green legitimately differs from the
      # raw merged sha. Recording only `commit` + `provenance_verified: true`
      # made this artifact assert "the gateway named THIS sha as its own
      # build" for a sha the gateway never ran — the repo's own
      # absence-reported-as-health shape, in a 90-day-retained record nothing
      # else re-derives. `gateway_commit` (empty when Stage 2 didn't run, or
      # equal to `commit` on an ordinary rebuild) makes that distinction
      # readable without re-deriving it from the run logs.
      - name: Write audit summary
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          GW="${{ needs.verify-api-gateway.result }}"
          FE="${{ needs.verify-frontend.result }}"
          GATEWAY_COMMIT="${{ needs.verify-api-gateway.outputs.gateway_commit }}"
          WEB_COMMIT_EXPECTED="${{ needs.verify-frontend.outputs.web_commit_expected }}"
          if [ "$GW" = "success" ]; then PROV=true; else PROV=false; fi
          # Mirrors the gateway's own PROV derivation one paragraph up: the
          # step this depends on (verify-frontend's "The deployed web build
          # IS the build it should be") is the one that actually polled
          # mudavym.com's served commit and classified it against
          # [FLOOR, tip(main)] — see scripts/check_web_deployed_sha.py. A
          # SUCCESS job result here means that step ended in a MATCH/
          # UNCHANGED/SUPERSEDED verdict, never merely "curl saw 200" (the
          # field this replaces — ADR 0219).
          if [ "$FE" = "success" ]; then WEB_PROV=true; else WEB_PROV=false; fi
          cat > deploy-audit.json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${SHA}",
            "gateway_commit": "${GATEWAY_COMMIT}",
            "provenance_verified": ${PROV},
            "provenance_means": "the gateway's /api/v1/health/live reported gateway_commit (not necessarily the merged commit — see resolve_watched_commit.py for path-scoped services) as its own build, and /api/v1/health/ready answered 200",
            "orchestrator": "${{ needs.verify-orchestrator.result }}",
            "api_gateway": "${GW}",
            "frontend": "${FE}",
            "web_commit_expected": "${WEB_COMMIT_EXPECTED}",
            "web_provenance_verified": ${WEB_PROV},
            "web_provenance_means": "mudavym.com's served <meta name=\"mudavym:commit\"> (apps/web/src/lib/build-provenance.ts) reported a commit inside [web_commit_expected, tip(main) at check time] — not necessarily the merged commit itself, same path-scoped reasoning as gateway_commit (scripts/check_web_deployed_sha.py, ADR 0219). NOT merely that curl saw HTTP 200, which is what this field replaced.",
            "recheck": "scripts/check_deploy_audit_ran.sh ${SHA}",
            "rollback_hint": "Re-run this workflow with mode=rollback-guide and rollback_target_sha=<previous-good-sha>"
          }
          EOF
          cat deploy-audit.json

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-audit-${{ github.run_id }}
          path: deploy-audit.json
          retention-days: 90

      - name: Fail if any stage failed
        if: >-
          needs.verify-orchestrator.result != 'success'
          || needs.verify-api-gateway.result != 'success'
          || needs.verify-frontend.result != 'success'
        run: |
          echo "::error::One or more deploy verification stages failed — investigate before promoting traffic"
          exit 1

      - name: Trigger production E2E gate (non-blocking)
        if: >-
          needs.verify-orchestrator.result == 'success'
          && needs.verify-api-gateway.result == 'success'
          && needs.verify-frontend.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run e2e-prod.yml \
            -f triggered_by_deploy=true \
            -f deploy_url="${VERCEL_PRODUCTION_URL:-}" \
            || echo "E2E workflow dispatch skipped (missing permissions or workflow name)"

  # ── Rollback guide (manual revert playbook) ────────────────────────────────
  rollback-guide:
    name: Rollback Playbook
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rollback-guide'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Print revert steps
        run: |
          TARGET="${{ inputs.rollback_target_sha }}"
          if [ -z "$TARGET" ]; then
            TARGET="$(git rev-parse HEAD~1)"
            echo "No rollback_target_sha provided — defaulting to previous commit: $TARGET"
          fi
          cat <<EOF

          ═══════════════════════════════════════════════════════════════
          PRODUCTION ROLLBACK PLAYBOOK (manual — safety preserved)
          ═══════════════════════════════════════════════════════════════

          Target commit: $TARGET

          1. Railway — agent-orchestrator
             Dashboard → agent-orchestrator → Deployments → Redeploy the deployment
             built from commit $TARGET (do NOT use "Restart" — redeploy the prior image).

          2. Railway — api-gateway
             Same: Redeploy the deployment for commit $TARGET.

          3. Vercel — frontend
             Dashboard → Deployments → find deployment for $TARGET → Promote to Production.

          4. Verify (ordered). \$API_GATEWAY_URL/health has never existed — the
             gateway sets a global api/v1 prefix — so use the real routes:
             curl \$RAILWAY_ORCHESTRATOR_URL/health
             curl \$RAILWAY_ORCHESTRATOR_URL/api/v1/health/agents  # 9/9 Active
             curl \$API_GATEWAY_URL/api/v1/health/live    # names the build
             curl \$API_GATEWAY_URL/api/v1/health/ready   # 200 only if it can serve
             curl \$VERCEL_PRODUCTION_URL/

             The rollback is not done until \`live\` reports $TARGET. A 200 alone
             proves nothing: the instance you are trying to replace answers it too.
             python3 scripts/check_deployed_sha.py --url \$API_GATEWAY_URL --expect $TARGET

          5. Re-run deploy-audit:
             gh workflow run deploy.yml -f mode=deploy-audit

          Git revert (if you need a forward fix on main):
             git revert <bad-sha>..HEAD
             git push origin main

          EOF
