# .github/workflows/e2e-prod.yml
# Production E2E — the nightly, rebuilt 2026-09-11 (ADR 0135)
# ==============================================================
# Nightly cron (observability) + workflow_dispatch (run it by hand against
# production, or as the deploy-triggered gate deploy.yml already fires).
#
# WHAT IT ASSERTS, AND HOW IT REPORTS
#   Every check ends in ONE of four states, counted separately in the summary
#   (scripts/e2e/nightly_summary.py, also written to the job summary):
#     pass          the assertion held
#     fail          the assertion ran and did not hold — a production signal
#     absent        the surface is not on this build, or this house has nothing
#                   to open it on — reported, never a pass
#     cannot_check  the check did not run (missing secret, unreachable service,
#                   empty corpus) — RED on purpose (exit 2), never a pass
#   Nothing here asserts on a figure. Nothing here writes to production: Wave H
#   is read-only, and the browser walk ABORTS every non-GET request the app
#   attempts except the token refresh and the flag read (ReadOnlyGuard in
#   apps/web/e2e/nightly/lib.ts), listing what it aborted. The walk opens only
#   the houses on apps/web/e2e/nightly/sim-houses.json. The legacy waves' session
#   teardown no longer deletes the `sim-*` houses unless E2E_SIM_TEARDOWN=1
#   (tests/e2e/conftest_prod.py — measured 2026-09-11: it would have deleted
#   all four simulator houses on the first run with a service-role key).
#
# HISTORY WORTH KEEPING
#   120 runs 2026-05-06..2026-09-02, 118 failed, none with credentials — the
#   red meant "not configured" and read as "production is broken"
#   (.planning/v3.0-TECH-DEBT.md "CI — the nightly production E2E…").
#   The orchestrator URL the legacy waves target answered 404 "Application not
#   found" on 2026-09-11; the preflight below turns that into cannot_check with
#   the reason in the name instead of six waves of red.
#
# HOW TO READ, RUN AND CHANGE IT: apps/web/e2e/README.md
#
# SECRETS (names only). Credential values are not printed: the steps below echo
# names; pytest runs --tb=short (no locals); every gateway call in the browser
# walk goes through lib.ts `gateway()`, which rethrows only a redacted first
# line, and every recorded reason and evidence passes `redact()` — because a
# Playwright network error's "Call log" lists `authorization: Bearer <jwt>`, and
# before 2026-09-17 that reached the summary and the artifact (audit of PR #349
# at e18b1d48, finding B1; reproduced with sentinels, fixed, re-proven).
# scripts/check_nightly_manifest.py fails the build on a raw request call. The
# two TARGET URLs ARE printed, unmasked, because they are public — the web
# bundle carries the gateway URL.
#   REQUIRED — without any one of these the run proves NOTHING and the first
#   step exits 2 with the missing names in its log:
#     API_GATEWAY_URL            the NestJS gateway (already set — deploy.yml)
#                                read by tests/e2e_gateway/conftest.py and
#                                apps/web/e2e/nightly/lib.ts (as E2E_API_URL)
#     E2E_TEST_EMAIL             the e2e account — aldemirkonuk@mudavym.com
#                                (the founder registers it; a session grants it
#                                a simulator house) — lib.ts, conftest.py
#     E2E_TEST_PASSWORD          its password — same readers
#   OPTIONAL — each changes what is covered, and its absence is reported:
#     VERCEL_PRODUCTION_URL      the web app; defaults to https://mudavym.com
#     RAILWAY_ORCHESTRATOR_URL   the FastAPI orchestrator (Waves A–C).
#                                Probed first; unreachable = cannot_check
#     ADMIN_API_KEY              Wave B (orchestrator agent health)
#     SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
#                                the legacy waves' prod_jwt / prod_supabase
#                                fixtures (conftest_prod.py). NOT needed by the
#                                browser walk or Wave H. The service-role key
#                                arms the legacy session teardown — see above
#     RABBITMQ_URL               Wave C
#     SENTRY_DSN                 failure alerting only
#     E2E_LEGACY_RESTAURANT_ID   REFUSED if it names a house other than the
#                                account's own (founder, 2026-09-17): the gateway
#                                scopes by the sign-in token, so a second house
#                                needs a second account (F3 reopened). The legacy
#                                pass walks the account's house with the
#                                per-browser override forcing legacy.
#   RETIRED — Waves D (Toast), E (Gmail) and G (Calendar) were deleted
#   2026-09-12 (ADR 0137), and with them the Toast webhook secret and both Gmail
#   credentials: an unused secret mapped into a job env is readable by every
#   step and action in it.
#
# PACING
#   Every /api/v1/auth/* route is limited to 10 requests per 60 s per IP+route
#   (rate-limit.guard.ts). The walk boots the SPA once per pass and navigates
#   with pushState; Playwright runs one worker; the `concurrency` group below
#   keeps two runs from sharing the runner IP's budget. /auth/sign-in-methods
#   is 10 per 10 minutes — the form sign-in runs once.
#
# CRITICAL: PYTEST_RUNNING is NEVER set here (main.py disables Sentry on it).

name: Production E2E Tests

on:
  schedule:
    - cron: '0 2 * * *' # nightly 02:00 UTC — observability
  workflow_dispatch:
    inputs:
      triggered_by_deploy:
        description: 'Set to true when triggered by a production deploy'
        type: boolean
        default: false
      deploy_url:
        description: 'Production deploy URL (Vercel deployment URL)'
        type: string
        default: ''
      pr_number:
        description: 'PR number to comment on (deploy-triggered only)'
        type: string
        default: ''
      expect_flags:
        description: 'What the house''s mudavym_design_* flags are expected to be: report (default), on, off'
        type: choice
        options: [report, on, off]
        default: report
      base_url:
        description: 'Override the web app URL (default: VERCEL_PRODUCTION_URL secret, else https://mudavym.com)'
        type: string
        default: ''
      api_url:
        description: 'Override the gateway URL (default: API_GATEWAY_URL secret)'
        type: string
        default: ''

concurrency:
  group: e2e-prod
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  e2e-prod:
    name: Production E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Targets
      API_GATEWAY_URL: ${{ inputs.api_url || secrets.API_GATEWAY_URL }}
      E2E_API_URL: ${{ inputs.api_url || secrets.API_GATEWAY_URL }}
      E2E_BASE_URL: ${{ inputs.base_url || secrets.VERCEL_PRODUCTION_URL || 'https://mudavym.com' }}
      RAILWAY_ORCHESTRATOR_URL: ${{ secrets.RAILWAY_ORCHESTRATOR_URL }}
      # The account
      # E2E_TEST_EMAIL / E2E_TEST_PASSWORD are mapped only into the steps that
      # sign in or scrub (re-audit 2026-09-17, security N4): never into installs.
      E2E_EXPECT_FLAGS: ${{ inputs.expect_flags || 'report' }}
      E2E_LEGACY_RESTAURANT_ID: ${{ secrets.E2E_LEGACY_RESTAURANT_ID }}
      # The legacy waves' SUPABASE_* / ADMIN_API_KEY / RABBITMQ_URL are mapped
      # ONLY into the steps that read them (audit 2026-09-17, security N4): a
      # secret in the job env is readable by every step and action, pnpm
      # install included.
      # The Toast and Gmail secrets are not mapped: waves D and E are retired (ADR 0137)
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GITHUB_SHA: ${{ github.sha }}
      TRIGGERED_BY_DEPLOY: ${{ inputs.triggered_by_deploy || 'false' }}
      # PYTEST_RUNNING is intentionally NOT set (main.py:27 disables Sentry on it).

    steps:
      # -----------------------------------------------------------------------
      # 0. SECRETS PRECONDITION — first, before any install. exit 2 = the check
      #    itself could not run (repo-wide guard convention); names only, never values.
      # -----------------------------------------------------------------------
      - name: Required secrets are present
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
        run: |
          REQUIRED="API_GATEWAY_URL E2E_TEST_EMAIL E2E_TEST_PASSWORD E2E_BASE_URL"
          OPTIONAL="RAILWAY_ORCHESTRATOR_URL ADMIN_API_KEY SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY RABBITMQ_URL SENTRY_DSN E2E_LEGACY_RESTAURANT_ID"
          MISSING=""
          for name in $REQUIRED; do
            if [ -z "${!name:-}" ]; then MISSING="$MISSING $name"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "CANNOT CHECK -- missing secrets:$MISSING"
            echo "::error title=Production E2E cannot check::CANNOT CHECK -- missing secrets:$MISSING"
            echo "This run proves NOTHING about production. It is red because the workflow is not"
            echo "configured, not because production is broken. Set the names above as repository"
            echo "secrets (Settings > Secrets and variables > Actions), then re-run."
            exit 2
          fi
          echo "All required secrets present -- this run's result is a real production signal."
          for name in $OPTIONAL; do
            if [ -z "${!name:-}" ]; then
              echo "::notice title=Optional secret unset::$name is unset -- what it gates is reported as cannot_check or absent, never as a pass."
            fi
          done
          case "$E2E_BASE_URL" in *localhost*|*127.0.0.1*|*0.0.0.0*) echo "::error::E2E_BASE_URL points at a local address"; exit 2;; esac
          # The sign-in test types the password into the page at this URL.
          case "$E2E_BASE_URL" in https://*) ;; *) echo "::error::E2E_BASE_URL is not https"; exit 2;; esac
          # The gateway URL is the one that RECEIVES E2E_TEST_EMAIL and
          # E2E_TEST_PASSWORD on every login (audit of PR #349, finding 1.2), so it
          # gets the same refusal, plus a scheme check: a plain-http gateway would
          # carry the password in the clear.
          case "$API_GATEWAY_URL" in *localhost*|*127.0.0.1*|*0.0.0.0*) echo "::error::API_GATEWAY_URL points at a local address"; exit 2;; esac
          case "$API_GATEWAY_URL" in https://*) ;; *) echo "::error::API_GATEWAY_URL is not https"; exit 2;; esac

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            services/agent-orchestrator/requirements.prod.txt
            services/agent-orchestrator/requirements.test.txt

      - name: Install Python dependencies
        working-directory: services/agent-orchestrator
        run: |
          pip install -r requirements.prod.txt
          pip install -r requirements.test.txt

      # `version:` deliberately absent — the action reads packageManager from
      # package.json (pnpm 9) and THROWS if a version is also given (ADR 0106).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Bundled Chromium. The retired config asked for `channel: 'chrome'`, which
      # this step never installed — Wave F could not have launched a browser.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Create test-results directory
        run: mkdir -p test-results services/agent-orchestrator/test-results apps/web/test-results

      # -----------------------------------------------------------------------
      # 1. ORCHESTRATOR PREFLIGHT — a 404 here used to be six waves of red.
      # -----------------------------------------------------------------------
      - name: Orchestrator preflight
        id: preflight
        env:
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
        run: |
          # Wave C stays unarmed by the founder's F2 answer; while RABBITMQ_URL is
          # unset the summary reports it absent by decision (2026-09-17), not unchecked.
          if [ -z "${RABBITMQ_URL:-}" ]; then
            printf '{"unarmed": true, "reason": "Wave C is unarmed by decision (founder F2, ADR 0135): RABBITMQ_URL is unset, so it publishes nothing and is reported absent"}\n' > test-results/wave_c_unarmed.json
          fi
          OUT=test-results/orchestrator-preflight.json
          if [ -z "${RAILWAY_ORCHESTRATOR_URL:-}" ]; then
            printf '{"reachable": false, "status": null, "reason": "RAILWAY_ORCHESTRATOR_URL is unset -- Waves A-C cannot run"}\n' > "$OUT"
            echo "reachable=false" >> "$GITHUB_OUTPUT"; cat "$OUT"; exit 0
          fi
          # `-w` already prints 000 on a connection failure; `|| true` keeps it from
          # becoming "000000", which made the file invalid JSON (correctness 4).
          CODE=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "${RAILWAY_ORCHESTRATOR_URL%/}/health" || true)
          case "$CODE" in ''|*[!0-9]*) CODE=000;; esac
          if [ "$CODE" = "200" ]; then
            printf '{"reachable": true, "status": 200, "reason": "GET RAILWAY_ORCHESTRATOR_URL/health answered 200"}\n' > "$OUT"
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            printf '{"reachable": false, "status": "%s", "reason": "GET RAILWAY_ORCHESTRATOR_URL/health answered HTTP %s (000 = no answer) -- Waves A-C are cannot_check, not failed"}\n' "$CODE" "$CODE" > "$OUT"
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Orchestrator unreachable::HTTP $CODE from RAILWAY_ORCHESTRATOR_URL/health -- Waves A-C recorded as cannot_check"
          fi
          cat "$OUT"

      # -----------------------------------------------------------------------
      # 2. WAVE H — the gateway, read-only (contracts, flags, backtest honesty)
      # -----------------------------------------------------------------------
      - name: Wave H — Gateway contracts + backtest honesty (read-only)
        working-directory: services/agent-orchestrator
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_CHECKS_FILE: ../../test-results/wave_h_checks.jsonl
        run: |
          pytest tests/e2e_gateway \
            --junitxml=../../test-results/wave_h.xml \
            -v --tb=short -q -p no:cacheprovider \
            2>&1 | tee ../../test-results/wave_h.log || true

      # -----------------------------------------------------------------------
      # 3. WAVE F — the browser walk (every rebuilt page, flag on and off)
      # -----------------------------------------------------------------------
      # Playwright's own output stays on the runner: its stdout goes to the job log
      # only (GitHub masks secret values there, not in files), and
      # apps/web/test-results/ (error-context.md holds every input's value when a
      # test fails) is never uploaded (re-audit 2026-09-17, B2). The reporter's
      # redacted summary and screenshots are copied out; wave_f.xml is copied for
      # the cascading report and passes the scrub step like everything uploaded.
      - name: Wave F — Browser walk (Playwright)
        working-directory: apps/web
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          npx playwright test --config playwright.nightly.config.ts || true
          cp test-results/wave_f.xml ../../test-results/wave_f.xml 2>/dev/null || true
          mkdir -p ../../test-results/nightly
          cp -R test-results/nightly/. ../../test-results/nightly/ 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 4. LEGACY WAVES A–C — only when the orchestrator answered.
      #    Their session teardown is dry-run unless E2E_SIM_TEARDOWN=1 (never set here).
      # -----------------------------------------------------------------------
      - name: Wave A — API Contract Tests (orchestrator)
        if: steps.preflight.outputs.reachable == 'true'
        working-directory: services/agent-orchestrator
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          pytest tests/e2e/wave_a_api_contracts.py --junitxml=../../test-results/wave_a.xml -v --tb=short -q 2>&1 | tee ../../test-results/wave_a.log || true

      - name: Waves B+C — Agent Health + RabbitMQ Triggers (orchestrator, concurrent)
        if: steps.preflight.outputs.reachable == 'true'
        working-directory: services/agent-orchestrator
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
        run: |
          pytest tests/e2e/wave_b_agent_health.py --junitxml=../../test-results/wave_b.xml -v --tb=short -q 2>&1 | tee ../../test-results/wave_b.log || true &
          B=$!
          pytest tests/e2e/wave_c_agent_triggers.py --junitxml=../../test-results/wave_c.xml -v --tb=short -q 2>&1 | tee ../../test-results/wave_c.log || true &
          C=$!
          wait $B || true; wait $C || true

      # Waves D, E, G — RETIRED 2026-09-12 (ADR 0137): deleted, not skipped. Each
      # tested a table or endpoint with no production consumer; repointing one
      # would re-arm a real write. This step states the reason in the log.
      - name: Waves D, E, G — retired
        run: |
          echo "::notice::Waves D (Toast), E (Gmail), G (Calendar) retired 2026-09-12 (ADR 0137) -- see .planning/decisions/0137-legacy-e2e-waves-d-e-g-are-retired-not-repointed.md"

      # -----------------------------------------------------------------------
      # 5. BACKTESTS — offline, this checkout. The canned day (ADR 0093, bistro /
      #    random / seed 7 / 2026-09-02) must regenerate to its pinned hash, and
      #    the forecast chain must return its pinned numbers. Drift = red.
      # -----------------------------------------------------------------------
      - name: Backtests — canned scenario day + pinned forecast fixture
        run: |
          set +e
          python3 -m pytest scripts/test_simulate_scenarios.py -q -p no:cacheprovider -k canned_day > test-results/backtest_canned_day.log 2>&1
          C1=$?
          (cd apps/api-gateway && npx jest src/analytics/engine/forecasting.backtest.spec.ts --ci) > test-results/backtest_forecast.log 2>&1
          C2=$?
          python3 -m pytest scripts/test_simulate_scenarios.py -q -p no:cacheprovider > test-results/backtest_scenario_engine.log 2>&1
          C3=$?
          set -e
          python3 - "$C1" "$C2" "$C3" <<'PY'
          import json, sys
          c1, c2, c3 = (int(x) for x in sys.argv[1:4])
          json.dump({"steps": [
            {"name": "scenario_canned_day", "exit": c1, "reason": "datasets/sim/fixtures/scenario-canned-day.json regenerates to its pinned hash"},
            {"name": "forecast_pinned", "exit": c2, "reason": "datasets/sim/fixtures/forecast-backtest.json — seven series return their pinned MAE/RMSE/MAPE/MASE"},
            {"name": "scenario_engine", "exit": c3, "reason": "scripts/test_simulate_scenarios.py — the whole scenario engine suite"},
          ]}, open("test-results/backtests.json", "w"), indent=2)
          PY
          tail -3 test-results/backtest_canned_day.log test-results/backtest_forecast.log test-results/backtest_scenario_engine.log

      # -----------------------------------------------------------------------
      # 6. SUMMARY — one table, four states, exit 1 on fail / 2 on cannot_check
      # -----------------------------------------------------------------------
      - name: Cascading failure report (legacy wave graph)
        if: always()
        working-directory: services/agent-orchestrator
        run: |
          python scripts/cascading_report.py --results-dir ../../test-results --output-dir ../../test-results 2>&1 | tee ../../test-results/cascading_report.log || true

      - name: Honest summary
        id: summary
        if: always()
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          set +e
          python3 scripts/e2e/nightly_summary.py --results-dir test-results --base-url "$E2E_BASE_URL" --api-url "$API_GATEWAY_URL"
          CODE=$?
          set -e
          echo "verdict_exit=$CODE" >> "$GITHUB_OUTPUT"
          echo "summary exit $CODE (0 pass · 1 fail · 2 cannot_check)"

      # Fail-closed: every file about to be uploaded is scrubbed of the test
      # password, JWTs and bearer tokens; if anything survives, nothing uploads.
      - name: Scrub the upload set
        id: scrub
        if: always()
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: python3 scripts/e2e/scrub_artifacts.py --dir test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: e2e-prod-results-${{ github.run_id }}
          path: test-results/
          retention-days: 30

      # -----------------------------------------------------------------------
      # 7. DEPLOY GATE (D-14) — alert + PR comment when a deploy triggered this
      # -----------------------------------------------------------------------
      - name: Sentry alert — deploy gate failure (D-14)
        if: |
          always() &&
          steps.summary.outputs.verdict_exit != '0' &&
          inputs.triggered_by_deploy == true
        env:
          DEPLOY_URL: ${{ inputs.deploy_url }}
          VERDICT_EXIT: ${{ steps.summary.outputs.verdict_exit }}
        run: |
          python - <<'EOF'
          import os, sentry_sdk
          dsn = os.environ.get("SENTRY_DSN")
          if dsn:
              sentry_sdk.init(dsn=dsn, traces_sample_rate=0.0)
              sentry_sdk.capture_message(
                  "Production E2E Deploy Gate did not pass",
                  level="error",
                  tags={"deploy-gate": "true", "e2e-failure": "true", "triggered_by": "deploy",
                        "verdict_exit": os.environ.get("VERDICT_EXIT", ""),
                        "github_sha": os.environ.get("GITHUB_SHA", "unknown"),
                        "deploy_url": os.environ.get("DEPLOY_URL", "")},
              )
              sentry_sdk.flush(2)
              print("Sentry deploy-gate alert fired")
          else:
              print("SENTRY_DSN unset -- no alert sent (reported, not hidden)")
          EOF

      - name: Post PR comment — deploy gate (D-14)
        if: |
          always() &&
          steps.summary.outputs.verdict_exit != '0' &&
          steps.scrub.outcome == 'success' &&
          inputs.triggered_by_deploy == true &&
          inputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          DEPLOY_URL: ${{ inputs.deploy_url }}
          VERDICT_EXIT: ${{ steps.summary.outputs.verdict_exit }}
        with:
          script: |
            const prNum = parseInt(process.env.PR_NUMBER || '', 10)
            if (!prNum) return
            const fs = require('fs')
            let table = ''
            try { table = fs.readFileSync('test-results/nightly-summary.md', 'utf8').slice(0, 60000) } catch {}
            const verdict = process.env.VERDICT_EXIT === '1' ? 'FAILED' : 'COULD NOT CHECK'
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNum,
              body: [`❌ **Production E2E deploy gate: ${verdict}** for this deploy.`, '',
                     `Deploy URL: ${process.env.DEPLOY_URL || ''}`, `GitHub SHA: ${context.sha}`, '',
                     `Artifacts: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, '', table].join('\n')
            })

      # The job's own colour follows the summary: green only when every check
      # passed or was an honest absence; exit 2 (cannot_check) is red with its
      # reason in the summary, never a skip.
      - name: Verdict
        if: always()
        run: |
          CODE="${{ steps.summary.outputs.verdict_exit }}"
          case "$CODE" in
            0) echo "PASS";;
            1) echo "::error title=Production E2E failed::at least one check failed — see the job summary"; exit 1;;
            *) echo "::error title=Production E2E could not check::at least one check could not run (exit ${CODE:-unset}) — see the job summary"; exit 2;;
          esac
