name: Schema parity

# A fresh database built from migrations must equal the remote one.
#
# This exists because of what was measured on 2026-08-05: production had 27
# tables, 403 columns and 13 functions that no migration created, because DDL had
# been applied by hand over months. restaurant_inventory alone carried 37 such
# columns, and the 13 functions were business logic with no source in the repo —
# calculate_sales_velocity, resolve_sku_to_inventory — which would have vanished
# silently had the database ever been rebuilt. A fresh `supabase db reset` could
# not complete at all.
#
# The baseline migration cleaned that up once. This job is what keeps it clean:
# it rebuilds from migrations and diffs against remote, so the next hand-applied
# ALTER fails a pull request instead of going unnoticed for a year.
#
# Read-only against remote. It never writes to either database.
#
# Connectivity (2026-08-24): `db.<ref>.supabase.co` publishes only an AAAA record
# and GitHub-hosted runners have no IPv6 route, so every job here failed with
# "Network is unreachable" — a connectivity failure that looked like drift.
# Jobs now prefer SUPABASE_POOLER_CONNECTION_STRING (Supavisor, IPv4-reachable)
# and run scripts/check_db_reachable.sh first, which names the fix instead of
# emitting a raw psql traceback. Unreachable still fails: a vacuously green
# parity check is worse than no check.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Drift is usually introduced outside a PR — someone fixing production live —
  # so a daily run is what actually catches it.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  parity:
    name: Fresh database equals remote
    runs-on: ubuntu-latest
    # This file's job `name:` values are required status checks on `main` — but
    # WHICH ones is a GitHub dashboard setting, not code: one person, one click,
    # no commit and no diff. It changed three times on 2026-09-02/03. So this
    # comment can only be a dated reading, never the state. Measure it:
    #   gh api repos/aldemirkonuk/RestaurantAIAutomation/branches/main/protection \
    #     --jq '.required_status_checks.contexts'
    #
    # Latest reading, 2026-09-03 04:40Z (`strict: true`): ALL FOUR of this file's
    # jobs are required — THIS one, `Code queries only relations production has`,
    # `Beverage identity key — SQL matches Python` and
    # `Guest merge policy — zero false merges` — alongside `CI Complete`. The two
    # migration-sensitive ones had been removed for part of 2026-09-02 to unblock
    # PRs that add a migration, and the founder restored them once ADR 0092 made
    # the comparison merge-base-aware. Treat that as "the last time somebody
    # looked", not as what is true while you read this.
    #
    # Renaming a required job or changing its `if:` changes whether PRs can merge
    # at all: a renamed job is the same failure as a skipped one — the required
    # context stops reporting and the PR is blocked forever, not merely skipped.
    # See ADR 0072 (Consequences) for why the fork guard itself stays as-is: a fork
    # PR has no access to the DB secret, so a check that ran "successfully" on a
    # fork would be vacuously green — the exact fault ADR 0072 exists to close. The
    # remedy for a real fork contribution is a maintainer re-pushing the branch to
    # this repo, not faking a green check.
    #
    # Without the connection secret this job can only ever be vacuously green,
    # and a vacuously green check is worse than no check.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # fetch-depth: 0 is load-bearing, not hygiene, and it is not optional:
      # actions/checkout's default is shallow AND single-branch, which leaves no
      # `origin/<base_ref>` ref at all. MEASURED on a real shallow clone of
      # fix/lot-cost-truth: the helper exits 2 both before and AFTER a
      # `git fetch origin main --depth 1`, because a single-branch clone's
      # restricted refspec does not create the remote-tracking ref — so the
      # fetch in the step below cannot substitute for this line.
      #
      # The failure mode is a red job, never a silent hole: the helper refuses
      # to answer from a partial view rather than reporting "this PR added
      # nothing", which would quietly turn a relaxed comparison into a strict
      # one and reintroduce the very block this change removes.
      #
      # (One degenerate case is genuinely fine: a shallow clone OF the base
      # branch itself, where base and head are the same commit and the honest
      # answer is the empty list. That is the push shape, and it exits 0.)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # PINNED, and that is the fix — `version: latest` forces the action to
          # resolve a release through the GitHub API on every single run, which
          # is the thing that rate-limits. A pinned version needs no lookup, so
          # the failure mode cannot occur rather than being made less likely.
          #
          # History, because the previous attempt is instructive: on 2026-08-26
          # this step failed on a rate limit and `GITHUB_TOKEN` was added to
          # raise the unauthenticated 60/hour to 1000/hour. Its own comment said
          # honestly that it was "NOT VERIFIED against a live rate limit". On
          # 2026-09-01 it rate-limited AGAIN, on PR #192 — so that is now
          # disproven, not merely unverified. The token stays below (it is free
          # and still helps the download), but it is no longer the control.
          #
          # Bumping this is a deliberate, reviewable act. That is the point: an
          # unpinned toolchain silently changes what CI measures.
          version: 2.116.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start local stack
        run: supabase start

      - name: Rebuild local database from migrations only
        # If this step fails, migrations cannot build a database — exactly the
        # condition that made local development impossible before the baseline.
        run: supabase db reset --no-seed

      # The behavioural half of ci.yml's `fk repoint` guard. That one reads
      # text: it can say the fix is PRESENT, never that it WORKS. This builds a
      # real composite foreign key -- (inventory_id, uom) -> (id, uom), the shape
      # ADR 0070 introduces -- against the database that was just rebuilt from
      # migrations, and asserts the behaviour: one plan row per constraint
      # rather than one per component, a stated problem for a key that
      # references no id, a refusal that names the constraint when a composite
      # key would reject the repointed rows, and a merge that still completes
      # once they are reconciled. Verified to FAIL against the pre-fix schema.
      #
      # Here rather than in ci.yml because this is the workflow that already has
      # a database. It needs no secret: the local stack above is enough, and
      # everything it does runs in a transaction that is rolled back.
      - name: A catalog-driven repoint works, not just reads correctly
        run: |
          ./scripts/check_fk_repoint_by_referenced_column.py \
            --against-database \
            --dsn "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      # ---------------------------------------------------------------------
      # Everything above ran against the FULL migration set, and still does —
      # `supabase db reset` above is what proves this PR's own migrations apply,
      # and the fk-repoint check needs the schema they introduce.
      #
      # Only the COMPARISON below changes. It diffs a database built from
      # migrations against production, which on a pull request is asking a
      # question nobody posed: migrations auto-apply on MERGE, so a PR that adds
      # one compares a local database that HAS the new objects against a
      # production that correctly does not. The new table lands under "IN LOCAL,
      # NOT IN REMOTE", the job exits 1, and since this job is a required
      # context the PR cannot merge at all. Three of six open PRs were stuck on
      # exactly that on 2026-09-02.
      #
      # So for the comparison, and ONLY the comparison, rebuild from the
      # migrations as they stand on the PR's merge base. The check then asks its
      # real question — has production drifted from what has been MERGED — and
      # is insensitive to what this PR proposes.
      #
      # What deliberately does NOT relax:
      #   * a MODIFIED migration is not held back (`--diff-filter=A` only), so
      #     editing an already-applied migration still shows as drift;
      #   * on push/schedule there is no base ref, nothing is held back, and
      #     this is byte-for-byte the old behaviour — `main` is as strict as it
      #     was;
      #   * an unresolvable base is exit 2, not a quiet strict or a quiet
      #     vacuous run.
      # ---------------------------------------------------------------------
      - name: The held-back list is computed by a guard that can fail
        run: ./scripts/parity_migrations_added_by_pr.py --self-test

      - name: Hold this PR's own migrations back from the comparison
        run: |
          set -euo pipefail
          mkdir -p /tmp/parity-held-back
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}" --quiet
            ./scripts/parity_migrations_added_by_pr.py \
              --base "origin/${{ github.base_ref }}" > /tmp/parity-added.txt
          else
            : > /tmp/parity-added.txt
            echo "push/schedule: nothing held back — this is the strict run."
          fi
          held=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mv "$f" /tmp/parity-held-back/
            echo "held back: $f"
            held=$((held + 1))
          done < /tmp/parity-added.txt
          echo "held back ${held} migration(s) added by this PR."
          # Stated on every run, including the zero case, so "nothing was held
          # back" is a reported measurement rather than an absence.
          if [ "$held" -eq 0 ]; then
            echo "This is therefore a STRICT comparison over the full migration set."
          fi

      - name: Rebuild the comparison database from the merge base
        run: supabase db reset --no-seed

      - name: Compare against remote
        env:
          # Pooler first: db.<ref>.supabase.co is IPv6-only and runners are IPv4-only.
          SUPABASE_DIRECT_CONNECTION_STRING: ${{ secrets.SUPABASE_POOLER_URL || secrets.SUPABASE_POOLER_CONNECTION_STRING || secrets.SUPABASE_DIRECT_CONNECTION_STRING }}
        run: |
          ./scripts/check_db_reachable.sh
          ./scripts/check_schema_parity.sh

      - name: Put the held-back migrations back
        if: always()
        run: |
          cp /tmp/parity-held-back/*.sql supabase/migrations/ 2>/dev/null || true
          git status --porcelain -- supabase/migrations/ || true

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::Read WHICH step failed before reading this. A 'PASS shape/accounting/refusal/merge' line missing, or psql erroring under 'A catalog-driven repoint works', is the ADR 0076 behavioural check — see ci.yml's 'fk repoint' notices, not the drift advice below."
          echo "::notice::fk_repoint_plan / fk_repoint_blockers listed under IN LOCAL, NOT IN REMOTE is NOT that check failing. It is ADR 0076's migration not yet pushed, which is what every unmerged migration looks like here, and it clears on merge."
          echo "::notice::If the log says 'Network is unreachable', this is CONNECTIVITY, not drift —"
          echo "::notice::see scripts/check_db_reachable.sh. Otherwise:"
          echo "::notice::Local and remote schemas disagree."
          echo "::notice::Columns/functions only in REMOTE were applied by hand — capture them"
          echo "::notice::as a migration, then: supabase migration repair --status applied <version>"
          echo "::notice::Columns/functions only in LOCAL are unpushed — run: supabase db push"
          echo "::notice::Background: .planning/07-reference/SCHEMA_DRIFT_INVENTORY.txt"

  # The arm of the schema-code guard that needs a database.
  #
  # ci.yml's `schema-code-parity` job runs the hermetic half on every pull
  # request: does supabase/migrations/ DECLARE everything the code queries. That
  # needs no secret and so runs on forks too. It cannot answer the other
  # question -- was production ever GIVEN those migrations -- and that is the
  # question the five 2026-08-26 instances actually failed. This job asks it,
  # here rather than in ci.yml because this is the workflow that already holds
  # the connection string and the fork guard, and because a daily run is what
  # catches drift introduced outside a pull request.
  #
  # It also reports the disagreement that IS the defect class: a relation the
  # code queries that production HAS and no live migration declares. Those work
  # today and vanish from any database rebuilt from this repository.
  # integration_oauth_connections and _states are exactly that on 2026-08-26.
  #
  # Read-only. The guard opens the session with set_session(readonly=True) and
  # never prints the DSN.
  queried-tables-exist-in-production:
    name: Code queries only relations production has
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Compare the code's relations against production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_POOLER_URL || secrets.SUPABASE_POOLER_CONNECTION_STRING || secrets.SUPABASE_DIRECT_CONNECTION_STRING }}
        run: |
          ./scripts/check_db_reachable.sh
          ./scripts/check_queried_tables_exist.py --against-production

      - name: Explain a failure
        if: failure()
        run: |
          echo "::notice::If the log says 'Network is unreachable', this is CONNECTIVITY, not drift — see scripts/check_db_reachable.sh."
          echo "::notice::Otherwise the code calls a relation or function production does not have, and every such call is failing at runtime right now."
          echo "::notice::If supabase/migrations/ DOES define it, the migration was never pushed: supabase db push."
          echo "::notice::If it does not, see the sibling failure in ci.yml's schema-code-parity job — the CREATE is probably sitting in an archive directory."

  # Premortem audit finding (2026-08-18, decision #1): beverage_identity_key
  # (SQL, runs in production) and residual_key (Python, what
  # eval_merge_policies.py's 0-false-merge measurement actually validates)
  # are two independent implementations of one algorithm, kept in lockstep
  # by discipline and a comment, not by anything automated — ci.yml's
  # merge-identity gate only ever tested the Python side. This job is that
  # missing enforcement, reusing the one secret in this repo that already
  # grants CI read-only remote DB access, same posture schema-parity itself
  # needs — no new secret, no new trust boundary.
  beverage-identity-parity:
    name: Beverage identity key — SQL matches Python
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Compare SQL beverage_identity_key() against the validated Python reference
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_POOLER_URL || secrets.SUPABASE_POOLER_CONNECTION_STRING || secrets.SUPABASE_DIRECT_CONNECTION_STRING }}
        run: |
          ./scripts/check_db_reachable.sh
          python3 scripts/check_beverage_identity_parity.py

  # Register A14. Guests are the one entity where a false merge is a
  # DISCLOSURE rather than a data-quality error, so the pass condition is zero
  # and there is no threshold policy at all. The negative labels are free, the
  # same way §3.1's 732,874 same-menu pairs are: two guests linked to one
  # check are different people.
  #
  # This reports 0 pairs until guest capture starts, and that is the point.
  # Register A6 records a merge policy self-graded against probes its own
  # author imagined; a gate written after the data is a gate written by
  # someone who already knows what the data looks like.
  guest-merge-gate:
    name: Guest merge policy — zero false merges
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: No known-different guests may be merged
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_POOLER_URL || secrets.SUPABASE_POOLER_CONNECTION_STRING || secrets.SUPABASE_DIRECT_CONNECTION_STRING }}
        run: |
          ./scripts/check_db_reachable.sh
          python3 scripts/eval_guest_merge_policies.py

      - name: Guest identity guards
        run: |
          ./scripts/check_no_guest_name_matching.sh
          ./scripts/check_no_raw_guest_channels.sh
