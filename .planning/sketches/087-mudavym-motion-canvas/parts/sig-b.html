<style>
/* == sig (07-11) -- Signature moments =====================================
   The ceremonies: the five moments where money and proof change state.
   Every selector is prefixed .mx-sig. Colours come only from the host's
   variables -- never a hex. ASCII only in this block (the build escapes
   non-ASCII outside <script> to HTML entities, which would break CSS).

   ---------------------------------------------------------------------
   RESEARCH -- what was borrowed, re-aimed, and rejected.
   ---------------------------------------------------------------------
   * Accounting rule convention (single rule = subtotal, double rule = grand
     total; excelbianalytics.com/single-underlining-double-underlining-in-
     accounting, bizfluent.com/info-11368429). BORROWED and re-aimed in
     sig-09: the double rule is treated as a CLAIM OF PROVABILITY. A total
     that cannot be proved gets a dashed single rule and no second stroke.
     The house em-dash rule (documents.ts:62-66, decision E49) then has a
     typographic body, not just a character.
   * Wise, "prove fairness inside the interface" -- the calculation is part
     of the transfer visualisation, not fine print, and lands BEFORE
     commitment (raw.studio/blog/how-wise-uses-3-transparency-first-ux-
     principles). BORROWED for sig-09 (arithmetic is the surface) and for
     sig-08 (the tie-out closes before the countersign unlocks -- the
     operator sees the outcome while they can still refuse).
     REJECTED: Wise's progressive disclosure of the breakdown. An operator
     checking whether a vendor shorted them is not a consumer being
     reassured; the working is the primary content, so it is never folded.
   * Stripe hosted invoice / itemised receipts -- line items, discounts and
     taxes itemised on the receipt itself (docs.stripe.com/receipts,
     /invoicing/group-line-items). BORROWED: tax is shown, not omitted.
     RE-AIMED: shown and then visibly SET ASIDE, because tax is not cost of
     goods (documents.ts:134-141).
   * Ramp / Brex / Expensify receipt compliance -- a receipt is proof
     ATTACHED to a transaction; Expensify SmartScan fills fields from a
     photo (use.expensify.com/resource-center/guides). BORROWED for sig-07:
     the action set's centre of gravity is attachment, and for sig-09 the
     missing unit price is read off the stored photo -- which is exactly
     what the side-by-side pane at ReceiptsPage.tsx:336-350 is for.
     REJECTED: auto-matching that commits. Decision E46 in the repo already
     says a photo estimate fills the field and never commits
     (SpotCountPanel.tsx:163) -- the motion honours that.
   * DocuSign's own term for the signing flow is the "signing ceremony";
     Jamie Myrold, "Signatures and Ceremony" (UX Collective) argues the
     physical act carries weight an instant click destroys. BORROWED for
     sig-08: the countersign is a HOLD that produces attribution as its
     by-product. REJECTED: a modal "Are you sure?" -- friction with no
     product. The hold is the confirmation AND the signature.
   * YNAB reconciliation: reconciled transactions are LOCKED and marked
     (support.ynab.com/reconciling-accounts-a-guide). BORROWED for sig-11 --
     committed reads as locked, not as ticked. A tick says "done"; a lock
     says "no longer editable", which is what committing a count is.
   * Confetti: Peter Ramsey (UX Planet) and Rowdy Vass (UX Collective) --
     frequency first, "in serious industries like banking a celebration can
     feel tone-deaf", "confetti is optional, meaning is not". REJECTED
     outright for sig-10. The celebration is made OF the fact: the money
     conserves -- it leaves Outstanding and arrives in Recovered by the same
     amount on the same clock -- and the shortfall is named in the same
     breath. Also rejected: a full-screen success takeover, because claims
     are settled in a batch and the queue must not be blocked.
   * Letterpress / deboss via opposed shadows (smashingmagazine.com/2012/07/
     letterpress-effect-fireworks-css). BORROWED sparingly: the invoice seal
     lands and then presses in with an inset edge; the receipt seal does not.
     REJECTED: feTurbulence torn-paper edges (codrops SVG filter series) --
     handsome, and pure decoration on a 280x150 card; nothing about a
     vendor shorting you is expressed by a ragged edge.
   ---------------------------------------------------------------------  */

.mx-sig{
  font-family:var(--m-sans);
  font-size:11px;line-height:1.35;color:var(--m-ink);
  position:relative;width:100%;
  -webkit-font-smoothing:antialiased;
}
.mx-sig *{box-sizing:border-box}
.mx-sig .s-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.mx-sig .s-k{font:500 8.5px/1.2 var(--m-mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-sig .s-k.on{color:var(--m-accent)}
.mx-sig .s-k.ok{color:var(--m-ok)}
.mx-sig .s-k.w{color:var(--m-warn)}
.mx-sig .s-k.no{color:var(--m-no)}
.mx-sig .num{font-family:var(--m-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mx-sig .s-note{margin-top:6px;font-size:9px;line-height:1.3;color:var(--m-mut)}
.mx-sig .s-b{font:500 9px/1 var(--m-sans);background:transparent;color:var(--m-ink);
  border:1px solid var(--m-line2);border-radius:3px;padding:5px 4px;cursor:pointer;
  font-weight:600;letter-spacing:.01em}
.mx-sig .s-b:focus-visible{outline:1px solid var(--m-accent);outline-offset:1px}

/* -- 07 . the receipt files itself ------------------------------------- */
.mx-sig-07 .a7-lanes{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;height:50px}
.mx-sig-07 .a7-col{border:1px dashed var(--m-line);border-radius:4px;position:relative;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.mx-sig-07 .a7-cl{font:500 7px/1 var(--m-mono);letter-spacing:.11em;text-transform:uppercase;color:var(--m-mut)}
/* Geometry in calc(), not in measured pixels. The lanes are a 1fr/1fr grid with
   an 8px gap, so a column is calc(50% - 4px) and the gap between column centres
   is calc(50% + 4px) -- which is the paper's own width + 8px, i.e. exactly
   translateX(calc(100% + 8px)). Measuring this at play time instead left stale
   inline widths behind when the grid reflowed to a narrower column. */
.mx-sig-07 .a7-trail{position:absolute;top:22px;height:1px;background:var(--m-accent);
  left:calc(25% - 2px);width:calc(50% + 4px);
  transform-origin:0 50%;transform:scaleX(0);opacity:.5;pointer-events:none}
.mx-sig-07 .a7-paper{position:absolute;top:4px;left:0;width:calc(50% - 4px);height:36px;
  background:var(--m-surface);border:1px solid var(--m-line2);border-radius:3px;
  padding:4px 5px;box-shadow:0 1px 0 var(--m-sunk);overflow:hidden}
.mx-sig-07 .a7-paper.filed{border-color:var(--m-accent)}
.mx-sig-07 .a7-paper.held{border-color:var(--m-warn)}
.mx-sig-07 .a7-pt{font:500 8px/1.1 var(--m-mono);color:var(--m-ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mx-sig-07 .a7-pl{height:1px;background:var(--m-line2);margin-top:4px;opacity:.75}
.mx-sig-07 .a7-pl.b{width:72%}
.mx-sig-07 .a7-pl.c{width:44%}
/* the receipt's seal DOES tilt -- it is tossed on, where the invoice's descends
   square (sig-08). Origin at the bottom-right so the tilt stays on the paper,
   which clips its own overflow. */
.mx-sig-07 .a7-seal{position:absolute;right:4px;bottom:5px;width:15px;height:15px;border-radius:50%;
  border:1px solid var(--m-accent);color:var(--m-accent);display:flex;align-items:center;
  justify-content:center;font:600 8px/1 var(--m-mono);opacity:0;
  transform:scale(1.9) rotate(-12deg);transform-origin:100% 100%}
.mx-sig-07 .a7-clip{position:absolute;right:3px;top:3px;font:500 7px/1 var(--m-mono);
  color:var(--m-accent-ink);background:var(--m-accent);border-radius:2px;padding:2px 3px;
  opacity:0;transform:translate(14px,-6px) rotate(9deg)}
.mx-sig-07 .a7-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:7px}
.mx-sig-07 .a7-acts .s-b{opacity:0;transform:translateY(-6px)}
.mx-sig-07 .s-b.prime{border-color:var(--m-accent);color:var(--m-accent)}
.mx-sig-07 .a7-why{display:grid;grid-template-rows:0fr;overflow:hidden;
  transition:grid-template-rows 420ms cubic-bezier(.32,.72,0,1)}
.mx-sig-07 .a7-why.open{grid-template-rows:1fr}
.mx-sig-07 .a7-why > div{min-height:0;overflow:hidden}
.mx-sig-07 .a7-wi{margin-top:6px;border-left:2px solid var(--m-warn);padding:2px 0 2px 6px;
  font-size:9px;color:var(--m-mut)}

/* -- 08 . the counter-signature ---------------------------------------- */
.mx-sig-08 .a8-tie{border:1px solid var(--m-line);border-radius:4px;padding:5px 6px}
.mx-sig-08 .a8-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  font-size:10px;height:13px}
.mx-sig-08 .a8-row > span{color:var(--m-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-sig-08 .a8-row > b{font-weight:500;flex:none}
.mx-sig-08 .a8-hr{height:0;border-top:1px solid var(--m-line2);margin:3px 0 3px auto;width:64px;
  transform-origin:100% 50%;transform:scaleX(0)}
.mx-sig-08 .a8-row.d > b{color:var(--m-mut)}
.mx-sig-08 .a8-row.d.ok > b{color:var(--m-ok)}
.mx-sig-08 .a8-hold{position:relative;overflow:hidden;width:100%;margin-top:7px;
  font:600 9px/1 var(--m-sans);letter-spacing:.02em;background:transparent;
  border:1px solid var(--m-line);border-radius:3px;color:var(--m-mut);
  padding:7px 6px;cursor:not-allowed;user-select:none;touch-action:none;text-align:center}
.mx-sig-08 .a8-hold.live{border-color:var(--m-accent);color:var(--m-ink);cursor:pointer}
.mx-sig-08 .a8-hold:focus-visible{outline:1px solid var(--m-accent);outline-offset:1px}
.mx-sig-08 .a8-fill{position:absolute;left:0;top:0;bottom:0;right:0;background:var(--m-accent);
  opacity:.2;transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.mx-sig-08 .a8-lab{position:relative}
.mx-sig-08 .a8-sign{display:grid;grid-template-rows:0fr;overflow:hidden;
  transition:grid-template-rows 420ms cubic-bezier(.32,.72,0,1)}
.mx-sig-08 .a8-sign.open{grid-template-rows:1fr}
.mx-sig-08 .a8-sign > div{min-height:0;overflow:hidden}
.mx-sig-08 .a8-sl{height:0;border-top:1px solid var(--m-ink);opacity:.45;margin-top:8px;
  transform-origin:0 50%;transform:scaleX(0)}
.mx-sig-08 .a8-who{display:block;margin-top:3px;padding-right:92px;font:500 8px/1.3 var(--m-mono);
  color:var(--m-mut);clip-path:inset(0 100% 0 0);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* The seal belongs beside the name it attributes, at the foot of the card.
   Parked by the header it merely repeated the status chip; placed INSIDE the
   signature row it was clipped by that row's own overflow:hidden (measured: an
   18px seal in a 13px box). Anchored to the root it costs no layout and lands
   where a countersignature goes.
   NO rotation, and the origin pinned to the bottom-right corner, so the seal
   only ever grows up and to the left. A -8deg tilt about that corner swung the
   far corner 21px BELOW the card (measured) and clipped. It also earns its
   difference: the receipt's seal in sig-07 is tossed on at an angle; the
   invoice's descends square, because it is a counter-signature. */
.mx-sig-08 .a8-seal{position:absolute;right:1px;bottom:0;font:600 7.5px/1 var(--m-mono);
  letter-spacing:.14em;text-transform:uppercase;color:var(--m-mut);
  border:1px solid var(--m-line2);border-radius:2px;padding:4px 5px;background:var(--m-surface);
  opacity:0;transform:scale(1.8);transform-origin:100% 100%;pointer-events:none}
.mx-sig-08 .a8-seal.set{color:var(--m-accent);border-color:var(--m-accent)}
.mx-sig-08 .a8-seal.pressed{box-shadow:inset 0 1px 0 var(--m-line2),inset 0 -1px 0 var(--m-sunk)}

/* -- 09 . it adds up, or it says an em dash ---------------------------- */
.mx-sig-09 .a9-tape{position:relative}
.mx-sig-09 .a9-r{display:flex;align-items:baseline;gap:5px;height:12.5px;font-size:10px}
.mx-sig-09 .a9-r > span{color:var(--m-mut);flex:none;max-width:96px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mx-sig-09 .a9-r > i{flex:1;font-style:normal;font-size:8.5px;color:var(--m-mut);opacity:.72;
  font-family:var(--m-mono);text-align:right;white-space:nowrap}
.mx-sig-09 .a9-r > b{width:64px;flex:none;text-align:right;font-weight:500}
.mx-sig-09 .a9-r.lit > span{color:var(--m-ink)}
.mx-sig-09 .a9-r.sub > span,.mx-sig-09 .a9-r.tot > span{color:var(--m-ink)}
.mx-sig-09 .a9-r.tot > b{font-weight:600;font-size:11px}
.mx-sig-09 .a9-r.nul > b{color:var(--m-warn)}
.mx-sig-09 .a9-r.tax{opacity:.42}
/* the AMOUNT is what gets set aside; striking the reason instead read as if
   "not cost of goods" were the thing being retracted */
.mx-sig-09 .a9-r.tax > b{text-decoration:line-through}
.mx-sig-09 .a9-rule{height:5px;display:flex;align-items:center}
.mx-sig-09 .a9-rule > i{display:block;width:64px;margin-left:auto;height:0;
  border-top:1px dashed var(--m-line2);transform-origin:100% 50%;transform:scaleX(0)}
.mx-sig-09 .a9-rule.solid > i{border-top-style:solid;border-top-color:var(--m-mut)}
.mx-sig-09 .a9-rule2{height:7px;display:flex;flex-direction:column;justify-content:center;
  align-items:flex-end;gap:2px}
.mx-sig-09 .a9-rule2 > i{display:block;width:64px;height:0;border-top:1px solid var(--m-ink);
  opacity:.62;transform-origin:100% 50%;transform:scaleX(0)}
.mx-sig-09 .a9-chip{position:absolute;right:66px;font:500 7.5px/1 var(--m-mono);
  color:var(--m-accent-ink);background:var(--m-accent);border-radius:2px;padding:3px 4px;
  opacity:0;pointer-events:none;white-space:nowrap}

/* -- 10 . money came back ---------------------------------------------- */
.mx-sig-10 .a10-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx-sig-10 .a10-t{position:relative;border:1px solid var(--m-line);border-radius:4px;padding:6px 7px 9px}
.mx-sig-10 .a10-t > span{display:block;font:500 7px/1 var(--m-mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--m-mut);margin-bottom:4px}
.mx-sig-10 .a10-t > b{display:block;font-size:15px;font-weight:600}
.mx-sig-10 .a10-t.arrived{border-color:var(--m-accent)}
.mx-sig-10 .a10-under{position:absolute;left:7px;right:7px;bottom:4px;height:0;
  border-top:1px solid var(--m-accent);transform-origin:0 50%;transform:scaleX(0)}
.mx-sig-10 .a10-fly{position:absolute;left:0;top:0;font-size:14px;font-weight:600;font-style:normal;
  color:var(--m-accent);opacity:0;pointer-events:none;white-space:nowrap}
.mx-sig-10 .a10-memo{display:flex;align-items:center;gap:5px;margin-top:8px;height:16px}
.mx-sig-10 .a10-mc{font:500 8px/1 var(--m-mono);letter-spacing:.06em;border:1px solid var(--m-line2);
  border-radius:2px;padding:3px 4px;color:var(--m-mut);opacity:0;
  transform:translateX(-22px) rotate(-6deg)}
.mx-sig-10 .a10-mc.on{color:var(--m-accent);border-color:var(--m-accent)}
.mx-sig-10 .a10-ml{font-size:9px;color:var(--m-mut);opacity:0}
.mx-sig-10 .a10-res{margin-top:5px;display:flex;justify-content:space-between;align-items:baseline;
  gap:6px;font-size:9px;color:var(--m-mut);opacity:0;height:12px}
.mx-sig-10 .a10-res b{color:var(--m-warn);font-weight:500;flex:none}

/* -- 11 . the count is committed --------------------------------------- */
.mx-sig-11 .a11-m{position:relative;border:1px dashed var(--m-line2);border-radius:4px;
  padding:4px 6px;margin-bottom:5px;background:var(--m-surface)}
.mx-sig-11 .a11-m.done{border-style:solid;border-color:var(--m-accent)}
.mx-sig-11 .a11-m.dead{border-color:var(--m-no)}
.mx-sig-11 .a11-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mx-sig-11 .a11-name{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-sig-11 .a11-n{font-size:13px;font-weight:600;flex:none}
.mx-sig-11 .a11-key{font:500 7.5px/1.2 var(--m-mono);color:var(--m-mut);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-sig-11 .a11-key.reused{color:var(--m-accent)}
.mx-sig-11 .a11-hr{height:0;border-top:1px dashed var(--m-line2);margin:4px 0 3px;
  transform-origin:0 50%}
.mx-sig-11 .a11-m.done .a11-hr{border-top-style:solid;border-top-color:var(--m-accent)}
.mx-sig-11 .a11-meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  font:500 7.5px/1 var(--m-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--m-mut)}
/* both children are absolute so they can cross-fade in place; without an
   explicit height the span collapses to 0 and "live" hangs 8px below its row */
.mx-sig-11 .a11-state{position:relative;display:inline-block;min-width:34px;height:9px}
.mx-sig-11 .a11-state i{font-style:normal;position:absolute;left:0;top:0}
.mx-sig-11 .a11-state i.live{color:var(--m-accent);opacity:0}
.mx-sig-11 .a11-seal{position:absolute;right:5px;top:16px;font:600 7px/1 var(--m-mono);
  letter-spacing:.13em;text-transform:uppercase;color:var(--m-accent);
  border:1px solid var(--m-accent);border-radius:2px;padding:3px 4px;background:var(--m-surface);
  opacity:0;transform:scale(1.8) rotate(-9deg);transform-origin:100% 50%;pointer-events:none}
.mx-sig-11 .a11-f{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mx-sig-11 .a11-fl{font-size:9px;color:var(--m-mut);min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mx-sig-11 .a11-m.dead .a11-fl{color:var(--m-no)}
.mx-sig-11 .a11-re{font:600 8px/1 var(--m-sans);background:transparent;color:var(--m-ink);
  border:1px solid var(--m-line2);border-radius:3px;padding:3px 5px;cursor:pointer;
  opacity:0;flex:none}
.mx-sig-11 .a11-re:focus-visible{outline:1px solid var(--m-accent);outline-offset:1px}
@keyframes mx-sig-breathe{0%,100%{opacity:.78}50%{opacity:1}}
.mx-sig-11 .a11-m.waiting{animation:mx-sig-breathe 2200ms ease-in-out infinite}

@media (prefers-reduced-motion: reduce){
  .mx-sig *{
    animation-duration:1ms!important;animation-delay:0ms!important;
    animation-iteration-count:1!important;
    transition-duration:1ms!important;transition-delay:0ms!important;
  }
  .mx-sig-11 .a11-m.waiting{animation:none!important;opacity:1!important}
}
</style>
<script>
(function(){
  var M = window.MUDAVYM_MOTIONS = window.MUDAVYM_MOTIONS || [];
  var FAM = 'Signature moments';
  var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* -- real spring: integrate, then sample into a CSS linear() easing --
     a = (-k(x-1) - c*v)/m, 1ms Euler-Cromer steps, stop at restDelta.    */
  var LINEAR_OK = (function(){
    try { return CSS.supports('animation-timing-function','linear(0, 0.5, 1)'); } catch(e){ return false; }
  })();
  function spring(k, c, m, restDelta){
    m = m || 1; restDelta = restDelta || 0.005;
    var dt = 1/1000, x = 0, v = 0, t = 0, tr = [0], peak = 0, cap = 4;
    while (t < cap){
      v += ((-k*(x-1) - c*v)/m)*dt; x += v*dt; t += dt;
      tr.push(x); if (x > peak) peak = x;
      if (Math.abs(1-x) < restDelta && Math.abs(v) < restDelta*8) break;
    }
    var n = 46, pts = [], i, idx;
    for (i=0;i<=n;i++){ idx = Math.round(i/n*(tr.length-1)); pts.push(+tr[idx].toFixed(4)); }
    pts[0] = 0; pts[n] = 1;
    return {
      k:k, c:c, trace:tr,
      duration: Math.round(t*1000),
      overshoot: +(Math.max(0,peak-1)*100).toFixed(1),

    };
  }

    stamp: spring(520,26),          // house "stamp" -- the one permitted ceremony
    tally: spring(120,26,1,0.0015), // house "tally" -- overdamped, figures never bounce
    tuck : spring(380,32),          // house "tuck"  -- weight under a finger
    seat : spring(300,34)           // near-critical: a control that resists and returns
  };
  function sp(s,label){ return label+' spring '+s.k+'/'+s.c+' -> '+s.duration+'ms, '+s.overshoot+'% overshoot'; }

  var EZ = {
    settle:'cubic-bezier(.16,1,.3,1)',   // house
    turn  :'cubic-bezier(.32,.72,0,1)',  // house -- opening a record
    ink   :'cubic-bezier(.16,1,.3,1)',   // house -- micro states
    exit  :'cubic-bezier(.4,0,.9,1)',
    glide :'cubic-bezier(.22,.61,.36,1)'
  };

  /* the canvas speed slider; 1 = as authored */
  function R(){ try{ var f=window.MUDAVYM_RATE; var v=f?f():1; return (v>0?v:1); }catch(e){ return 1; } }

  /* per-root bookkeeping so play() is idempotent under repeat calls */
  function ctl(root){
    (root._pt||[]).forEach(clearTimeout);
    (root._pa||[]).forEach(function(a){ try{ a.cancel(); }catch(e){} });
    if (root._pr){ cancelAnimationFrame(root._pr); root._pr = null; }
    root._pt = []; root._pa = []; root._gen = (root._gen||0) + 1;
    var gen = root._gen;
    void root.offsetWidth;
    return {
      gen: function(){ return gen === root._gen; },
      at: function(ms, fn){ root._pt.push(setTimeout(function(){ if (gen===root._gen) fn(); }, REDUCED?0:ms/R())); },
      an: function(el, kf, o){

          '<i class="a10-under"></i></div>'+
      '</div>'+
      '<i class="a10-fly num">$284.00</i>'+
      '<div class="a10-memo"><span class="a10-mc">CM-4471</span>'+
        '<span class="a10-ml">credit memo attached — this is what makes it recovery</span></div>'+
      '<div class="a10-res"><span>written off — vendor allowed $284.00 of $312.00</span>'+
        '<b class="num a10-off">$0.00</b></div>'+
      '</div>',
    play:function(root){
      var c = ctl(root),
          out = root.querySelector('.a10-out'), rec = root.querySelector('.a10-rec'),
          recT= root.querySelector('[data-k="rec"]'),
          fly = root.querySelector('.a10-fly'), und = root.querySelector('.a10-under'),
          mc  = root.querySelector('.a10-mc'), ml = root.querySelector('.a10-ml'),
          res = root.querySelector('.a10-res'), off = root.querySelector('.a10-off');

      /* The claim was $312. Settling it removes all $312 from Outstanding:
         $284 becomes Recovered, $28 is written off. The write-off therefore
         has to be a live third figure on the same clock -- leaving it as a
         footnote left $28 sitting in Outstanding that is never coming.      */
      var OUT0 = 1204.00, CLAIM = 312.00, AMT = 284.00, OFF = CLAIM - AMT;  /* 28.00 */
      var OUT1 = OUT0 - CLAIM;                                              /* 892.00 */

      out.textContent = money(OUT0); rec.textContent = money(0); off.textContent = money(0);
      recT.classList.remove('arrived');
      und.style.transform = 'scaleX(0)';
      fly.style.opacity = '0';
      mc.style.opacity='0'; mc.style.transform='translateX(-22px) rotate(-6deg)';
      mc.classList.remove('on');
      ml.style.opacity='0'; res.style.opacity='0';

      /* 1 -- the proof arrives first. No memo, no recovery. */
      c.at(260, function(){
        mc.classList.add('on');
        c.an(mc, [{opacity:0,transform:'translateX(-22px) rotate(-6deg)'},
                  {opacity:1,transform:'translateX(0) rotate(0deg)'}],
             {duration:SP.stamp.duration, easing:SP.stamp.easing});
        mc.style.opacity='1'; mc.style.transform='translateX(0) rotate(0deg)';
        c.an(ml,[{opacity:0},{opacity:1}],{duration:220}); ml.style.opacity='1';
      });

      /* 2 -- the money moves. Measured geometry, so it lands on the figure. */
      c.at(560, function(){
        var rr = root.getBoundingClientRect(),
            a  = out.getBoundingClientRect(), b = rec.getBoundingClientRect();
        fly.textContent = money(AMT);
        fly.style.left = (a.left - rr.left) + 'px';
        fly.style.top  = (a.top  - rr.top ) + 'px';
        var dx = b.left - a.left, dy = b.top - a.top;
        c.an(fly, [{opacity:0,transform:'translate(0,0) scale(.94)'},
                   {opacity:1,transform:'translate('+(dx*0.16)+'px,'+(dy*0.16-3)+'px) scale(1)',offset:.18},
                   {opacity:1,transform:'translate('+(dx*0.86)+'px,'+(dy*0.86)+'px) scale(1)',offset:.86},
                   {opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(.98)'}],
             {duration:460, easing:EZ.turn});
        /* ONE clock for all three figures. Outstanding + Recovered + written off
           equals the opening balance on EVERY frame -- nothing appears from
           nowhere and nothing quietly stays owed. */
        c.an(res, [{opacity:0},{opacity:1}], {duration:220}); res.style.opacity = '1';
        c.sweep(460, function(p){
          var tr = SP.tally.trace, x = tr[Math.min(tr.length-1, Math.round(p*(tr.length-1)))];
          /* round the two travelling figures, then derive the third from what
             is left. Rounding all three off the same x independently let the
             displayed sum drift a cent mid-flight -- on a ceremony whose whole
             claim is that the money conserves, a phantom penny is the bug. */
          var o = Math.round((OUT0 - CLAIM*x)*100)/100,
              r = Math.round((AMT*x)*100)/100;
          out.textContent = money(o);
          rec.textContent = money(r);
          off.textContent = money(Math.round((OUT0 - o - r)*100)/100);
        }, function(){
          out.textContent = money(OUT1); rec.textContent = money(AMT); off.textContent = money(OFF);
          recT.classList.add('arrived');
          draw(c, und, 380, EZ.glide);   /* a SINGLE rule: recovery is a subtotal */
        });
      });
    }
  });

  /* ===== sig-11 . the count is committed ================================== */
  M.push({
    id:'sig-11', name:'The count is committed', family:FAM,
    purpose:'A floor spot count locking and shadow stock becoming truth. The commit may land minutes later and somewhere else — spotCountOutbox mints a client idempotency key at the tap and syncs when the network returns — but SpotCountPanel calls onCommitted() and onClose() straight away, so the moment it actually becomes true is invisible today. Here the tap leaves a pencilled mark carrying its key; the mark waits, and does not pretend to be sending; and when the commit lands the seal writes the count\'s OWN time, not now. The ceremony belongs to 17:42. Below it, the honest half: a count dropped after 8 attempts gets no seal at all — which is the signal, since watchSpotCountOutbox throws away the failed tally. Press Recount.',
    spec:'no spinner while queued — a 2.2s opacity breath at .78-1 (killed under reduced motion), because this is a queue waiting, not the AI working · pencil rule -> solid draw 260ms '+EZ.settle+' · shadow/live cross-fade 200ms in place · seal '+sp(SP.stamp,'stamp')+' · the failed mark gets NO stamp: its ceremony is its absence',
    source:'apps/web/src/lib/spotCountOutbox.ts:12-13,38-42,90-127,133-145 · SpotCountPanel.tsx:187-201 · InventoryCommandPage.tsx:110',
    html:'<div class="mx-sig mx-sig-11">'+
      '<div class="s-h"><span class="s-k">Spot count · cellar B</span>'+
      '<span class="s-k a11-net">offline</span></div>'+
      '<div class="a11-m a11-one">'+
        '<div class="a11-top"><span class="a11-name">Rioja Crianza 2019</span>'+
          '<b class="num a11-n">34</b></div>'+
        '<div class="a11-key">count:INV-2291:9f3a…</div>'+
        '<div class="a11-hr"></div>'+
        '<div class="a11-meta"><span class="a11-when">17:42 · waiting <b class="a11-el">0m</b></span>'+
          '<span class="a11-state"><i class="sh">shadow</i><i class="live">live</i></span></div>'+
        '<span class="a11-seal">Committed</span>'+
      '</div>'+
      '<div class="a11-m a11-two">'+
        '<div class="a11-f"><span class="a11-fl">Albariño · 12 · queued 17:39</span>'+
          '<button type="button" class="a11-re">Recount</button></div>'+
      '</div>'+
      '</div>',
    play:function(root){
      var c = ctl(root),
          net = root.querySelector('.a11-net'),
          m1 = root.querySelector('.a11-one'), m2 = root.querySelector('.a11-two'),
          key= root.querySelector('.a11-key'), when = root.querySelector('.a11-when'),
          hr = root.querySelector('.a11-hr'),
          sh = root.querySelector('.a11-state .sh'), lv = root.querySelector('.a11-state .live'),
          seal = root.querySelector('.a11-seal'),
          fl = root.querySelector('.a11-fl'), re = root.querySelector('.a11-re');

      function reset2(){
        m2.classList.remove('dead'); m2.classList.add('waiting');
        fl.textContent = 'Albariño · 12 · queued 17:39';
        re.style.opacity = '0'; re.disabled = true;
      }
      net.textContent = 'offline'; net.className = 's-k a11-net w';
      m1.className = 'a11-m a11-one waiting';
      key.textContent = 'count:INV-2291:9f3a…'; key.classList.remove('reused');
      when.innerHTML = '17:42 · waiting <b class="a11-el">0m</b>';
      var el = when.querySelector('.a11-el');
      hr.style.transform = 'scaleX(1)';
      sh.style.opacity = '1'; lv.style.opacity = '0';
      seal.style.opacity = '0'; seal.style.transform = 'scale(1.8) rotate(-9deg)';
      reset2();

      /* the wait is real time passing, not a spinner. 12 minutes, compressed. */
      c.sweep(1400, function(p){ el.textContent = Math.round(p*12) + 'm'; });

      c.at(1500, function(){ net.textContent = 'online'; net.className = 's-k a11-net ok'; });

      /* the commit lands -- and the ceremony fires on the RECORD, not on now */
      c.at(1700, function(){
        m1.classList.remove('waiting'); m1.classList.add('done');
        draw(c, hr, 260, EZ.settle);
        key.textContent = 'key reused · server no-op';
        key.classList.add('reused');
        /* both times named: when it was counted, and how much later it landed */
        when.textContent = 'counted 17:42 · synced 12m later';
        c.an(key, [{opacity:0},{opacity:1}], {duration:160, easing:EZ.ink});
        c.an(sh, [{opacity:1},{opacity:0}], {duration:200}); sh.style.opacity = '0';
        c.an(lv, [{opacity:0},{opacity:1}], {duration:200}); lv.style.opacity = '1';
      });
      c.at(1820, function(){
        c.an(seal, [{opacity:0,transform:'scale(1.8) rotate(-9deg)'},
                    {opacity:1,transform:'scale(1) rotate(0deg)'}],
             {duration:SP.stamp.duration, easing:SP.stamp.easing});
        seal.style.opacity = '1'; seal.style.transform = 'scale(1) rotate(0deg)';
        seal.textContent = 'Committed 17:42';   /* the count's time, not the network's */
      });

      /* the honest half: no seal, because nothing was committed */
      c.at(2400, function(){
        m2.classList.remove('waiting'); m2.classList.add('dead');
        fl.textContent = 'Albariño · dropped after 8 attempts — never counted';
        c.an(re, [{opacity:0},{opacity:1}], {duration:200});
        re.style.opacity = '1'; re.disabled = false;
      });

      if (!re._b){
        re._b = 1;
        re.addEventListener('click', function(){
          reset2();
          fl.textContent = 'Albariño · 12 · re-queued, new key';
          re.disabled = true;
        });
      }
    }
  });
})();
</script>
