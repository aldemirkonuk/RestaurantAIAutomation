<style>
/* == sig -- Signature moments (sig-02 .. sig-06) ==========================
   The ceremonies. The few moments a day that deserve weight because something
   became irreversible. Every selector is prefixed .mx-sig. Colours come only
   from the host's variables -- never a hex, and never a raw rgba() either,
   because a shadow that does not swap with the skin is still a hard-coded
   colour.

   THE THESIS, in one line: the Mudavym wordmark is a DOUBLE RULE and a FULL
   STOP, and in bookkeeping a double rule under a figure means the account is
   ruled off -- grand total, procedure ended, nothing goes below this line
   (single rule = subtotal; double rule = final). So the wordmark already reads
   "this is final." All five ceremonies are that one object in five states:

     sig-02  wax    the die strikes, the wax spreads, the rules bite the paper
     sig-03  dry    the same die, no wax: a blind emboss. The everyday commit
     sig-04  close  two rules travel together and bracket the record shut
     sig-05  thumb  wax pressed by one hand at a door, carrying the key
     sig-06  rule   no wax at all. The double rule is simply drawn.

   RESEARCH -- borrowed, and refused. (Long form sits in each motion's
   `purpose`; collected here so the family reads as one argument.)

   BORROWED
   . Ottoman muhur / tughra -- the sultan's seal, pressed to APPROVE official
     documents and correspondence. Matrix cut in agate or quartz, impression
     left in wax: you never see the die, only what it left behind. Taken
     literally -- the die must LEAVE and the impression must stay. A mark that
     flies in and parks is a sticker, not a seal.
   . Letterpress (Smashing Magazine, "Simulating The Letterpress", 2012) -- the
     effect belongs to the PAPER, not the ink: impressed relief carries a
     shadow along its top edge and a highlight along its bottom. That is why
     every mark here is drawn twice, offset 0.8px, and never as a flat fill.
   . Squash & stretch with volume preserved -- taken, but re-assigned. Stone
     does not squash. The DIE stays rigid; the WAX spreads outward exactly as
     the die stops descending.
   . Anticipation -- the wind-up before the strike is what makes it read as an
     act rather than an appearance. Suppressed in exactly one place (sig-05),
     on purpose.
   . Apple Pay's double-click-to-confirm -- the confirmation lives on a channel
     the app cannot fake. Re-aimed: the seal lands ON THE RECORD, never in a
     floating toast. Any screen can raise a toast; only the ledger row can
     carry an impression.
   . Duolingo's streak celebration fires only on the first lesson of the day --
     ceremony rationed by context. This is the whole sig-02 / sig-03 split.

   REFUSED
   . Robinhood swipe-to-confirm. Publicly criticised as "peak dark design"
     because a swipe is the same gesture as scrolling the list it sits in, so
     a mis-aimed thumb books a trade. /orders IS a scrolling list. A hold
     cannot be produced by a brush. (WCAG 2.5.7 also wants a single-pointer
     alternative to any dragging path -- there is one, on the keyboard.)
   . Stripe / Duolingo confetti and the bouncing green tick. Money leaving a
     restaurant is not a win. Nothing in this family celebrates; it certifies.
   . Animating box-shadow per frame for the dent. It is a paint-bound property
     and sig-05 runs on a phone at 12%. The dent is a class with a transition;
     everything else here is transform and opacity only.
   . WCAG G168 / 2.5.7: press-and-hold is hard with tremor, so every hold is
     cancellable, needs no repositioning, and states its keyboard path.        */

.mx-sig{
  font-family:var(--m-sans);
  font-size:11px;line-height:1.4;color:var(--m-ink);
  position:relative;width:100%;
  -webkit-font-smoothing:antialiased;
}
.mx-sig .s-k{font:500 8.5px/1.2 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mx-sig .s-k.on{color:var(--m-accent)}
.mx-sig .num{font-family:var(--m-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mx-sig .s-btn{
  position:relative;overflow:hidden;width:100%;
  font:500 9px/1 var(--m-mono);letter-spacing:.11em;text-transform:uppercase;
  background:transparent;color:var(--m-ink);border:1px solid var(--m-line2);
  border-radius:3px;padding:7px 8px;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.mx-sig .s-btn span{position:relative;z-index:1}
.mx-sig .s-btn:focus-visible{outline:2px solid var(--m-accent);outline-offset:2px}
.mx-sig .s-note{margin-top:4px;font-size:8.5px;line-height:1.3;color:var(--m-mut);text-align:center}

/* -- the seal apparatus, shared by 02 / 03 / 05 ------------------------- */
.mx-sig .seal{position:absolute;pointer-events:none}
.mx-sig .seal svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* the wax: never a true circle, and never square to the page. Wax is squeezed
   out under a die held in a hand, so the blob is lopsided and the whole seal
   sits a few degrees off axis. The rotation is not decoration -- the house
   "stamp" token names `transform: rotate` alongside scale, and a seal that
   lands perfectly level reads as a printed asset rather than an act. */
.mx-sig .seal{transform:rotate(-6deg)}
.mx-sig .wax{position:absolute;inset:0;
  border-radius:53% 47% 44% 56%/46% 55% 45% 54%;
  background:
    radial-gradient(circle at 36% 30%,
      color-mix(in srgb,var(--m-accent) 88%,var(--m-ink)) 0%,
      var(--m-accent) 46%,
      color-mix(in srgb,var(--m-accent) 74%,var(--m-sunk)) 100%);
  /* the squeezed rim: where the wax ran thinnest it is darkest */
  box-shadow:0 0 0 .5px color-mix(in srgb,var(--m-accent) 55%,var(--m-sunk));
  transform:scale(0);opacity:0;transform-origin:50% 55%}
/* the impression: drawn twice. Highlight sits BELOW the stroke, body on the
   line -- that offset pair is what an eye reads as "pressed in" rather than
   "printed on". Both halves are derived from --m-accent, so the skin toggle
   reaches the letterpress too. */
.mx-sig .mk-h{stroke:color-mix(in srgb,var(--m-accent) 46%,var(--m-ink));fill:none}
.mx-sig .mk-b{stroke:color-mix(in srgb,var(--m-accent) 50%,var(--m-sunk));fill:none}
.mx-sig .mk-h circle{fill:color-mix(in srgb,var(--m-accent) 46%,var(--m-ink));stroke:none}
.mx-sig .mk-b circle{fill:color-mix(in srgb,var(--m-accent) 50%,var(--m-sunk));stroke:none}
.mx-sig .mark{opacity:0}
/* the die: the tool. Dark, rigid, and it leaves. */
.mx-sig .die{position:absolute;inset:-2px;border-radius:50%;
  background:radial-gradient(circle at 42% 28%,var(--m-line2) 0%,var(--m-sunk) 78%);
  border:1px solid var(--m-line2);
  opacity:0;transform:translateY(-46px) scale(1.24)}
.mx-sig .die .dk-b{stroke:color-mix(in srgb,var(--m-line2) 68%,var(--m-ink));fill:none}
.mx-sig .die .dk-b circle{fill:color-mix(in srgb,var(--m-line2) 68%,var(--m-ink));stroke:none}

/* the dent. A class, not an animated property -- see the REFUSED note above. */
.mx-sig .dentable{transition:box-shadow 90ms cubic-bezier(.55,0,.85,.4)}
.mx-sig .dentable.dent{
  box-shadow:
    inset 0 2px 3px -1px color-mix(in srgb,var(--m-sunk) 82%,transparent),
    inset 0 -1px 0 color-mix(in srgb,var(--m-ink) 9%,transparent);
}
.mx-sig .dentable.dent.rest{
  box-shadow:
    inset 0 1px 2px -1px color-mix(in srgb,var(--m-sunk) 66%,transparent),
    inset 0 -1px 0 color-mix(in srgb,var(--m-ink) 6%,transparent);
  transition:box-shadow 260ms cubic-bezier(.16,1,.3,1);
}

/* == 02 . the seal lands ================================================ */
.mx-sig-02 .s2-row{position:relative;display:flex;gap:8px;align-items:flex-start;
  padding:7px 8px;border:1px solid var(--m-line);border-radius:4px;
  background:var(--m-surface)}
.mx-sig-02 .s2-left{flex:1;min-width:0}
.mx-sig-02 .s2-amt{display:block;font-size:15px;font-weight:600;margin:3px 0 0;letter-spacing:-.02em}
.mx-sig-02 .s2-sub{font-size:9px;line-height:1.35;color:var(--m-mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-sig-02 .s2-well{width:58px;flex:none;align-self:stretch}
.mx-sig-02 .s2-chip{display:inline-block;margin-top:4px;padding:1.5px 4px;border-radius:2px;
  font:500 8px/1.2 var(--m-mono);letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--m-line2);color:var(--m-mut)}
.mx-sig-02 .s2-chip.done{border-color:color-mix(in srgb,var(--m-accent) 55%,transparent);
  color:var(--m-accent)}
.mx-sig-02 .s2-seal{right:7px;top:9px;width:50px;height:50px}
.mx-sig-02 .s2-fill{position:absolute;left:0;top:0;bottom:0;width:100%;
  background:color-mix(in srgb,var(--m-accent) 24%,transparent);
  transform:scaleX(0);transform-origin:0 50%}
.mx-sig-02 .s2-btn{margin-top:6px}
.mx-sig-02 .s2-btn.sealed{border-color:color-mix(in srgb,var(--m-accent) 50%,transparent);
  color:var(--m-mut);cursor:default}

/* == 03 . the dry emboss ================================================ */
/* the extra bottom padding is the corner the emboss lands in -- a stamp must
   not sit on top of a figure it did not change */
.mx-sig-03 .s3-grp{position:relative;border:1px solid var(--m-line);border-radius:4px;
  background:var(--m-surface);padding:6px 8px 12px}
.mx-sig-03 .s3-gh{display:flex;justify-content:space-between;gap:6px;align-items:baseline;
  padding-bottom:5px;border-bottom:1px solid var(--m-line);margin-bottom:4px}
/* the confirmation label carries no accent either -- see the note on .s3-emb */
.mx-sig-03 .s3-done{color:var(--m-ink)}
.mx-sig-03 .s3-r{display:flex;justify-content:space-between;gap:6px;padding:1.5px 0;
  font-size:9.5px;color:var(--m-mut);opacity:.55}
.mx-sig-03 .s3-r b{font-weight:500;color:var(--m-ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mx-sig-03 .s3-r i{font-style:normal;color:var(--m-mut);font-family:var(--m-mono);
  font-variant-numeric:tabular-nums}
.mx-sig-03 .s3-more{font-size:9px;color:var(--m-mut);padding-top:3px;opacity:.7}
/* bottom-right corner, where a clerk stamps a batch sheet -- and clear of both
   the header text and the divider rule. Squarer than sig-02, because a bulk
   approve is a machine action rather than a hand's. */
.mx-sig-03 .s3-emb{right:7px;bottom:3px;width:26px;height:26px;transform:rotate(-4deg)}
/* dry: an impression with no wax in it is a change in the PAPER, so it takes
   the surface's own colours and carries no accent at all. */
.mx-sig-03 .s3-emb .mk-h{stroke:color-mix(in srgb,var(--m-ink) 30%,transparent)}
.mx-sig-03 .s3-emb .mk-b{stroke:color-mix(in srgb,var(--m-sunk) 88%,var(--m-ink))}
.mx-sig-03 .s3-emb .mk-h circle{fill:color-mix(in srgb,var(--m-ink) 30%,transparent)}
.mx-sig-03 .s3-emb .mk-b circle{fill:color-mix(in srgb,var(--m-sunk) 88%,var(--m-ink))}
.mx-sig-03 .s3-btn{margin-top:6px}

/* == 04 . the record closes ============================================= */
.mx-sig-04 .s4-rec{position:relative;padding:0 2px}
.mx-sig-04 .s4-rule{display:block;height:1.5px;background:var(--m-line2);
  transform:scaleX(0);transform-origin:0 50%;opacity:.7}
.mx-sig-04 .s4-rule.top{background:color-mix(in srgb,var(--m-accent) 60%,transparent);
  transform:scaleX(1)}
.mx-sig-04 .s4-rule.bot{transform-origin:100% 50%}
.mx-sig-04 .s4-body{padding:9px 2px}
.mx-sig-04 .s4-hd{display:flex;justify-content:space-between;gap:6px;margin-bottom:7px}
.mx-sig-04 .s4-cols{display:flex;align-items:center;position:relative;height:33px}
.mx-sig-04 .s4-col{flex:1;min-width:0;border:1px dashed var(--m-line2);border-radius:3px;
  height:33px;padding:4px 6px}
.mx-sig-04 .s4-col.live{border-style:solid}
.mx-sig-04 .s4-cl{font:500 7.5px/1 var(--m-mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--m-mut);display:block}
.mx-sig-04 .s4-cv{font-family:var(--m-mono);font-variant-numeric:tabular-nums;font-size:13px;
  font-weight:500;margin-top:3px;color:var(--m-mut);opacity:.35}
.mx-sig-04 .s4-arrow{width:20px;flex:none;text-align:center;color:var(--m-mut);
  font-family:var(--m-mono);font-size:10px;opacity:.45}
.mx-sig-04 .s4-tok{position:absolute;left:6px;top:15px;
  font-family:var(--m-mono);font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;
  color:var(--m-mut);padding:0 3px;border-radius:2px;line-height:1.15;
  border:1px dashed var(--m-line2)}
.mx-sig-04 .s4-tok.live{color:var(--m-accent);border-style:solid;
  border-color:color-mix(in srgb,var(--m-accent) 50%,transparent)}
.mx-sig-04 .s4-foot{display:flex;justify-content:space-between;gap:6px;margin-top:6px}

/* == 05 . the door ====================================================== */
.mx-sig-05 .s5-door{position:relative;background:var(--m-sunk);border-radius:5px;
  border:1px solid var(--m-line);padding:8px 10px 9px;text-align:center}
.mx-sig-05 .s5-ttl{font-family:var(--m-serif);font-size:13.5px;font-weight:600;
  letter-spacing:-.01em;line-height:1.25}
.mx-sig-05 .s5-sub{font-size:9px;line-height:1.3;color:var(--m-mut);margin-top:1px;min-height:1.3em}
.mx-sig-05 .s5-pad{position:relative;height:46px;margin:5px 0 3px}
.mx-sig-05 .s5-thumb{position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:46px;height:46px;border-radius:50%;padding:0;
  background:transparent;border:2px dashed var(--m-line2);cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none}
.mx-sig-05 .s5-thumb:focus-visible{outline:2px solid var(--m-accent);outline-offset:3px}
.mx-sig-05 .s5-thumb.gone{border-color:transparent}
/* nearly square: a thumb comes straight down onto the glass */
.mx-sig-05 .s5-seal{left:-2px;top:-2px;right:-2px;bottom:-2px;transform:rotate(-3deg)}
.mx-sig-05 .s5-key{font:500 8.5px/1.3 var(--m-mono);letter-spacing:.04em;
  color:var(--m-accent);opacity:0;min-height:1.3em}
.mx-sig-05 .s5-tap{font:500 7.5px/1.25 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);margin-top:2px;min-height:1.25em}

/* == 06 . the books close =============================================== */
.mx-sig-06 .s6-led{position:relative;padding:0 3px}
.mx-sig-06 .s6-cap{margin-bottom:4px}
.mx-sig-06 .s6-r{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
  font-size:9.5px;padding:1px 0;color:var(--m-mut)}
.mx-sig-06 .s6-r b{font-weight:400;color:var(--m-ink)}
.mx-sig-06 .s6-r .num{font-size:10px;color:var(--m-ink)}
/* the merdiban step -- the Ottoman ledger method indented each entry beneath
   the one it belonged to, which is why this reads as a descent, not a table. */
.mx-sig-06 .s6-r.i1{padding-left:8px}
.mx-sig-06 .s6-r.i2{padding-left:16px}
.mx-sig-06 .s6-tot{display:flex;justify-content:space-between;gap:8px;align-items:baseline;
  margin-top:3px;font-size:9.5px}
.mx-sig-06 .s6-tot .num{font-size:13px;font-weight:600;letter-spacing:-.02em}
.mx-sig-06 .s6-rules{position:relative;height:8px;margin:2px 0 0 auto;width:108px}
.mx-sig-06 .s6-rule{position:absolute;right:9px;left:0;height:1.5px;background:var(--m-ink);
  transform:scaleX(0)}
.mx-sig-06 .s6-rule.a{top:0;transform-origin:0 50%}
.mx-sig-06 .s6-rule.b{top:4px;transform-origin:100% 50%}
/* the full stop: the only accent in the entire motion, and it is set last. */
.mx-sig-06 .s6-dot{position:absolute;right:0;top:0;width:5px;height:5px;border-radius:50%;
  background:var(--m-accent);opacity:0;transform:scale(.4)}
.mx-sig-06 .s6-said{margin-top:4px;font-size:8.5px;color:var(--m-mut);text-align:right;opacity:0}

/* -- reduced motion: land on the end state ----------------------------- */
@media (prefers-reduced-motion:reduce){
  .mx-sig *,.mx-sig *::before,.mx-sig *::after{
    animation-duration:1ms!important;animation-delay:0ms!important;
    animation-iteration-count:1!important;
    transition-duration:1ms!important;transition-delay:0ms!important;
  }
  .mx-sig .die{display:none!important}
  .mx-sig .wax{transform:scale(1)!important;opacity:1!important}
  .mx-sig .mark{opacity:1!important}
}
</style>
<script>
(function(){
  var M = window.MUDAVYM_MOTIONS = window.MUDAVYM_MOTIONS || [];
  var FAM = 'Signature moments';
  /* queried live, not captured at load: a viewer who turns the OS setting on
     mid-session should get the still version of the very next replay, and a
     constant read once at parse time silently ignores them. */
  var RMQ = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)')) || null;
  function REDUCED(){ return !!(RMQ && RMQ.matches); }

  /* ── real spring: integrate, then sample into a CSS linear() easing ──
     a = (-k(x-1) - c*v)/m, 1ms Euler-Cromer steps, stop at restDelta. Same
     integrator the sibling parts use, so the numbers are comparable across
     the canvas rather than being two authors' separate guesses.            */
  var LINEAR_OK = (function(){ try{ return CSS.supports('animation-timing-function','linear(0, 0.5, 1)'); }catch(e){ return false; } })();
  function spring(k, c, m, restDelta){
    m = m || 1; restDelta = restDelta || 0.005;
    var dt = 1/1000, x = 0, v = 0, t = 0, tr = [0], peak = 0, cap = 4;
    while (t < cap){
      v += ((-k*(x-1) - c*v)/m)*dt; x += v*dt; t += dt;
      tr.push(x); if (x > peak) peak = x;
      if (Math.abs(1-x) < restDelta && Math.abs(v) < restDelta*8) break;
    }
    var n = 46, pts = [], i, idx;
    for (i=0;i<=n;i++){ idx = Math.round(i/n*(tr.length-1)); pts.push(+tr[idx].toFixed(4)); }
    pts[0] = 0; pts[n] = 1;
    return {
      k:k, c:c, trace:tr,
      duration: Math.round(t*1000),
      overshoot: +(Math.max(0,peak-1)*100).toFixed(1),
      easing: LINEAR_OK ? 'linear('+pts.join(',')+')' : 'cubic-bezier(.16,1,.3,1)'
    };
  }
  var SP = {
    stamp: spring(520,26),   // house "stamp" — the one permitted ceremony
    tuck : spring(380,32)    // house "tuck"  — weight under a finger
  };
  function sp(s,label){ return label+' spring '+s.k+'/'+s.c+' → '+s.duration+'ms, '+s.overshoot+'% overshoot'; }

  var EZ = {
    settle:'cubic-bezier(.16,1,.3,1)',   // house
    turn  :'cubic-bezier(.32,.72,0,1)',  // house — opening (here, closing) a record
    ink   :'cubic-bezier(.16,1,.3,1)',   // house — micro states
    /* the strike. Deliberately NOT a house curve. Everything else in Mudavym
       decelerates into place because it is being placed; a falling die is not
       placed, it is dropped, so it must ACCELERATE into the paper. This is the
       only ease-in in the system, and it is what makes the contact land. */
    strike:'cubic-bezier(.55,0,.85,.4)',
    lift  :'cubic-bezier(.3,0,.2,1)'
  };

  function R(){ try{ var f=window.MUDAVYM_RATE; var v=f?f():1; return (v>0?v:1); }catch(e){ return 1; } }

  /* per-root bookkeeping so play() is idempotent under repeat calls */
  function ctl(root){
    (root._pt||[]).forEach(clearTimeout);
    (root._pa||[]).forEach(function(a){ try{ a.cancel(); }catch(e){} });
    if (root._pr){ cancelAnimationFrame(root._pr); root._pr = null; }
    root._pt = []; root._pa = []; root._gen = (root._gen||0) + 1;
    var gen = root._gen;
    void root.offsetWidth;
    return {
      gen: function(){ return gen === root._gen; },
      at: function(ms, fn){ root._pt.push(setTimeout(function(){ if (gen===root._gen) fn(); }, REDUCED()?0:ms/R())); },
      an: function(el, kf, o){
        o = o || {};
        var opt = { duration:(o.duration||300)/R(), delay:(o.delay||0)/R(),
                    easing:o.easing||EZ.settle, fill:o.fill||'both', iterations:1 };
        if (REDUCED()){ opt.duration = 1; opt.delay = 0; }
        var a = el.animate(kf, opt); root._pa.push(a); return a;
      },
      sweep: function(ms, fn, done){
        if (REDUCED()){ fn(1); if (done) done(); return; }
        var t0 = performance.now(), dur = ms/R();
        (function step(now){
          if (gen !== root._gen) return;
          var p = Math.min(1,(now-t0)/dur);
          fn(p);
          if (p < 1) root._pr = requestAnimationFrame(step);
          else if (done) done();
        })(t0);
      },
      stop: function(){ if (root._pr){ cancelAnimationFrame(root._pr); root._pr = null; } }
    };
  }
  function q(root,s){ return root.querySelector(s); }

  /* ── the mark ── the wordmark reduced to its two irreducible parts: a
     double rule and a full stop. Drawn twice -- a light copy 0.8px BELOW the
     stroke, the body copy on the line -- because that offset pair is what an
     eye reads as relief pressed into a surface rather than ink printed on one.
     Everything about this shape is load-bearing: those two rules are the same
     two rules sig-06 draws under the day's total.                          */
  var RULES = 'M10 19h20M10 24.5h20';
  function markSVG(cls){
    return '<svg class="'+(cls||'mark')+'" viewBox="0 0 44 44" aria-hidden="true">'+
      '<g class="mk-h" transform="translate(0,.8)" stroke-width="2.5" stroke-linecap="butt">'+
        '<path d="'+RULES+'"/><circle cx="35" cy="24.5" r="2.3"/></g>'+
      '<g class="mk-b" stroke-width="2.5" stroke-linecap="butt">'+
        '<path d="'+RULES+'"/><circle cx="35" cy="24.5" r="2.3"/></g></svg>';
  }
  function dieSVG(){
    return '<svg viewBox="0 0 44 44" aria-hidden="true">'+
      '<g class="dk-b" stroke-width="2.5" stroke-linecap="butt">'+
        '<path d="'+RULES+'"/><circle cx="35" cy="24.5" r="2.3"/></g></svg>';
  }
  function sealHTML(cls){
    return '<div class="seal '+cls+'">'+
      '<i class="wax"></i>'+ markSVG('mark') +

          '<div class="s6-r i1"><span>Beverage sales</span><span class="num">$4,280.00</span></div>'+
          '<div class="s6-r i2"><span>Purchases booked</span><span class="num">$1,284.00</span></div>'+
          '<div class="s6-r i2"><span>Variance to theoretical</span><span class="num">−$36.40</span></div>'+
        '</div>'+
        '<div class="s6-tot"><span class="s-k s6-tl">Day closed</span>'+
          '<span class="num s6-tv">$2,959.60</span></div>'+
        '<div class="s6-rules"><i class="s6-rule a"></i><i class="s6-rule b"></i>'+
          '<i class="s6-dot"></i></div>'+
        '<div class="s6-said">Ruled off. Reopening it takes a reason.</div>'+
      '</div></div>',
    play:function(root){
      var c = ctl(root),
          rows = [].slice.call(root.querySelectorAll('.s6-r')),
          a = q(root,'.s6-rule.a'), b = q(root,'.s6-rule.b'),
          dot = q(root,'.s6-dot'), said = q(root,'.s6-said'),
          body = q(root,'.s6-body');

      a.style.transform = 'scaleX(0)'; b.style.transform = 'scaleX(0)';
      dot.style.opacity = '0'; dot.style.transform = 'scale(.4)';
      said.style.opacity = '0'; body.style.opacity = '1';

      rows.forEach(function(r,i){
        c.an(r, [{opacity:0, transform:'translateY(5px)'},
                 {opacity:1, transform:'translateY(0)'}],
             {duration:260, delay:i*40, easing:EZ.settle});
      });

      // 1 . the subtotal rule. Linear -- a straightedge does not accelerate.
      c.at(300, function(){
        c.an(a, [{transform:'scaleX(0)'},{transform:'scaleX(1)'}],
             {duration:300, easing:'linear'});
        a.style.transform = 'scaleX(1)';
      });

      // 2 . 180ms of nothing. This is the ceremony.
      // 3 . the second stroke, drawn back the other way. Now it is a grand total.
      c.at(780, function(){
        c.an(b, [{transform:'scaleX(0)'},{transform:'scaleX(1)'}],
             {duration:170, easing:'linear'});
        b.style.transform = 'scaleX(1)';
      });

      // 4 . the full stop, set last -- the only accent in the whole motion.
      c.at(950, function(){
        c.an(dot, [{opacity:0, transform:'scale(.4)'},
                   {opacity:1, transform:'scale(1)'}],
             {duration:140, easing:EZ.settle});
        dot.style.opacity = '1'; dot.style.transform = 'scale(1)';
      });

      // 5 . the day goes behind glass.
      c.at(1010, function(){
        c.an(body, [{opacity:1},{opacity:.62}], {duration:400, easing:EZ.settle});
        body.style.opacity = '.62';
        c.an(said, [{opacity:0},{opacity:1}], {duration:300, delay:80, easing:EZ.ink});
        said.style.opacity = '1';
      });
    }
  });
})();
</script>
