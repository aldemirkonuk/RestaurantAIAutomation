<style>
/* ══ acc — Access, team & setup ══════════════════════════════════════════
   How people get in, get set up, and get scheduled. Every selector is
   prefixed .mx-acc; every colour comes from a host variable.              */

.mx-acc{
  font-family:var(--m-sans);
  font-size:11px;line-height:1.4;color:var(--m-ink);
  position:relative;width:100%;
  -webkit-font-smoothing:antialiased;
}
.mx-acc *{box-sizing:border-box}
.mx-acc .a-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.mx-acc .a-k{font:500 8.5px/1.2 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap;transition:color 160ms cubic-bezier(.16,1,.3,1)}
.mx-acc .a-k.ac{color:var(--m-accent)}
.mx-acc .a-k.ok{color:var(--m-ok)}
.mx-acc .a-k.wn{color:var(--m-warn)}
.mx-acc .a-k.no{color:var(--m-no)}
.mx-acc .a-n{font-family:var(--m-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mx-acc .a-cap{font:500 8.5px/1.3 var(--m-mono);letter-spacing:.08em;color:var(--m-mut);
  margin-top:6px;opacity:0}
.mx-acc .a-shim{
  background:linear-gradient(90deg,var(--m-mut) 12%,var(--m-ink) 46%,var(--m-mut) 80%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:acc-shim 1900ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes acc-shim{from{background-position:120% 0}to{background-position:-120% 0}}

/* ── 01 · invite code resolves ──────────────────────────────────────── */
.mx-acc-01 .o-slots{display:flex;gap:3px;margin-bottom:7px}
.mx-acc-01 .o-s{flex:1;height:28px;border:1px solid var(--m-line2);border-radius:3px;
  background:var(--m-surface);display:grid;place-items:center;
  transition:border-color 160ms cubic-bezier(.16,1,.3,1),background-color 160ms cubic-bezier(.16,1,.3,1)}
.mx-acc-01 .o-s i{font:500 12.5px/1 var(--m-mono);font-style:normal;color:var(--m-ink);opacity:0}
.mx-acc-01 .o-s.fill{border-color:var(--m-mut)}
.mx-acc-01 .o-s.ok{border-color:var(--m-accent);
  background:color-mix(in srgb, var(--m-accent) 12%, var(--m-surface))}
.mx-acc-01 .o-meter{height:2px;background:var(--m-line);border-radius:1px;overflow:hidden;margin-bottom:8px}
.mx-acc-01 .o-meter i{display:block;height:100%;background:var(--m-accent);
  transform:scaleX(0);transform-origin:0 50%}
.mx-acc-01 .o-card{display:grid;grid-template-rows:0fr}
.mx-acc-01 .o-in{overflow:hidden;min-height:0}
.mx-acc-01 .o-pad{border-top:1px solid var(--m-line);padding-top:6px}
.mx-acc-01 .o-name{font-family:var(--m-serif);font-size:15px;font-weight:600;letter-spacing:-.012em;
  line-height:1.15}
.mx-acc-01 .o-city{font-size:10px;color:var(--m-mut);margin-bottom:5px}
.mx-acc-01 .o-row{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:10px;color:var(--m-mut);height:15px}
.mx-acc-01 .o-row b{color:var(--m-ink);font-weight:600}
.mx-acc-01 .o-role{font-style:normal;font:500 9px/1 var(--m-mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--m-accent-ink);background:var(--m-accent);
  padding:3px 6px;border-radius:3px;display:inline-block}

/* ── 02 · refused, or unreachable ───────────────────────────────────── */
.mx-acc-02 .t-slots{display:flex;gap:3px;margin-bottom:8px}
.mx-acc-02 .t-s{flex:1;height:24px;border:1px solid var(--m-line2);border-radius:3px;
  background:var(--m-surface);display:grid;place-items:center;
  font:500 11px/1 var(--m-mono);color:var(--m-ink);
  transition:border-color 220ms cubic-bezier(.16,1,.3,1),color 220ms cubic-bezier(.16,1,.3,1),
             background-color 220ms cubic-bezier(.16,1,.3,1)}
.mx-acc-02 .t-s.no{border-color:var(--m-no);color:var(--m-no);
  background:color-mix(in srgb, var(--m-no) 12%, var(--m-surface))}
.mx-acc-02 .t-s.unk{border-style:dashed;border-color:var(--m-line2);color:var(--m-mut)}
.mx-acc-02 .t-verdict{position:relative;height:15px;margin-bottom:2px}
.mx-acc-02 .t-vtx{font-size:10.5px;color:var(--m-no);opacity:0;display:inline-block;
  transition:color 240ms cubic-bezier(.16,1,.3,1)}
.mx-acc-02 .t-vtx.gone{color:var(--m-mut)}
.mx-acc-02 .t-strike{position:absolute;left:0;top:8px;height:1px;width:100%;
  background:var(--m-mut);transform:scaleX(0);transform-origin:0 50%}
.mx-acc-02 .t-fix{display:grid;grid-template-rows:0fr}
.mx-acc-02 .t-in{overflow:hidden;min-height:0}
.mx-acc-02 .t-pad{border-top:1px solid var(--m-line);padding-top:6px}
.mx-acc-02 .t-line{font-size:10.5px;color:var(--m-warn);margin-bottom:6px;opacity:0}
.mx-acc-02 .t-acts{display:flex;gap:5px}
.mx-acc-02 .t-b{font:500 9.5px/1 var(--m-sans);color:var(--m-mut);border:1px solid var(--m-line2);
  border-radius:4px;padding:5px 8px;opacity:0}
.mx-acc-02 .t-b2{color:var(--m-accent);border-color:var(--m-accent)}

/* ── 03 · verified, and the app opens ───────────────────────────────── */
.mx-acc-03 .v-body{display:flex;gap:9px;align-items:stretch}
.mx-acc-03 .v-left{width:70px;flex:none;display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:7px;border:1px solid var(--m-line);border-radius:5px;
  background:var(--m-surface);padding:7px 5px}
.mx-acc-03 .v-tok{font:500 8.5px/1.2 var(--m-mono);color:var(--m-mut);letter-spacing:.04em}
.mx-acc-03 .v-seal{width:22px;height:22px;border-radius:50%;background:var(--m-accent);
  color:var(--m-accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700;
  opacity:0;transform:scale(.4)}
.mx-acc-03 .v-app{flex:1;min-width:0;position:relative;display:flex;gap:6px;
  border:1px solid var(--m-line);border-radius:5px;background:var(--m-surface);padding:7px}
.mx-acc-03 .v-rail{width:34px;flex:none;display:flex;flex-direction:column;gap:4px}
.mx-acc-03 .v-item{display:block;height:7px;border-radius:2px;background:var(--m-line2);opacity:.3}
.mx-acc-03 .v-item.on{background:var(--m-accent)}
.mx-acc-03 .v-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.mx-acc-03 .v-main i{display:block;height:6px;border-radius:2px;background:var(--m-line2);opacity:0}
.mx-acc-03 .v-main i:nth-child(1){width:74%}
.mx-acc-03 .v-main i:nth-child(2){width:96%}
.mx-acc-03 .v-main i:nth-child(3){width:58%}
.mx-acc-03 .v-hatch{position:absolute;inset:0;border-radius:5px;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 5px,var(--m-line2) 5px 6px);
  opacity:.9}

/* ── 04 · the code becomes a person ─────────────────────────────────── */
.mx-acc-04 .m-lbl{font:500 8px/1.2 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);margin:0 0 3px}
.mx-acc-04 .m-sec{margin-bottom:6px}
.mx-acc-04 .m-pend{display:grid;grid-template-rows:1fr}
.mx-acc-04 .m-pw{overflow:hidden;min-height:0}
.mx-acc-04 .m-list{border-top:1px solid var(--m-line)}
.mx-acc-04 .m-row{display:flex;align-items:center;gap:6px;height:23px;padding:0 4px;
  border-bottom:1px solid var(--m-line);background:var(--m-surface)}
.mx-acc-04 .m-av{width:15px;height:15px;border-radius:50%;flex:none;display:grid;place-items:center;
  font:600 7.5px/1 var(--m-sans);background:var(--m-line2);color:var(--m-ink)}
.mx-acc-04 .m-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10.5px}
.mx-acc-04 .m-rl{font:500 8.5px/1 var(--m-mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--m-mut)}
.mx-acc-04 .m-inv .m-av{opacity:0;transform:scale(.7)}
.mx-acc-04 .m-inv .m-nm{opacity:0}
.mx-acc-04 .m-code{font:500 10.5px/1 var(--m-mono);letter-spacing:.16em;color:var(--m-ink);
  position:absolute;left:25px;top:0;bottom:0;display:flex;align-items:center}
.mx-acc-04 .m-code i{font-style:normal;display:inline-block}
.mx-acc-04 .m-inv{position:relative}

/* ── 05 · expiring, then expired ────────────────────────────────────── */
.mx-acc-05 .c-cert{border:1px solid var(--m-line);border-radius:5px;background:var(--m-surface);
  padding:6px 7px;margin-bottom:7px}
.mx-acc-05 .c-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
.mx-acc-05 .c-nm{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-acc-05 .c-pill{font:500 8px/1 var(--m-mono);letter-spacing:.11em;text-transform:uppercase;
  border:1px solid var(--m-ok);color:var(--m-ok);border-radius:3px;padding:3px 5px;flex:none;
  transition:color 160ms cubic-bezier(.16,1,.3,1),border-color 160ms cubic-bezier(.16,1,.3,1)}
.mx-acc-05 .c-pill.wn{border-color:var(--m-warn);color:var(--m-warn)}
.mx-acc-05 .c-pill.no{border-color:var(--m-no);color:var(--m-no)}
.mx-acc-05 .c-bar{height:3px;border-radius:2px;background:var(--m-sunk);overflow:hidden;margin-bottom:4px}
.mx-acc-05 .c-bar i{display:block;height:100%;background:var(--m-ok);transform-origin:0 50%;
  transition:background-color 240ms cubic-bezier(.16,1,.3,1)}
.mx-acc-05 .c-bar.wn i{background:var(--m-warn)}
.mx-acc-05 .c-bar.no i{background:var(--m-no)}
.mx-acc-05 .c-days{font-size:9.5px;color:var(--m-mut)}
.mx-acc-05 .c-days b{color:var(--m-ink);font-family:var(--m-mono);font-variant-numeric:tabular-nums}
.mx-acc-05 .c-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.mx-acc-05 .c-d{font:500 7.5px/1 var(--m-mono);letter-spacing:.08em;color:var(--m-mut);
  text-align:center;margin-bottom:3px}
.mx-acc-05 .c-chip{position:relative;height:15px;border-radius:3px;background:var(--m-surface);
  border:1px solid var(--m-line2);border-left:2px solid var(--m-line2);
  display:grid;place-items:center;font:500 8px/1 var(--m-mono);color:var(--m-mut);overflow:hidden;
  transition:border-left-color 240ms cubic-bezier(.16,1,.3,1)}
.mx-acc-05 .c-chip.flag{border-left-color:var(--m-no)}
.mx-acc-05 .c-chip em{position:absolute;inset:0;font-style:normal;opacity:0;
  background:repeating-linear-gradient(135deg,transparent 0 3px,var(--m-no) 3px 4px);
  background-size:200% 100%}

/* ── 06 · menu resolves into reviewable lines ───────────────────────── */
.mx-acc-06 .r-hd b{font-family:var(--m-mono);font-variant-numeric:tabular-nums;color:var(--m-warn)}
.mx-acc-06 .r-list{border-top:1px solid var(--m-line)}
.mx-acc-06 .r-r{position:relative;display:flex;align-items:center;gap:6px;height:18px;
  padding:0 5px 0 6px;border-bottom:1px solid var(--m-line);background:var(--m-surface)}
.mx-acc-06 .r-rule{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--m-warn);
  transform:scaleY(0);transform-origin:50% 50%}
.mx-acc-06 .r-c1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10px;opacity:0}
.mx-acc-06 .r-c2{width:30px;flex:none;font:400 9.5px/1 var(--m-mono);color:var(--m-mut);opacity:0}
.mx-acc-06 .r-c3{width:36px;flex:none;text-align:right;font:400 9.5px/1 var(--m-mono);
  font-variant-numeric:tabular-nums;opacity:0}
.mx-acc-06 .r-sk{position:absolute;height:7px;border-radius:2px;top:5px;opacity:0;
  background:linear-gradient(90deg,var(--m-sunk) 8%,var(--m-line2) 42%,var(--m-sunk) 78%);
  background-size:240% 100%;animation:acc-shim 1900ms cubic-bezier(.45,0,.55,1) infinite;
  animation-play-state:paused}
.mx-acc-06.is-load .r-sk{animation-play-state:running}
.mx-acc-06 .r-sk.k1{left:6px;right:74px}
.mx-acc-06 .r-sk.k2{width:24px;right:44px}
.mx-acc-06 .r-sk.k3{width:30px;right:5px}

/* ── 07 · asked once, then never ────────────────────────────────────── */
.mx-acc-07 .h-flow{display:grid;grid-template-columns:1fr 11px 1fr 11px 1fr;align-items:stretch;
  margin-bottom:7px}
.mx-acc-07 .h-node{position:relative;overflow:hidden;min-width:0;border:1px solid var(--m-line2);
  border-radius:4px;background:var(--m-surface);padding:5px 6px;
  transition:border-color 240ms cubic-bezier(.16,1,.3,1),opacity 240ms cubic-bezier(.16,1,.3,1)}
.mx-acc-07 .h-node b{display:block;font-size:10px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mx-acc-07 .h-node i{display:block;font-style:normal;font:400 9px/1.3 var(--m-mono);
  color:var(--m-mut);white-space:nowrap;overflow:hidden}
.mx-acc-07 .h-node.on{border-color:var(--m-accent)}
.mx-acc-07 .h-n3{opacity:.35}
.mx-acc-07 .h-fill{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--m-accent);
  transform:scaleX(0);transform-origin:0 50%}
.mx-acc-07 .h-link{align-self:center;height:1px;background:var(--m-line2)}
.mx-acc-07 .h-nudge{display:grid;grid-template-rows:1fr}
.mx-acc-07 .h-nw{overflow:hidden;min-height:0}
.mx-acc-07 .h-nin{border:1px solid var(--m-line);border-left:2px solid var(--m-warn);border-radius:4px;
  background:var(--m-sunk);padding:6px 7px;font-size:10px;color:var(--m-mut)}
.mx-acc-07 .h-nin span{color:var(--m-mut);opacity:.7;display:block;font-size:9px;margin-top:2px}

/* ── 08 · published, and seen ───────────────────────────────────────── */
.mx-acc-08 .p-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.mx-acc-08 .p-days span{font:500 7.5px/1 var(--m-mono);letter-spacing:.06em;color:var(--m-mut);
  text-align:center}
.mx-acc-08 .p-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:9px}
.mx-acc-08 .p-col{display:flex;flex-direction:column;gap:3px}
.mx-acc-08 .p-c{height:12px;border-radius:2px;border:1px dashed var(--m-line2);
  background:var(--m-sunk);overflow:hidden;
  transition:border-style 260ms cubic-bezier(.16,1,.3,1),border-color 260ms cubic-bezier(.16,1,.3,1)}
.mx-acc-08 .p-c.pub{border-style:solid;border-color:var(--m-line2)}
.mx-acc-08 .p-c i{display:block;height:100%;background:var(--m-accent);opacity:.5;
  transform:scaleY(0);transform-origin:50% 100%}
.mx-acc-08 .p-rec{display:flex;align-items:center;gap:7px}
.mx-acc-08 .p-dots{display:flex;gap:4px;flex:none}
.mx-acc-08 .p-dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--m-line2);
  background:transparent;transition:background-color 200ms cubic-bezier(.16,1,.3,1),
  border-color 200ms cubic-bezier(.16,1,.3,1)}
.mx-acc-08 .p-dot.seen{background:var(--m-accent);border-color:var(--m-accent)}
.mx-acc-08 .p-dot.wait{animation:acc-breathe 2400ms ease-in-out infinite}
@keyframes acc-breathe{0%,100%{opacity:1}50%{opacity:.32}}
.mx-acc-08 .p-cnt{font-size:9.5px;color:var(--m-mut)}
.mx-acc-08 .p-cnt b{font-family:var(--m-mono);font-variant-numeric:tabular-nums;color:var(--m-ink)}

/* ── 09 · a call-out, and the cover ─────────────────────────────────── */
.mx-acc-09 .g-col{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.mx-acc-09 .g-sl{position:relative;display:flex;align-items:center;gap:7px;height:22px;
  padding:0 7px;border-radius:4px;border:1px solid var(--m-line2);background:var(--m-surface);
  transition:background-color 320ms cubic-bezier(.16,1,.3,1),
             border-color 320ms cubic-bezier(.16,1,.3,1)}
.mx-acc-09 .g-sl.open{background:transparent;border-style:dashed;border-color:var(--m-no)}
.mx-acc-09 .g-who{flex:1;min-width:0;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.mx-acc-09 .g-tm{font:400 9.5px/1 var(--m-mono);color:var(--m-mut);flex:none}
.mx-acc-09 .g-open{position:absolute;left:7px;top:0;bottom:0;display:flex;align-items:center;
  font:500 8.5px/1 var(--m-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--m-no);
  opacity:0;pointer-events:none}
.mx-acc-09 .g-ring{position:absolute;inset:-1px;border-radius:5px;border:1px solid var(--m-no);
  opacity:0;pointer-events:none}
.mx-acc-09 .g-mark{position:absolute;left:9px;top:50%;width:1px;height:1px}
.mx-acc-09 .g-offer{display:flex;align-items:center;gap:7px}
.mx-acc-09 .g-dots{display:flex;gap:5px;flex:none}
.mx-acc-09 .g-dt{width:13px;height:13px;border-radius:50%;background:var(--m-line2);
  color:var(--m-ink);display:grid;place-items:center;font:600 6.5px/1 var(--m-sans);
  opacity:0;transform:scale(.4);
  transition:background-color 200ms cubic-bezier(.16,1,.3,1),opacity 240ms cubic-bezier(.16,1,.3,1)}
.mx-acc-09 .g-dt.pick{background:var(--m-accent);color:var(--m-accent-ink)}
.mx-acc-09 .g-lbl{font-size:9.5px;color:var(--m-mut);opacity:0}

/* ── 10 · connect the POS ───────────────────────────────────────────── */
.mx-acc-10 .s-body{display:flex;gap:8px;align-items:stretch;margin-bottom:6px}
.mx-acc-10 .s-left{width:88px;flex:none;display:flex;flex-direction:column;gap:5px}
.mx-acc-10 .s-prov{border:1px solid var(--m-line2);border-radius:4px;background:var(--m-surface);
  padding:5px 6px;transition:border-color 240ms cubic-bezier(.16,1,.3,1)}
.mx-acc-10 .s-prov.on{border-color:var(--m-accent)}
.mx-acc-10 .s-prov b{display:block;font-size:11px;font-weight:600}
.mx-acc-10 .s-prov i{display:block;font-style:normal;font:400 8.5px/1.3 var(--m-mono);color:var(--m-mut)}
.mx-acc-10 .s-btn{border:1px solid var(--m-line2);border-radius:4px;text-align:center;
  padding:5px 4px;font:500 9.5px/1 var(--m-sans);color:var(--m-mut);
  transition:border-color 160ms cubic-bezier(.16,1,.3,1),color 160ms cubic-bezier(.16,1,.3,1)}
.mx-acc-10 .s-btn.on{border-color:var(--m-accent);color:var(--m-accent)}
.mx-acc-10 .s-right{flex:1;min-width:0;position:relative;padding-left:9px}
.mx-acc-10 .s-wire{position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--m-accent);
  transform:scaleY(0);transform-origin:50% 0}
.mx-acc-10 .s-f{display:flex;align-items:center;gap:5px;height:15px;font-size:9.5px;
  color:var(--m-ink);opacity:.28}
.mx-acc-10 .s-f i{display:block;width:5px;height:1px;background:var(--m-line2);flex:none;
  transition:background-color 200ms cubic-bezier(.16,1,.3,1)}
.mx-acc-10 .s-f.on i{background:var(--m-accent)}
.mx-acc-10 .s-foot{font-size:9.5px;color:var(--m-mut);border-top:1px solid var(--m-line);padding-top:5px}
.mx-acc-10 .s-foot b{font-family:var(--m-mono);font-variant-numeric:tabular-nums;color:var(--m-ink)}
.mx-acc-10 .s-pill{font:500 8px/1 var(--m-mono);letter-spacing:.1em;text-transform:uppercase;
  background:var(--m-accent);color:var(--m-accent-ink);border-radius:3px;padding:3px 5px;
  opacity:0;transform:scale(.7);display:inline-block}

/* ── 11 · a switch with nothing behind it ───────────────────────────── */
.mx-acc-11 .x-row{display:flex;align-items:center;gap:9px;border:1px solid var(--m-line);
  border-radius:5px;background:var(--m-surface);padding:7px;margin-bottom:8px}
.mx-acc-11 .x-tx{flex:1;min-width:0}
.mx-acc-11 .x-tx b{display:block;font-size:10.5px;font-weight:600}
.mx-acc-11 .x-tx i{display:block;font-family:var(--m-serif);font-size:9.5px;color:var(--m-mut);
  line-height:1.25}
.mx-acc-11 .x-sw{flex:none;width:34px;height:19px;border-radius:10px;border:1px solid var(--m-line2);

    purpose:'GAP — register.md §9: the invite check fetches a relative /api path, so on a host with no rewrite the request fails and the catch paints "not_found". A network failure is rendered as a rejected code. The motion is the verdict being WITHDRAWN: red drains back out of the slots and a third state arrives, because the app was never entitled to call that code dead.',

            f.map(function(n){ return '<div class="s-f"><i></i>' + n + '</div>'; }).join('') +
          '</div>' +
        '</div>' +
        '<div class="s-foot"><b>0</b> checks ingested</div>' +
      '</div>';
    })(),
    play: function(root){
      var r = runner(root);
      var prov = q(root, '.s-prov'), btn = q(root, '.s-btn'), pill = q(root, '.s-pill');
      var none = q(root, '.s-none'), wire = q(root, '.s-wire');
      var feats = qa(root, '.s-f'), foot = q(root, '.s-foot b');
      prov.classList.remove('on'); btn.classList.remove('on');
      pill.style.opacity = '0'; pill.style.transform = 'scale(.7)';
      none.style.opacity = '1';
      wire.style.transform = 'scaleY(0)';
      feats.forEach(function(f){ f.classList.remove('on'); f.style.opacity = '.28'; f.style.transform = 'none'; });
      foot.textContent = '0';
      void root.offsetWidth;

      r.at(300, function(){
        btn.classList.add('on');
        r.an(btn, [{ transform:'scale(1)' }, { transform:'scale(.965)' },
                   { transform:'scale(1)' }], opt(280, E('tuck')));
      });
      r.at(430, function(){
        prov.classList.add('on');
        none.style.opacity = '0';
        r.an(none, [{ opacity:1 }, { opacity:0 }], opt(160));
        pill.style.opacity = '1'; pill.style.transform = 'none';
        r.an(pill, [{ opacity:0, transform:'scale(.7)' }, { opacity:1, transform:'none' }],
             opt(360, E('stamp')));
      });
      r.at(580, function(){
        wire.style.transform = 'scaleY(1)';
        r.an(wire, [{ transform:'scaleY(0)' }, { transform:'scaleY(1)' }], opt(640, EASE.turn));
      });
      feats.forEach(function(f, i){
        r.at(650 + i * 46, function(){
          f.classList.add('on');
          f.style.opacity = '1';
          r.an(f, [{ opacity:.28, transform:'translateX(-4px)' },
                   { opacity:1, transform:'none' }], opt(240));
        });
      });
      r.at(1400, function(){
        tick(r, foot, 0, 1284, 840, function(v){ return Math.round(v).toLocaleString(); });
      });
    }
  });

  /* ══ 11 · A switch with nothing behind it ═══════════════════════════ */
  push({
    id:'acc-11',
    name:'A switch with nothing behind it',
    purpose:'GAP — settings.md §9: the usage-analytics consent promises to "find the screens that slow people down", but uxSignals ships dark unless VITE_UX_OPTIMIZER is true, so today the switch turns on and nothing happens. Proposed: consent cannot complete without a receiver. The thumb travels, finds nothing at the other end, and RETURNS. Click the switch to try it; "try it live" arms the sink and the same gesture latches.',
    spec:'thumb ' + spec('tuck', 'tuck').slice(7) + ' · return 300ms · packets 90ms apart along the wire',
    source:'apps/web/src/components/settings/ServicesPermissions.tsx:31 + lib/uxSignals.ts:15',
    html:
      '<div class="mx-acc mx-acc-11">' +
        '<div class="a-h"><span class="a-k">Settings · Services</span><span class="a-k x-mode">receiver: dark</span></div>' +
        '<div class="x-row">' +
          '<div class="x-tx"><b>Usage analytics</b><i>“find the screens that slow people down”</i></div>' +
          '<button class="x-sw" type="button" aria-label="Usage analytics"><span class="x-th"></span></button>' +
        '</div>' +
        '<div class="x-wire"><span class="x-node">page</span>' +
          '<span class="x-l"><i class="x-p"></i><i class="x-p"></i><i class="x-p"></i></span>' +
          '<span class="x-node x-end">sink</span></div>' +
        '<div class="x-note">no receiver — the switch returns</div>' +
        '<span class="x-try">try it live</span>' +
      '</div>',
    play: function(root){
      var r = runner(root);
      var sw = q(root, '.x-sw'), th = q(root, '.x-th'), mode = q(root, '.x-mode');
      var end = q(root, '.x-end'), pkts = qa(root, '.x-p'), note = q(root, '.x-note');
      var line = q(root, '.x-l'), tryB = q(root, '.x-try');
      var live = root.__accLive === true;

      /* one-time wiring: the motion IS a gesture, so it must be tryable */
      if (!root.__accWired){
        root.__accWired = true;
        sw.addEventListener('click', function(){
          var m = window.MUDAVYM_MOTIONS.filter(function(x){ return x.id === 'acc-11'; })[0];
          if (m) m.play(root);
        });
        tryB.addEventListener('click', function(){
          root.__accLive = !root.__accLive;
          var m = window.MUDAVYM_MOTIONS.filter(function(x){ return x.id === 'acc-11'; })[0];
          if (m) m.play(root);
        });
      }

      sw.classList.remove('lit');
      th.style.transform = 'none';
      end.classList.remove('live');
      pkts.forEach(function(p){ p.style.opacity = '0'; p.style.transform = 'none'; });
      mode.textContent = 'receiver: ' + (live ? 'live' : 'dark');
      mode.className = 'a-k x-mode ' + (live ? 'ok' : '');
      note.textContent = '';
      note.className = 'x-note';
      tryB.textContent = live ? 'try it dark' : 'try it live';
      void root.offsetWidth;

      var travel = 34 - 2 - 13 - 2; /* track - padding - thumb */
      r.at(360, function(){
        sw.classList.add('lit');
        th.style.transform = 'translateX(' + travel + 'px)';
        r.an(th, [{ transform:'none' }, { transform:'translateX(' + travel + 'px)' }],
             opt(260, E('tuck')));
      });

      if (!live){
        /* the switch reaches the end of its travel, finds no receiver, and comes back */
        r.at(780, function(){
          sw.classList.remove('lit');
          th.style.transform = 'none';
          r.an(th, [{ transform:'translateX(' + travel + 'px)' }, { transform:'none' }],
               opt(300, E('tuck')));
        });
        r.at(900, function(){
          note.textContent = 'no receiver — the switch returns';
          rise(r, note, 4, 320);
        });
      } else {
        r.at(680, function(){
          end.classList.add('live');
          r.an(end, [{ opacity:.4, transform:'scale(.9)' }, { opacity:1, transform:'none' }],
               opt(360, E('stamp')));
        });
        var w = (line ? line.getBoundingClientRect().width : 90) - 5;
        pkts.forEach(function(p, i){
          r.at(820 + i * 90, function(){
            p.style.opacity = '0';
            r.an(p, [{ opacity:0, transform:'translateX(0)' },
                     { opacity:1, transform:'translateX(4px)' },
                     { opacity:1, transform:'translateX(' + (w - 6) + 'px)' },
                     { opacity:0, transform:'translateX(' + w + 'px)' }], opt(520, EASE.turn));
          });
        });
        r.at(1120, function(){
          note.textContent = '3 signals · rage-click, dead-click, TTI';
          note.className = 'x-note ok';
          rise(r, note, 4, 320);
        });
      }
    }
  });
})();
