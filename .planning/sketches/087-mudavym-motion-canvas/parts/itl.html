<style>
/* ═══════════════════════════════════════════════════════════════════════════
   itl — Intelligence & reporting. How Mudavym says what it concluded, and how
   honestly it says it. Grounded in /reports, /recommendations,
   /recommendations/catalog, /notifications and /logs.

   Every selector is prefixed .mx-itl. No hard-coded colours, no font stacks.
   House rules carried in: an unknown is an em dash (never a 0); stagger is
   first-paint only; overshoot is permitted nowhere except the seal.
   ═══════════════════════════════════════════════════════════════════════════ */

.mx-itl{
  --r:1;                                  /* host speed multiplier, set in play() */
  --e1:cubic-bezier(.16,1,.3,1);          /* settle — the house curve */
  --e2:cubic-bezier(.32,.72,0,1);         /* turn — opens a record */
  --e3:cubic-bezier(.45,0,.55,1);         /* shimmer sweep */
  font-family:var(--m-sans);font-size:11px;line-height:1.4;color:var(--m-ink);
  width:100%;position:relative;-webkit-font-smoothing:antialiased;
}
.mx-itl *{box-sizing:border-box}
.mx-itl .ih{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.mx-itl .ik{font:500 8.5px/1.2 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap}
.mx-itl .ik.on{color:var(--m-accent)}
.mx-itl .ik.bad{color:var(--m-no)}
.mx-itl .imono{font-family:var(--m-mono);font-variant-numeric:tabular-nums lining-nums;
  letter-spacing:-.02em}
.mx-itl .isay{font-family:var(--m-serif);font-size:12px;line-height:1.35}
.mx-itl .icap{font:400 9px/1.35 var(--m-sans);color:var(--m-mut)}
.mx-itl .icap b{color:var(--m-ink);font-weight:600}

/* shimmer — the only motion the engine is allowed while it is working */
@keyframes mx-itl-shim{0%{background-position:130% 0}100%{background-position:-30% 0}}
.mx-itl .shim{color:transparent;
  background-image:linear-gradient(100deg,var(--m-mut) 0%,var(--m-mut) 34%,
    var(--m-ink) 50%,var(--m-mut) 66%,var(--m-mut) 100%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;
  animation:mx-itl-shim calc(1900ms * var(--r)) var(--e3) infinite}
.mx-itl .skb{height:7px;border-radius:3.5px;background:var(--m-line);
  background-image:linear-gradient(100deg,transparent 34%,
    color-mix(in oklab,var(--m-ink) 15%,transparent) 50%,transparent 66%);
  background-size:240% 100%;
  animation:mx-itl-shim calc(1900ms * var(--r)) var(--e3) infinite}

/* ── 01 · the conclusion arrives ────────────────────────────────────────── */
.mx-itl-01 .i1-stage{position:relative;min-height:96px}
.mx-itl-01 .i1-sk{position:absolute;inset:0;display:flex;flex-direction:column;gap:9px;
  padding-top:2px;opacity:1;transition:opacity calc(240ms * var(--r)) var(--e1)}
.mx-itl-01.on .i1-sk{opacity:0;pointer-events:none}
.mx-itl-01 .i1-sk .isay{margin-top:3px}
.mx-itl-01 .i1-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--m-line)}
.mx-itl-01 .i1-r{display:flex;align-items:flex-start;gap:6px;padding:6px 0 5px;
  border-bottom:1px solid var(--m-line);opacity:0;transform:translateY(6px);
  transition:opacity calc(420ms * var(--r)) var(--e1),
             transform calc(420ms * var(--r)) var(--e1)}
.mx-itl-01.on .i1-r{opacity:1;transform:none}
.mx-itl-01 .i1-cat{flex:none;font:600 8px/1.5 var(--m-mono);letter-spacing:.06em;
  text-transform:uppercase;padding:1px 5px;border-radius:999px;
  background:color-mix(in oklab,var(--m-accent) 16%,transparent);
  color:var(--m-accent);margin-top:1px}
.mx-itl-01 .i1-r[data-c="inventory"] .i1-cat{background:color-mix(in oklab,var(--m-warn) 16%,transparent);color:var(--m-warn)}
.mx-itl-01 .i1-txt{flex:1;min-width:0;font-size:10.5px;line-height:1.32;color:var(--m-ink)}
.mx-itl-01 .i1-pin{color:var(--m-warn);font-size:8px;margin-right:3px;font-style:normal}
.mx-itl-01 .i1-sc{flex:none;font-size:9.5px;color:var(--m-mut);margin-top:1px}

/* ── 02 · explain — the effect size under the sentence ──────────────────── */
.mx-itl-02 .i2-card{background:var(--m-surface);border:1px solid var(--m-line);
  border-radius:7px;padding:9px 10px}
.mx-itl-02 .i2-top{display:flex;gap:7px;align-items:flex-start}
.mx-itl-02 .i2-cat{flex:none;font:600 8px/1.5 var(--m-mono);letter-spacing:.06em;
  text-transform:uppercase;padding:1px 5px;border-radius:999px;margin-top:1px;
  background:color-mix(in oklab,var(--m-accent) 16%,transparent);color:var(--m-accent)}
.mx-itl-02 .i2-say{font-size:11px;line-height:1.34}
.mx-itl-02 .i2-acts{display:flex;gap:4px;align-items:center;margin:7px 0 0 0;
  opacity:0;transition:opacity calc(200ms * var(--r)) var(--e1)}
.mx-itl-02.on .i2-acts{opacity:1}
.mx-itl-02 .i2-b{font:600 9px/1 var(--m-sans);padding:4px 6px;border-radius:4px;
  color:var(--m-mut);cursor:pointer;user-select:none;
  transition:background-color calc(160ms * var(--r)) var(--e1),
             color calc(160ms * var(--r)) var(--e1)}
.mx-itl-02 .i2-act{color:var(--m-ok);background:color-mix(in oklab,var(--m-ok) 13%,transparent)}
.mx-itl-02 .i2-exp:hover,.mx-itl-02 .i2-exp.hit{background:var(--m-sunk);color:var(--m-ink)}
.mx-itl-02 .i2-work{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows calc(420ms * var(--r)) var(--e2)}
.mx-itl-02.open .i2-work{grid-template-rows:1fr}
.mx-itl-02 .i2-work>div{overflow:hidden;min-height:0}
.mx-itl-02 .i2-workin{margin-top:7px;padding:7px 8px;border-radius:5px;background:var(--m-sunk);
  border:1px solid var(--m-line)}
.mx-itl-02 .i2-workin p{margin:0 0 2px;font-size:9.5px;color:var(--m-mut);
  opacity:0;transform:translateY(4px);
  transition:opacity calc(220ms * var(--r)) var(--e1),transform calc(220ms * var(--r)) var(--e1)}
.mx-itl-02.open .i2-workin p{opacity:1;transform:none}
.mx-itl-02 .i2-workin p b{color:var(--m-ink);font-family:var(--m-mono);
  font-variant-numeric:tabular-nums;font-weight:500}
.mx-itl-02 .i2-key{margin-top:4px !important;font-size:9px;color:var(--m-line2)}

/* ── 03 · the reason is captured before the card leaves ─────────────────── */
.mx-itl-03{display:flex;flex-direction:column;gap:8px}
.mx-itl-03 .i3-hold{display:grid;grid-template-rows:1fr;
  transition:grid-template-rows calc(320ms * var(--r)) var(--e1),
             opacity calc(240ms * var(--r)) var(--e1)}
.mx-itl-03.gone .i3-hold{grid-template-rows:0fr;opacity:0}
.mx-itl-03 .i3-hold>div{overflow:hidden;min-height:0}
.mx-itl-03 .i3-card{background:var(--m-surface);border:1px solid var(--m-line);
  border-radius:7px;padding:9px 10px}
.mx-itl-03 .i3-obs{font-size:10px;color:var(--m-mut);margin-bottom:3px}
.mx-itl-03 .i3-obs b{color:var(--m-ink);font-family:var(--m-mono);
  font-variant-numeric:tabular-nums;font-weight:500}
.mx-itl-03 .i3-rec{font-size:11.5px;font-weight:600;line-height:1.3}
.mx-itl-03 .i3-foot{display:flex;justify-content:flex-end;margin-top:7px}
.mx-itl-03 .i3-dis{font:600 9px/1 var(--m-sans);padding:4px 7px;border-radius:4px;
  border:1px solid var(--m-line2);color:var(--m-mut);cursor:pointer;user-select:none;
  transition:border-color calc(160ms * var(--r)) var(--e1),color calc(160ms * var(--r)) var(--e1)}
.mx-itl-03 .i3-dis:hover,.mx-itl-03.menu .i3-dis{border-color:var(--m-no);color:var(--m-no)}
.mx-itl-03 .i3-rs{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows calc(300ms * var(--r)) var(--e1)}
.mx-itl-03.menu .i3-rs{grid-template-rows:1fr}
.mx-itl-03.told .i3-rs{grid-template-rows:0fr}
.mx-itl-03 .i3-rs>div{overflow:hidden;min-height:0}
.mx-itl-03 .i3-rsin{display:flex;flex-wrap:wrap;gap:4px;padding-top:7px}
.mx-itl-03 .i3-rn{font:500 9px/1 var(--m-sans);padding:4px 6px;border-radius:4px;
  border:1px solid var(--m-line);background:var(--m-sunk);color:var(--m-mut);
  cursor:pointer;user-select:none;opacity:0;transform:translateY(6px);
  transition:opacity calc(220ms * var(--r)) var(--e1),
             transform calc(220ms * var(--r)) var(--e1),
             background-color calc(160ms * var(--r)) var(--e1),
             border-color calc(160ms * var(--r)) var(--e1),
             color calc(160ms * var(--r)) var(--e1)}
.mx-itl-03.menu .i3-rn{opacity:1;transform:none}
.mx-itl-03 .i3-rn.pick{background:var(--m-accent);border-color:var(--m-accent);
  color:var(--m-accent-ink);font-weight:600}
.mx-itl-03 .i3-rn.drop{opacity:0;transform:scale(.94)}
.mx-itl-03 .i3-stamp{margin-top:6px;font:500 9px/1.3 var(--m-mono);color:var(--m-mut);
  letter-spacing:.02em;opacity:0;transform:translateY(-4px);
  transition:opacity calc(240ms * var(--r)) var(--e1),transform calc(240ms * var(--r)) var(--e1)}
.mx-itl-03.told .i3-stamp{opacity:1;transform:none}
.mx-itl-03 .i3-stamp b{color:var(--m-ink);font-weight:500}
.mx-itl-03 .i3-count{display:flex;align-items:baseline;gap:6px;
  border-top:1px solid var(--m-line);padding-top:6px}
.mx-itl-03 .i3-count span{font:500 8.5px/1.2 var(--m-mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--m-mut)}
.mx-itl-03 .i3-n{font-size:14px;font-weight:500;color:var(--m-ink)}

/* ── 04 · bulk: four leave together, one line in the ledger ─────────────── */
.mx-itl-04 .i4-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:4px 7px;border-radius:5px;margin-bottom:6px;
  background:color-mix(in oklab,var(--m-accent) 13%,transparent);
  border:1px solid color-mix(in oklab,var(--m-accent) 34%,transparent);
  opacity:0;transform:translateY(-4px);
  transition:opacity calc(220ms * var(--r)) var(--e1),transform calc(220ms * var(--r)) var(--e1)}
.mx-itl-04.armed .i4-bar{opacity:1;transform:none}
.mx-itl-04 .i4-bar b{font:600 9.5px/1 var(--m-sans);color:var(--m-accent)}
.mx-itl-04 .i4-bar i{font:600 9px/1 var(--m-sans);font-style:normal;padding:3px 6px;
  border-radius:4px;background:var(--m-accent);color:var(--m-accent-ink)}
.mx-itl-04 .i4-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--m-line)}
.mx-itl-04 .i4-r{display:flex;align-items:center;gap:6px;height:19px;overflow:hidden;
  border-bottom:1px solid var(--m-line);
  transition:height calc(260ms * var(--r)) var(--e1),opacity calc(200ms * var(--r)) var(--e1),
             border-bottom-width calc(260ms * var(--r)) var(--e1)}
/* the rule must go too, or four "gone" rows leave four 1px scars behind */
.mx-itl-04.go .i4-r.sel{height:0;opacity:0;border-bottom-width:0}
.mx-itl-04 .i4-cb{flex:none;width:9px;height:9px;border-radius:2px;border:1px solid var(--m-line2);
  position:relative;
  transition:background-color calc(160ms * var(--r)) var(--e1),
             border-color calc(160ms * var(--r)) var(--e1)}
.mx-itl-04 .i4-cb::after{content:"";position:absolute;left:2px;top:1px;width:3px;height:5px;
  border:solid var(--m-accent-ink);border-width:0 1.4px 1.4px 0;transform:rotate(42deg) scale(0);
  transform-origin:50% 50%;transition:transform calc(180ms * var(--r)) var(--e1)}
.mx-itl-04 .i4-r.sel .i4-cb{background:var(--m-accent);border-color:var(--m-accent)}
.mx-itl-04 .i4-r.sel .i4-cb::after{transform:rotate(42deg) scale(1)}
.mx-itl-04 .i4-k{flex:1;min-width:0;font-family:var(--m-mono);font-size:9px;color:var(--m-ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-itl-04 .i4-u{flex:none;font:500 8px/1.5 var(--m-sans);padding:1px 5px;border-radius:999px;
  color:var(--m-mut);background:var(--m-sunk)}
.mx-itl-04 .i4-r[data-u="now"] .i4-u{color:var(--m-no);background:color-mix(in oklab,var(--m-no) 14%,transparent)}
.mx-itl-04 .i4-led{display:flex;align-items:center;gap:6px;margin-top:7px;
  font:500 9.5px/1.3 var(--m-sans);color:var(--m-mut);
  opacity:0;transform:translateY(5px);
  transition:opacity calc(260ms * var(--r)) var(--e1),transform calc(260ms * var(--r)) var(--e1)}
.mx-itl-04.wrote .i4-led{opacity:1;transform:none}
.mx-itl-04 .i4-dot{flex:none;width:6px;height:6px;border-radius:50%;
  border:1.2px solid var(--m-mut);background:transparent;
  transition:background-color calc(200ms * var(--r)) var(--e1),
             border-color calc(200ms * var(--r)) var(--e1)}
.mx-itl-04.ok .i4-dot{background:var(--m-ok);border-color:var(--m-ok)}
.mx-itl-04 .i4-srv{margin-left:auto;font-family:var(--m-mono);font-size:8.5px;
  color:var(--m-line2);letter-spacing:.04em}
.mx-itl-04.ok .i4-srv{color:var(--m-ok)}

/* ── 05 · a block is dragged, the canvas reflows, the layout saves ──────── */
.mx-itl-05 .i5-wrap{position:relative;height:94px;touch-action:none}
.mx-itl-05 .i5-b{position:absolute;left:0;top:0;width:87px;height:44px;border-radius:5px;
  background:var(--m-surface);border:1px solid var(--m-line);padding:5px 6px;
  cursor:grab;user-select:none;
  transition:transform calc(200ms * var(--r)) ease,box-shadow 160ms var(--e1),
             opacity 160ms var(--e1),scale 160ms var(--e1)}
.mx-itl-05 .i5-b.lift{cursor:grabbing;z-index:5;scale:1.035;opacity:.9;
  box-shadow:0 10px 26px color-mix(in oklab,var(--m-sunk) 78%,transparent);
  transition:box-shadow 160ms var(--e1),opacity 160ms var(--e1),scale 160ms var(--e1)}
.mx-itl-05 .i5-t{font:600 8.5px/1.2 var(--m-sans);color:var(--m-ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.mx-itl-05 .i5-v{font-family:var(--m-mono);font-variant-numeric:tabular-nums;font-size:12px;
  color:var(--m-ink);margin-top:3px;letter-spacing:-.02em}
.mx-itl-05 .i5-v i{font-style:normal;font-size:8px;color:var(--m-mut);margin-left:2px}
.mx-itl-05 .i5-ph{position:absolute;left:0;top:0;width:87px;height:44px;border-radius:5px;
  border:1.5px dashed var(--m-accent);
  background:color-mix(in oklab,var(--m-accent) 12%,transparent);
  opacity:0;pointer-events:none;
  transition:transform calc(200ms * var(--r)) ease,opacity calc(160ms * var(--r)) var(--e1)}
.mx-itl-05 .i5-ph.on{opacity:.6}
.mx-itl-05 .i5-save{display:inline-flex;align-items:center;gap:4px;margin-top:6px;
  font:500 9px/1 var(--m-mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--m-ok);opacity:0;transform:translateY(4px);
  transition:opacity calc(320ms * var(--r)) var(--e1),transform calc(320ms * var(--r)) var(--e1)}
.mx-itl-05.saved .i5-save{opacity:1;transform:none}

/* ── 06 · blocked — the requirement that is missing says so ─────────────── */
.mx-itl-06 .i6-key{font-family:var(--m-mono);font-size:9px;color:var(--m-mut);
  word-break:break-all;margin-bottom:7px}
.mx-itl-06 .i6-lbl{font:600 8.5px/1.2 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);margin-bottom:5px}
.mx-itl-06 .i6-chips{display:flex;flex-wrap:wrap;gap:4px}
@keyframes mx-itl-pulse{0%{transform:scale(1)}42%{transform:scale(1.07)}100%{transform:scale(1)}}
.mx-itl-06 .i6-c{display:inline-flex;align-items:center;gap:4px;font:500 9.5px/1 var(--m-sans);
  padding:4px 7px;border-radius:999px;background:var(--m-sunk);color:var(--m-mut);
  border:1px solid var(--m-line);
  transition:background-color calc(160ms * var(--r)) var(--e1),
             border-color calc(160ms * var(--r)) var(--e1),
             color calc(160ms * var(--r)) var(--e1)}
.mx-itl-06 .i6-c::before{content:"";width:5px;height:5px;border-radius:50%;
  background:var(--m-line2);transform:scale(0);
  transition:transform calc(200ms * var(--r)) var(--e1),
             background-color calc(160ms * var(--r)) var(--e1)}
.mx-itl-06 .i6-c.ok{color:var(--m-ok);border-color:color-mix(in oklab,var(--m-ok) 42%,transparent);
  background:color-mix(in oklab,var(--m-ok) 12%,transparent)}
.mx-itl-06 .i6-c.ok::before{background:var(--m-ok);transform:scale(1)}
.mx-itl-06 .i6-c.no{color:var(--m-warn);border-color:color-mix(in oklab,var(--m-warn) 46%,transparent);
  background:color-mix(in oklab,var(--m-warn) 13%,transparent)}
.mx-itl-06 .i6-c.no::before{background:var(--m-warn);transform:scale(1)}
.mx-itl-06 .i6-c.beat{animation:mx-itl-pulse calc(240ms * var(--r)) var(--e1) 1}
.mx-itl-06 .i6-blk{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows calc(420ms * var(--r)) var(--e2)}
.mx-itl-06.blocked .i6-blk{grid-template-rows:1fr}
.mx-itl-06 .i6-blk>div{overflow:hidden;min-height:0}
.mx-itl-06 .i6-blkin{margin-top:7px;padding:7px 8px;border-radius:5px;font-size:9.5px;line-height:1.4;
  border:1px solid color-mix(in oklab,var(--m-warn) 40%,transparent);
  background:color-mix(in oklab,var(--m-warn) 11%,transparent);color:var(--m-ink)}
.mx-itl-06 .i6-blkin b{color:var(--m-warn);font-family:var(--m-mono);font-weight:500;
  display:inline-block;opacity:0;transform:translateY(-5px);
  transition:opacity calc(240ms * var(--r)) var(--e1) calc(120ms * var(--r)),
             transform calc(240ms * var(--r)) var(--e1) calc(120ms * var(--r))}
.mx-itl-06.blocked .i6-blkin b{opacity:1;transform:none}

/* ── 07 · the honest denominator ────────────────────────────────────────── */
.mx-itl-07 .i7-big{display:flex;align-items:baseline;gap:5px;margin-bottom:9px}
.mx-itl-07 .i7-n{font-family:var(--m-mono);font-variant-numeric:tabular-nums lining-nums;
  font-size:29px;font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--m-ink)}
.mx-itl-07 .i7-u{font-size:11px;color:var(--m-mut);position:relative;height:1.25em;
  overflow:hidden;display:inline-block}
.mx-itl-07 .i7-u span{display:block;height:1.25em;line-height:1.25em;white-space:nowrap;
  transition:transform calc(320ms * var(--r)) var(--e1)}
.mx-itl-07.truth .i7-u span{transform:translateY(-100%)}
.mx-itl-07 .i7-track{position:relative;height:9px;border-radius:5px;background:var(--m-sunk);
  border:1px solid var(--m-line);overflow:hidden;width:65.4%;
  transition:width calc(520ms * var(--r)) var(--e1)}
.mx-itl-07.truth .i7-track{width:100%}
.mx-itl-07 .i7-fill{position:absolute;left:0;top:0;bottom:0;background:var(--m-accent);
  width:100%;transition:width calc(520ms * var(--r)) var(--e1)}
.mx-itl-07.truth .i7-fill{width:25.1%}
.mx-itl-07 .i7-legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px}
.mx-itl-07 .i7-legend span{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;
  color:var(--m-mut);opacity:0;transform:translateY(4px);
  transition:opacity calc(260ms * var(--r)) var(--e1),transform calc(260ms * var(--r)) var(--e1)}
.mx-itl-07.truth .i7-legend span{opacity:1;transform:none}
.mx-itl-07.truth .i7-l2{transition-delay:calc(70ms * var(--r))}
.mx-itl-07 .i7-legend i{width:7px;height:7px;border-radius:2px;background:var(--m-accent)}
.mx-itl-07 .i7-l2 i{background:var(--m-line2)}
.mx-itl-07 .i7-note{margin-top:7px;opacity:0;
  transition:opacity calc(300ms * var(--r)) var(--e1)}
.mx-itl-07.noted .i7-note{opacity:1}

    play: function(root){
      var w = mount(root, 'mx-itl-05'); if (!w) return;
      var wrap = q(w, '.i5-wrap'), ph = q(w, '.i5-ph'), bs = qa(w, '.i5-b');
      var CW = 87, CH = 44, G = 6, COLS = 3, ROWS = 2;
      function slot(i){ return { x: (i % COLS) * (CW + G), y: Math.floor(i / COLS) * (CH + G) }; }
      function tf(p){ return 'translate3d(' + p.x + 'px,' + p.y + 'px,0)'; }

      if (!w.__b){
        var B = w.__b = { order: [0,1,2,3,4,5], st: null };
        B.apply = function(skip){
          B.order.forEach(function(bi, s){
            if (bi === skip) return;
            bs[bi].style.transform = tf(slot(s));
          });
        };
        B.begin = function(bi){
          var s = B.order.indexOf(bi), p = slot(s);
          B.st = { bi: bi, bx: p.x, by: p.y };
          bs[bi].classList.add('lift');
          ph.style.transform = tf(p); ph.classList.add('on');
        };
        B.drag = function(dx, dy){
          if (!B.st) return;
          var x = B.st.bx + dx, y = B.st.by + dy;
          bs[B.st.bi].style.transform = tf({ x: x, y: y });
          var col = Math.max(0, Math.min(COLS - 1, Math.round(x / (CW + G))));
          var row = Math.max(0, Math.min(ROWS - 1, Math.round(y / (CH + G))));
          var target = Math.min(bs.length - 1, row * COLS + col);
          var cur = B.order.indexOf(B.st.bi);
          if (target !== cur){
            B.order.splice(cur, 1);
            B.order.splice(target, 0, B.st.bi);
            B.apply(B.st.bi);
            ph.style.transform = tf(slot(target));
          }
        };
        B.end = function(){
          if (!B.st) return;
          var b = bs[B.st.bi];
          b.classList.remove('lift');
          b.style.transform = tf(slot(B.order.indexOf(B.st.bi)));
          ph.classList.remove('on');
          B.st = null;
          w.classList.add('saved');
        };
        /* the real gesture, so the founder can actually shove a block around */
        bs.forEach(function(b, bi){
          b.addEventListener('pointerdown', function(ev){
            ev.preventDefault();
            stop(root);
            w.classList.remove('saved');
            var sx = ev.clientX, sy = ev.clientY;
            B.begin(bi);
            b.setPointerCapture(ev.pointerId);
            function mv(e){ B.drag(e.clientX - sx, e.clientY - sy); }
            function up(){
              b.removeEventListener('pointermove', mv);
              b.removeEventListener('pointerup', up);
              b.removeEventListener('pointercancel', up);
              B.end();
            }
            b.addEventListener('pointermove', mv);
            b.addEventListener('pointerup', up);
            b.addEventListener('pointercancel', up);
          });
        });
      }
      var B2 = w.__b;
      B2.st = null;
      bs.forEach(function(b){ b.classList.remove('lift'); });
      ph.classList.remove('on');
      B2.order = [0,1,2,3,4,5];
      w.classList.remove('saved');
      B2.apply();
      reflow(w);
      /* scripted drag: Total Revenue travels from slot 0 to slot 4 */
      var dx = (CW + G), dy = (CH + G);
      seq(root, [
        [ 320, function(){ B2.begin(0); }],
        [ 400, function(){
          raf(root, 620, function(p){
            var e = 1 - Math.pow(1 - p, 3);
            B2.drag(dx * e, dy * e);
          }, function(){ B2.end(); });
        }]
      ]);
    }
  });

          cid.addEventListener('click', function(){ pivot(cid.textContent.trim()); });
        });
        q(w, '.i10-pill i').addEventListener('click', function(){
          w.classList.remove('pivot'); paint(null, true);
        });
      }
      w.classList.remove('pivot');
      qa(w, '.i10-cid').forEach(function(c){ c.classList.remove('hit'); });
      paint(null, false);
      reflow(w);
      var first = q(w, '.i10-cid');
      seq(root, [
        [ 620, function(){ first.classList.add('hit'); }],
        [ 780, function(){
          pill.textContent = 'c8f4a1e2';
          w.classList.add('pivot');
          paint('c8f4a1e2', true);
        }],
        [1400, function(){ first.classList.remove('hit'); }]
      ]);
    }
  });

  /* ═══ 11 · a 500 is not a quiet night ══════════════════════════════════ */
  push({
    id: 'itl-11',
    name: 'A 500 is not a quiet night',
    purpose: 'GAP — /logs never branches query.isError, so a failed timeline renders exactly like an empty one: "No events". Here the two states are made to diverge. Quiet keeps its counts at 0 in muted ink; broken flips every count to an em dash (the house rule: an unknown is never drawn as zero), takes a red hairline, names the status, and offers a retry.',
    spec: 'skeleton → state cross-fade 260ms · counts 0→em dash on the 160ms ink token · panel hairline to --m-no 200ms · retry rises 5px/320ms cubic-bezier(.16,1,.3,1)',
    source: 'apps/web/src/pages/LogsTimelinePage.tsx:143-150 (06-pages/logs.md §9)',
    html:
      '<div class="mx-itl mx-itl-11">' +
        '<div class="i11-p">' +
          '<div class="i11-chips">' +
            '<span class="i11-ch">POS <b>0</b></span><span class="i11-ch">Agent <b>0</b></span>' +
            '<span class="i11-ch">Stock <b>0</b></span><span class="i11-ch">Doc <b>0</b></span>' +
            '<span class="i11-ch">Audit <b>0</b></span><span class="i11-ch">Event <b>0</b></span>' +
          '</div>' +
          '<div class="i11-sk"><div class="skb" style="width:70%"></div>' +
            '<div class="skb" style="width:52%"></div></div>' +
          '<div class="i11-body i11-q"><div class="i11-qt">No events between 14:00 and 15:00.</div>' +
            '<div class="icap" style="margin-top:4px">The restaurant was quiet. Nothing failed.</div></div>' +
          '<div class="i11-body i11-e">' +
            '<span class="i11-code">500 &#183; GET /logs/timeline</span>' +
            '<p class="i11-msg">We could not read the timeline. Counts are unknown, not zero.</p>' +
            '<span class="i11-retry">Retry</span></div>' +
        '</div>' +
        '<div class="i11-cap icap">today both of these render <b>&#8220;No events&#8221;</b></div>' +
      '</div>',
    play: function(root){
      var w = mount(root, 'mx-itl-11'); if (!w) return;
      var vals = qa(w, '.i11-ch b');
      function setVals(t){ vals.forEach(function(b){ b.textContent = t; }); }
      w.classList.remove('quiet','err','capped');
      setVals('0');
      reflow(w);
      seq(root, [
        [ 700, function(){ w.classList.add('quiet'); }],
        [2300, function(){ w.classList.remove('quiet'); }],
        [2420, function(){ w.classList.add('err'); setVals('—'); }],
        [3100, function(){ w.classList.add('capped'); }]
      ]);
    }
  });
})();
