<style>
/* ══ sig-c — Signature moments (12–16) ═══════════════════════════════════
   The house's ceremonies: the moments Mudavym finds something, or speaks.
   Sibling files own sig-02..sig-11 and share the .mx-sig stem, so every
   selector here is namespaced .mx-sig-c or .mx-sig-1N — never a bare
   .mx-sig descendant. Every colour is a host variable.                    */

  font-family:var(--m-sans);
  font-size:11px;line-height:1.4;color:var(--m-ink);
  position:relative;width:100%;

}

.mx-sig-c .g-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.mx-sig-c .g-k{font:500 8.5px/1.2 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap;
  transition:color 160ms cubic-bezier(.16,1,.3,1)}
.mx-sig-c .g-k.ac{color:var(--m-accent)}
.mx-sig-c .g-k.ok{color:var(--m-ok)}
.mx-sig-c .g-k.wn{color:var(--m-warn)}

.mx-sig-c .g-n{font-family:var(--m-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* The AI's only permitted motion while it is working (motion.json · shimmer). */
.mx-sig-c .g-shim{
  background:linear-gradient(90deg,var(--m-mut) 12%,var(--m-ink) 46%,var(--m-mut) 80%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sigc-shim 1900ms cubic-bezier(.45,0,.55,1) infinite}

.mx-sig-c .g-say{font-family:var(--m-serif);font-style:italic;font-size:12.5px;line-height:1.25;
  letter-spacing:-.008em;color:var(--m-ink);opacity:0}

   margin between first and second is the only number that decides.      */

.mx-sig-12 .m-chip{position:absolute;right:0;top:0;height:17px;display:flex;align-items:center;
  gap:5px;padding:0 5px;border:1px solid var(--m-line2);border-radius:3px;

  border-radius:1px;opacity:0}

  display:inline-grid;place-items:center;flex:none;opacity:0;
  font:600 8px/1 var(--m-mono);color:var(--m-accent-ink)}

   sphere turns TOWARD; territory law is the front hemisphere.           */

   thing that puts it on.                                                */

.mx-sig-15 .t-foot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;

            '<span class="t-ph">stock</span><span class="t-v t-num">0</span></span> bottles). ' +
          'Reorder at <span class="t-slot" data-w="13"><span class="t-org">settings</span>' +
            '<span class="t-ph">thr</span><span class="t-v">6</span></span>. ' +
          'Deliver by <span class="t-slot" data-w="46"><span class="t-org wn">no source</span>' +
            '<span class="t-ph">delivery_date</span><span class="t-v"></span></span>' +
          '<i class="t-caret"></i>.' +
        '</div>' +
        '<div class="t-foot"><span class="g-k t-st">Filling</span>' +
          '<span class="g-say t-say">Three of four. The last one is yours.</span></div>' +
      '</div>',
    play: function(root){
      var r = runner(root);
      var doc = q(root, '.t-doc'), chip = q(root, '.t-chip'), slots = qa(root, '.t-slot');
      var caret = q(root, '.t-caret'), st = q(root, '.t-st'), say = q(root, '.t-say');
      var num = q(root, '.t-num');

      slots.forEach(function(s){
        s.className = 't-slot';
        s.style.minWidth = s.dataset.w + 'px';
        s.querySelector('.t-v').style.opacity = '0';
        s.querySelector('.t-ph').style.opacity = '.5';
        s.querySelector('.t-org').style.opacity = '0';
      });
      if (num) num.textContent = '0';
      caret.style.opacity = '0';
      say.style.opacity = '0';
      st.textContent = 'Filling'; st.className = 'g-k t-st g-shim';
      doc.style.opacity = '0';
      chip.style.opacity = '0';
      void root.offsetWidth;

      rise(r, chip, 5, 320);
      r.at(150, function(){
        doc.style.opacity = '1';
        /* turn, not settle: a template is a record being opened. */
        r.an(doc, [{ opacity:0, transform:'translateY(7px)' }, { opacity:1, transform:'none' }],
             opt(420, EASE.turn));
      });

      [0, 1, 2].forEach(function(i, k){
        r.at(620 + k * 210, function(){
          var s = slots[i], v = s.querySelector('.t-v'), ph = s.querySelector('.t-ph');
          var org = s.querySelector('.t-org');
          org.style.opacity = '1';
          r.an(org, [{ opacity:0, transform:'translate(-50%,3px)' },
                     { opacity:1, transform:'translate(-50%,0)' }], opt(200, EASE.settle));
          ph.style.opacity = '0';
          v.style.opacity = '1';
          r.an(v, [{ opacity:0, transform:'scale(.84) translateY(-3px)' },
                   { opacity:1, transform:'none' }], opt(320, E('latch')));
          s.classList.add('done');
          if (i === 1 && num) tick(r, num, 0, 4, 620);
          r.at(560, function(){
            org.style.opacity = '0';
            r.an(org, [{ opacity:1 }, { opacity:0 }], opt(200, EASE.settle));
          });
        });
      });

      /* The one the house cannot fill. It says so, once, and then waits. */
      r.at(1420, function(){
        var s = slots[3], org = s.querySelector('.t-org');
        s.classList.add('open');
        org.style.opacity = '1';
        r.an(org, [{ opacity:0, transform:'translate(-50%,3px)' },
                   { opacity:1, transform:'translate(-50%,0)' }], opt(200, EASE.settle));
        r.an(s, [{ transform:'translateY(0)' }, { transform:'translateY(-2px)' },
                 { transform:'translateY(0)' }], opt(420, EASE.settle));
        st.textContent = '3 of 4 filled'; st.className = 'g-k t-st wn';
      });
      r.at(1900, function(){
        caret.style.opacity = '1';
        r.an(caret, [{ opacity:0 }, { opacity:1 }], opt(160, EASE.settle));
        var on = true;
        var last = 0;
        r.rf(function(ts){
          if (ts - last > 520 / rate()){ last = ts; on = !on; caret.style.opacity = on ? '1' : '.15'; }
          return true;
        });
        rise(r, say, 4, 320);
      });
    }
  });

  /* ══ 16 · The house opens ════════════════════════════════════════════ */
  push({
    id:'sig-16',
    name:'The house opens',
    purpose:'Activation completing — once per customer, never again. GetStarted defines activated as menu + threshold, and between the threshold saving and the success screen it returns null: a blank page while progress refetches (get-started.md §9). This turns that dead frame into the held beat of a ceremony — the two facts land, the spine draws, the cover swings, and the restaurant’s book is written into for the first time and sealed. The only moment the product speaks in its own voice, and the only place the wordmark’s full stop is animated.',
    spec:'facts on ' + spec('latch','') + ', 150ms stagger · held beat 380ms (the real progress fetch) · spine 300ms linear · cover rotateY 0→−168° 480ms cubic-bezier(.32,.72,0,1) · seal ' + SPR.stamp.over.toFixed(1) + '%',
    source:'apps/web/src/pages/GetStarted.tsx:252 · :240 · 06-pages/get-started.md §9',
    html:
      '<div class="mx-sig-c mx-sig-16">' +
        '<div class="h-facts">' +
          '<div class="h-f"><b class="h-a">0</b><span>wines in</span></div>' +
          '<div class="h-f"><b class="h-b">0</b><span>bottle threshold</span></div>' +
        '</div>' +
        '<div class="h-beat"><i></i></div>' +
        '<div class="h-book">' +
          '<div class="h-page">' +
            '<div class="g-k">Ledger · opening entry</div>' +
            '<div class="h-rule"></div>' +
            '<div class="h-entry">Bodega Álvaro — list activated <em>· 142 wines · 21:07</em></div>' +
            '<span class="h-seal">◈</span>' +
          '</div>' +
          '<div class="h-cover"><u>Not yet open</u></div>' +
          '<i class="h-spine"></i>' +
        '</div>' +
        '<div class="h-say"><span class="g-say h-line">The book is open.</span>' +
          '<span class="h-mark">Mudavym<i>.</i></span></div>' +
      '</div>',
    play: function(root){
      var r = runner(root);
      var fs = qa(root, '.h-f'), a = q(root, '.h-a'), b = q(root, '.h-b');
      var beat = q(root, '.h-beat i'), spine = q(root, '.h-spine');
      var cover = q(root, '.h-cover'), page = q(root, '.h-page'), entry = q(root, '.h-entry');
      var seal = q(root, '.h-seal'), line = q(root, '.h-line');
      var mark = q(root, '.h-mark'), dot = q(root, '.h-mark i');

      fs.forEach(function(f){ f.style.opacity = '0'; });
      a.textContent = '0'; b.textContent = '0';
      beat.style.transform = 'scaleX(0)';
      spine.style.transform = 'scaleY(0)';
      cover.style.transform = 'none'; cover.style.opacity = '1';
      page.style.opacity = '0';
      entry.style.clipPath = 'inset(0 100% 0 0)';
      seal.style.opacity = '0';
      line.style.opacity = '0';
      mark.style.opacity = '0'; dot.style.opacity = '0';
      void root.offsetWidth;

      /* The two conditions of activation, in the order GetStarted checks them. */
      fs.forEach(function(f, i){
        r.at(140 + i * 150, function(){
          f.style.opacity = '1';
          r.an(f, [{ opacity:0, transform:'translateY(7px) scale(.97)' },
                   { opacity:1, transform:'none' }], opt(420, E('latch')));
        });
      });
      r.at(180, function(){ tick(r, a, 0, 142, 840); });
      r.at(330, function(){ tick(r, b, 0, 6, 700); });

      /* The blank `return null` frame, made deliberate: a held beat rather
         than a white screen. This is the gap the motion answers. */
      r.at(1180, function(){
        beat.style.transform = 'scaleX(1)';
        r.an(beat, [{ transform:'scaleX(0)' }, { transform:'scaleX(1)' }], opt(380, EASE.lin));
      });
      r.at(1560, function(){
        spine.style.transform = 'scaleY(1)';
        r.an(spine, [{ transform:'scaleY(0)' }, { transform:'scaleY(1)' }], opt(300, EASE.lin));
      });
      r.at(1870, function(){
        page.style.opacity = '1';
        r.an(page, [{ opacity:0 }, { opacity:1 }], opt(300, EASE.settle));
        /* turn at full scale: motion.json says turn opens a record. Nothing
           else in the product is ever allowed to use it this wide. */
        cover.style.transform = 'rotateY(-168deg)';
        cover.style.opacity = '0';
        r.an(cover, [{ transform:'rotateY(0deg)', opacity:1 },
                     { transform:'rotateY(-100deg)', opacity:.85, offset:.55 },
                     { transform:'rotateY(-168deg)', opacity:0 }], opt(480, EASE.turn));
      });
      r.at(2280, function(){
        entry.style.clipPath = 'inset(0 0 0 0)';
        r.an(entry, [{ clipPath:'inset(0 100% 0 0)' }, { clipPath:'inset(0 0 0 0)' }],
             opt(460, EASE.turn));
      });
      r.at(2700, function(){
        seal.style.opacity = '1';
        r.an(seal, [{ transform:'scale(.55) rotate(-12deg)', opacity:0 },
                    { transform:'none', opacity:1 }], opt(360, E('stamp')));
      });
      r.at(2980, function(){ rise(r, line, 6, 320); });
      r.at(3240, function(){
        mark.style.opacity = '1';
        r.an(mark, [{ opacity:0 }, { opacity:1 }], opt(320, EASE.settle));
      });
      /* The full stop lands last. It is the brand's punctuation, and this is
         the one time it is allowed to arrive on its own. */
      r.at(3480, function(){
        dot.style.opacity = '1';
        r.an(dot, [{ opacity:0, transform:'translateY(-3px)' }, { opacity:1, transform:'none' }],
             opt(200, E('stamp')));
      });
    }
  });
})();
</script>
