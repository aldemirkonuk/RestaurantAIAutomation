<style>
/* == prc -- Procurement & money ===========================================
   Where money moves: purchase orders, the AI vendor-email layer, the credit
   ledger, landed cost, price drift. Every selector is prefixed .mx-prc.
   Colours come only from the host's variables -- never a hex.              */

.mx-prc{
  font-family:var(--m-sans);
  font-size:11px;line-height:1.4;color:var(--m-ink);
  position:relative;width:100%;
  -webkit-font-smoothing:antialiased;
}
.mx-prc .p-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.mx-prc .p-k{font:500 8.5px/1.2 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-prc .p-k.on{color:var(--m-accent)}
.mx-prc .p-k.w{color:var(--m-warn)}
.mx-prc .num{font-family:var(--m-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mx-prc .p-btn{
  font:500 9px/1 var(--m-mono);letter-spacing:.11em;text-transform:uppercase;
  background:transparent;color:var(--m-ink);border:1px solid var(--m-line2);
  border-radius:3px;padding:6px 8px;cursor:pointer;font-family:var(--m-mono);
}
.mx-prc .p-btn.lit{background:var(--m-accent);border-color:var(--m-accent);color:var(--m-accent-ink)}

/* -- 01 . the deadline, not the undo ----------------------------------- */
.mx-prc-01 .c1-band{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:3px;
  border:1px solid color-mix(in srgb,var(--m-warn) 40%,transparent);
  background:color-mix(in srgb,var(--m-warn) 9%,transparent);margin-bottom:6px}
.mx-prc-01 .c1-band.done{border-color:color-mix(in srgb,var(--m-accent) 45%,transparent);
  background:color-mix(in srgb,var(--m-accent) 9%,transparent)}
.mx-prc-01 .c1-dot{width:6px;height:6px;border-radius:50%;background:var(--m-warn);flex:none}
.mx-prc-01 .c1-band.done .c1-dot{background:var(--m-accent)}
.mx-prc-01 .c1-txt{font-size:10px;flex:1;min-width:0}
.mx-prc-01 .c1-n{font-family:var(--m-mono);font-variant-numeric:tabular-nums;font-weight:500}
.mx-prc-01 .c1-track{height:3px;border-radius:2px;background:var(--m-line);overflow:hidden;margin-bottom:8px}
.mx-prc-01 .c1-fill{display:block;height:100%;background:var(--m-warn);transform-origin:0 50%}
.mx-prc-01 .c1-fill.held{background:var(--m-accent)}
.mx-prc-01 .c1-btn{width:100%;text-align:center;display:block}
.mx-prc-01 .c1-note{margin-top:5px;text-align:center;font-size:9px;color:var(--m-mut)}

/* -- 02 . a draft cannot travel ---------------------------------------- */
.mx-prc-02 .c2-stage{position:relative;height:74px;margin-bottom:7px}
.mx-prc-02 .c2-div{position:absolute;left:52%;top:0;bottom:0;width:1px;background:var(--m-line2)}
.mx-prc-02 .c2-ll{position:absolute;top:0;font:500 8px/1 var(--m-mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--m-mut)}
.mx-prc-02 .c2-ll.a{left:0}
.mx-prc-02 .c2-ll.b{left:calc(52% + 8px)}
.mx-prc-02 .c2-ghost{position:absolute;left:calc(52% + 8px);top:15px;width:44%;height:52px;
  border:1px dashed var(--m-line2);border-radius:3px;opacity:.5}
.mx-prc-02 .c2-card{position:absolute;left:0;top:15px;width:48%;height:52px;padding:5px 6px;
  background:var(--m-surface);border:1px dashed var(--m-line2);border-radius:3px;
  cursor:grab;touch-action:none;user-select:none}
.mx-prc-02 .c2-card.solid{border-style:solid;border-color:var(--m-accent)}
.mx-prc-02 .c2-card:active{cursor:grabbing}
.mx-prc-02 .c2-cn{font-size:9.5px;color:var(--m-mut);display:flex;justify-content:space-between;gap:4px}
.mx-prc-02 .c2-cb{font-size:10px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-prc-02 .c2-ts{font:500 8px/1 var(--m-mono);color:var(--m-accent);margin-top:5px;display:block;height:9px}
.mx-prc-02 .c2-foot{display:flex;gap:6px;align-items:center}
.mx-prc-02 .c2-why{flex:1;font-size:9px;color:var(--m-mut)}

/* -- 03 . grab the wheel ----------------------------------------------- */
.mx-prc-03 .c3-band{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.mx-prc-03 .c3-bot{width:14px;height:14px;border-radius:3px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:8px;
  background:var(--m-accent);color:var(--m-accent-ink)}
.mx-prc-03 .c3-say{flex:1;min-width:0;font-size:10.5px;font-family:var(--m-serif);font-style:italic;
  background-image:linear-gradient(90deg,var(--m-mut) 34%,var(--m-ink) 50%,var(--m-mut) 66%);
  background-size:240% 100%;background-position:120% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.mx-prc-03 .c3-tog{padding:4px 6px;font-size:8px}
.mx-prc-03 .c3-thread{border-top:1px solid var(--m-line);padding-top:5px}
.mx-prc-03 .c3-msg{font-size:9.5px;padding:3px 6px;border-radius:3px;margin-bottom:3px;max-width:82%}
.mx-prc-03 .c3-msg.out{background:var(--m-accent);color:var(--m-accent-ink);margin-left:auto}
.mx-prc-03 .c3-msg.in{background:var(--m-line);color:var(--m-ink)}
.mx-prc-03 .c3-msg.draft{border:1px dashed var(--m-line2);color:var(--m-mut);margin-left:auto;background:none}
.mx-prc-03 .c3-rule{display:flex;align-items:center;gap:5px;height:12px;overflow:hidden}
.mx-prc-03 .c3-rule i{flex:1;height:1px;background:var(--m-warn);transform-origin:0 50%;transform:scaleX(0)}
.mx-prc-03 .c3-rule span{font:500 7.5px/1 var(--m-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--m-warn);opacity:0;white-space:nowrap}
.mx-prc-03.is-held .c3-bot{background:var(--m-line2);color:var(--m-mut)}

/* -- 04 . the offer, and who is vouching for it ------------------------ */
.mx-prc-04 .c4-card{border:1px solid var(--m-line2);border-radius:4px;padding:5px 8px 6px;background:var(--m-surface)}
.mx-prc-04 .c4-t{display:flex;align-items:baseline;gap:5px;font-family:var(--m-serif);font-size:12px;
  font-weight:600;margin-bottom:4px}
.mx-prc-04 .c4-u{font:500 7.5px/1 var(--m-mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--m-no);border:1px solid var(--m-no);border-radius:2px;padding:2px 3px}
.mx-prc-04 .c4-row{display:flex;justify-content:space-between;gap:6px;font-size:10px;
  padding:2px 0;border-bottom:1px solid var(--m-line)}
.mx-prc-04 .c4-conf{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:9px;color:var(--m-mut)}
.mx-prc-04 .c4-bar{flex:1;height:3px;border-radius:2px;background:var(--m-line);overflow:hidden}
.mx-prc-04 .c4-bar b{display:block;height:100%;background:var(--m-warn);transform-origin:0 50%;transform:scaleX(0)}
.mx-prc-04 .c4-warn{display:grid;grid-template-rows:0fr;transition:none}
.mx-prc-04 .c4-warn > div{overflow:hidden;min-height:0}
.mx-prc-04 .c4-wi{font-size:9px;color:var(--m-warn);padding-top:4px}
.mx-prc-04 .c4-trust{font-size:9px;color:var(--m-mut);margin-top:3px}
/* the decision replaces the controls in place -- no row is added to the card */
.mx-prc-04 .c4-slot{display:grid;margin-top:5px}
.mx-prc-04 .c4-slot > *{grid-area:1/1}
.mx-prc-04 .c4-acts{display:flex;gap:5px}
.mx-prc-04 .c4-acts .p-btn{flex:1;padding:5px 4px;font-size:8px}
.mx-prc-04 .c4-ok[data-armed="0"]{opacity:.45;cursor:not-allowed}
.mx-prc-04 .c4-trace{display:flex;align-items:center;opacity:0;pointer-events:none}
.mx-prc-04 .c4-ti{font:500 8px/1.5 var(--m-mono);letter-spacing:.06em;color:var(--m-mut)}

/* -- 05 . credited resists without a memo ------------------------------ */
.mx-prc-05 .c5-rail{display:flex;align-items:center;gap:4px;margin-bottom:7px}
.mx-prc-05 .c5-s{font:500 7.5px/1 var(--m-mono);letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--m-line2);border-radius:2px;padding:3px 4px;color:var(--m-mut)}
.mx-prc-05 .c5-s.on{border-color:var(--m-accent);color:var(--m-accent)}
.mx-prc-05 .c5-s.settled{background:var(--m-accent);border-color:var(--m-accent);color:var(--m-accent-ink)}
.mx-prc-05 .c5-tick{flex:1;height:1px;background:var(--m-line);transform-origin:0 50%;transform:scaleX(0)}
.mx-prc-05 .c5-amt{display:flex;align-items:baseline;gap:6px;font-size:10px;color:var(--m-mut);margin-bottom:4px}
.mx-prc-05 .c5-amt b{color:var(--m-ink);font-size:12px}
.mx-prc-05 .c5-d{color:var(--m-warn);font-size:9.5px;opacity:0}
.mx-prc-05 .c5-memo{display:grid;grid-template-rows:0fr}
.mx-prc-05 .c5-memo > div{overflow:hidden;min-height:0}
.mx-prc-05 .c5-mi{display:flex;justify-content:space-between;gap:6px;font-size:9px;color:var(--m-mut);
  border:1px dashed var(--m-line2);border-radius:3px;padding:3px 5px;margin-bottom:5px}
.mx-prc-05 .c5-mv{color:var(--m-ink)}
.mx-prc-05 .c5-b{width:100%}
.mx-prc-05 .c5-note{margin-top:5px;font-size:9px;color:var(--m-mut);text-align:center}

/* -- 06 . landed cost assembles ---------------------------------------- */
.mx-prc-06 .c6-bar{display:flex;height:16px;border-radius:2px;overflow:hidden;background:var(--m-sunk);
  border:1px solid var(--m-line);margin-bottom:7px}
.mx-prc-06 .c6-bar i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(0)}
/* widths are floored so a $9 split-case fee stays visible against a $1,284 line;
   the figures beneath are exact. */
.mx-prc-06 .c6-bar i.g{background:var(--m-accent);flex:0 0 82%}
.mx-prc-06 .c6-bar i.c[data-k="fr"]{background:color-mix(in srgb,var(--m-accent) 46%,var(--m-line2));flex:0 0 4%}
.mx-prc-06 .c6-bar i.c[data-k="fu"]{background:color-mix(in srgb,var(--m-accent) 34%,var(--m-line2));flex:0 0 2.5%}
.mx-prc-06 .c6-bar i.c[data-k="sp"]{background:color-mix(in srgb,var(--m-accent) 24%,var(--m-line2));flex:0 0 2%}
.mx-prc-06 .c6-bar i.t{background:var(--m-no);flex:0 0 9.5%}
.mx-prc-06 .c6-pair{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.mx-prc-06 .c6-l{display:flex;justify-content:space-between;gap:6px;font-size:9.5px;
  padding:1px 0;border-bottom:1px solid var(--m-line);color:var(--m-mut);opacity:.34}
.mx-prc-06 .c6-l.on{opacity:1}
.mx-prc-06 .c6-l b{font-weight:400;color:var(--m-ink)}
.mx-prc-06 .c6-l.nul b{color:var(--m-mut)}
.mx-prc-06 .c6-l.tax b{color:var(--m-no)}
.mx-prc-06 .c6-l.tax.gone{text-decoration:line-through;text-decoration-color:var(--m-no)}
.mx-prc-06 .c6-note{margin-top:5px;font-size:9px;color:var(--m-mut);opacity:0}

/* -- 07 . two windows agree, one has nothing to say -------------------- */
.mx-prc-07 .c7-set{display:flex;gap:6px;align-items:flex-end}
.mx-prc-07 .c7-w{flex:1;min-width:0;border:1px solid var(--m-line);border-radius:3px;padding:5px 5px 4px}
.mx-prc-07 .c7-lb{font:500 8px/1 var(--m-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--m-mut)}
/* the baseline sits mid-plot so a fall is drawn falling, not as a short rise */
.mx-prc-07 .c7-plot{position:relative;height:42px;margin:5px 0 3px}
.mx-prc-07 .c7-base{position:absolute;left:0;right:0;top:20px;height:1px;background:var(--m-line2);
  transform-origin:0 50%;transform:scaleX(0);display:block}
.mx-prc-07 .c7-bar{position:absolute;left:22%;right:22%;background:var(--m-no);
  transform-origin:50% 100%;transform:scaleY(0);display:block;bottom:22px}
.mx-prc-07 .c7-bar.dn{background:var(--m-ok);top:21px;bottom:auto;transform-origin:50% 0}
.mx-prc-07 .c7-v{font-size:10px;font-weight:600;display:block}
.mx-prc-07 .c7-v.up{color:var(--m-no)}
.mx-prc-07 .c7-v.dn{color:var(--m-ok)}
.mx-prc-07 .c7-nd{font-family:var(--m-serif);font-style:italic;font-size:9.5px;font-weight:400;
  color:var(--m-mut);opacity:0;line-height:1.25}
.mx-prc-07 .c7-foot{margin-top:6px;font-size:9px;color:var(--m-mut)}

/* -- 08 . a suggestion is not a fact ----------------------------------- */
.mx-prc-08 .c8-pair{position:relative;display:flex;gap:0;align-items:center;height:52px}
.mx-prc-08 .c8-col{flex:1;min-width:0;border:1px solid var(--m-line);border-radius:3px;padding:4px 5px}
.mx-prc-08 .c8-r{font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-prc-08 .c8-r.sub{color:var(--m-mut);font-family:var(--m-mono);font-variant-numeric:tabular-nums;
  font-size:9px;letter-spacing:-.03em;margin-top:2px}
.mx-prc-08 .c8-link{width:42px;height:52px;flex:none}
.mx-prc-08 .c8-link path{fill:none;stroke-width:1.3;stroke-linecap:round}
.mx-prc-08 .c8-p1{stroke:var(--m-mut);stroke-dasharray:2.4 3}
.mx-prc-08 .c8-p2{stroke:var(--m-accent);stroke-dasharray:60;stroke-dashoffset:60}
.mx-prc-08 .c8-sway{animation:prc-sway 2600ms cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes prc-sway{from{transform:translateY(-1.2px)}to{transform:translateY(1.2px)}}
.mx-prc-08 .c8-seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);opacity:0;
  width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;line-height:1;background:var(--m-accent);color:var(--m-accent-ink)}
.mx-prc-08 .c8-foot{display:flex;align-items:center;gap:6px;margin-top:7px}
.mx-prc-08 .c8-st{flex:1;font-size:9px;color:var(--m-mut)}
.mx-prc-08 .c8-st.done{color:var(--m-ok)}

/* -- 09 . the drift spur ----------------------------------------------- */
.mx-prc-09 .c9-row{display:flex;align-items:center;gap:7px;height:24px;padding:0 7px;
  border:1px solid var(--m-line);border-radius:3px;background:var(--m-surface)}
.mx-prc-09 .c9-nm{flex:1;min-width:0;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-prc-09 .c9-pr{font-size:11px;padding:2px 4px;border-radius:2px;cursor:pointer}
.mx-prc-09 .c9-pr.hot{background:color-mix(in srgb,var(--m-accent) 16%,transparent);color:var(--m-accent)}
.mx-prc-09 .c9-spur{display:grid;grid-template-rows:0fr}
.mx-prc-09 .c9-spur > div{overflow:hidden;min-height:0}
.mx-prc-09 .c9-in{border:1px solid var(--m-line);border-top:none;border-radius:0 0 3px 3px;padding:5px 7px}
.mx-prc-09 .c9-spark{width:100%;height:22px;display:block;clip-path:inset(0 100% 0 0)}
.mx-prc-09 .c9-spark path{fill:none;stroke:var(--m-accent);stroke-width:1.4;stroke-linejoin:round}
.mx-prc-09 .c9-cmp{display:flex;justify-content:space-between;gap:4px;font-size:9px;
  color:var(--m-mut);margin-top:3px}
.mx-prc-09 .c9-cmp b{font-weight:400;color:var(--m-ink);font-family:var(--m-mono);
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mx-prc-09 .c9-door{margin-top:6px;text-align:center;font:500 8px/1 var(--m-mono);letter-spacing:.11em;
  text-transform:uppercase;background:var(--m-accent);color:var(--m-accent-ink);
  border-radius:2px;padding:4px;opacity:0;cursor:pointer}
.mx-prc-09 .c9-gap{margin-top:4px;font-size:9px;color:var(--m-mut)}

/* -- 10 . opened, never sent ------------------------------------------- */
.mx-prc-10 .c10-list{border-top:1px solid var(--m-line);position:relative}
.mx-prc-10 .c10-r{position:relative;display:flex;align-items:center;gap:6px;height:27px;padding:0 7px 0 9px;
  border-bottom:1px solid var(--m-line);background:var(--m-surface)}
.mx-prc-10 .c10-age{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--m-line2);
  transform-origin:50% 100%;transform:scaleY(0)}
.mx-prc-10 .c10-r.old .c10-age{background:var(--m-warn)}
.mx-prc-10 .c10-r.sent .c10-age{background:var(--m-ok)}
.mx-prc-10 .c10-nm{flex:1;min-width:0;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-prc-10 .c10-d{font:500 8px/1 var(--m-mono);letter-spacing:.06em;color:var(--m-mut);white-space:nowrap}
.mx-prc-10 .c10-r.old .c10-d{color:var(--m-warn)}
.mx-prc-10 .c10-r.sent .c10-d{color:var(--m-ok)}
.mx-prc-10 .c10-am{font-size:10px}
.mx-prc-10 .c10-foot{margin-top:6px;font-size:9px;color:var(--m-mut)}

/* -- 11 . dormant, not empty ------------------------------------------- */
.mx-prc-11 .c11-pane{height:76px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;border:1px dashed var(--m-line2);border-radius:4px;padding:8px}
.mx-prc-11 .c11-pane.live{border-style:solid}
.mx-prc-11 .c11-intake{display:flex;gap:4px}
.mx-prc-11 .c11-intake i{width:16px;height:8px;border:1px solid var(--m-line2);border-radius:1px;display:block}
.mx-prc-11 .c11-breathe{animation:prc-breathe 2400ms cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes prc-breathe{
  from{opacity:.34;transform:scale(.994)}
  to  {opacity:.62;transform:scale(1.006)}
}
.mx-prc-11 .c11-say{font-size:9.5px;color:var(--m-mut);text-align:center;line-height:1.35;max-width:26ch}
.mx-prc-11 .c11-say b{font-weight:400;color:var(--m-ink)}
.mx-prc-11 .c11-foot{margin-top:6px;font-size:9px;color:var(--m-mut);text-align:center}

/* -- reduced motion: land on the end state ----------------------------- */
@media (prefers-reduced-motion:reduce){
  .mx-prc *,.mx-prc *::before,.mx-prc *::after{
    animation-duration:1ms!important;animation-delay:0ms!important;
    animation-iteration-count:1!important;
    transition-duration:1ms!important;transition-delay:0ms!important;
  }
  .mx-prc-08 .c8-sway{animation:none!important;transform:none!important}
  .mx-prc-11 .c11-breathe{animation:none!important;opacity:.5!important}
}
</style>
<script>
(function(){
  var M = window.MUDAVYM_MOTIONS = window.MUDAVYM_MOTIONS || [];
  var FAM = 'Procurement & money';
  var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* \u2500\u2500 real spring: integrate, then sample into a CSS linear() easing \u2500\u2500
     a = (-k(x-1) - c\u00b7v)/m, 1ms Euler-Cromer steps, stop at restDelta.   */
  var LINEAR_OK = (function(){ try{ return CSS.supports('animation-timing-function','linear(0, 0.5, 1)'); }catch(e){ return false; } })();
  function spring(k, c, m, restDelta){
    m = m || 1; restDelta = restDelta || 0.005;
    var dt = 1/1000, x = 0, v = 0, t = 0, tr = [0], peak = 0, cap = 4;
    while (t < cap){
      v += ((-k*(x-1) - c*v)/m)*dt; x += v*dt; t += dt;
      tr.push(x); if (x > peak) peak = x;
      if (Math.abs(1-x) < restDelta && Math.abs(v) < restDelta*8) break;
    }
    var n = 46, pts = [], i, idx;
    for (i=0;i<=n;i++){ idx = Math.round(i/n*(tr.length-1)); pts.push(+tr[idx].toFixed(4)); }
    pts[0] = 0; pts[n] = 1;
    return {
      k:k, c:c, trace:tr,
      duration: Math.round(t*1000),
      overshoot: +(Math.max(0,peak-1)*100).toFixed(1),
      easing: LINEAR_OK ? 'linear('+pts.join(',')+')' : 'cubic-bezier(.16,1,.3,1)'
    };
  }
  var SP = {
    tuck : spring(380,32),        // house "tuck" \u2014 weight under a finger, not bounce
    seat : spring(300,34),        // near-critical: a control that resists and returns

          if (r.dataset.st === 'open' && d >= 14 && !r.classList.contains('old')){
            r.classList.add('old');
            c.an(r.querySelector('.c10-d'), [{opacity:.4},{opacity:1}], {duration:160, easing:EZ.ink});
          }
        });
        if (!promoted && (+late.dataset.d0 + (+late.dataset.d1 - +late.dataset.d0)*p) >= 14){
          promoted = true;
          // FLIP: the row that has waited longest lifts itself to the top of the ledger
          var first = rows.map(function(r){ return r.getBoundingClientRect().top; });
          list.insertBefore(late, list.firstElementChild);
          rows.forEach(function(r,i){
            var d = first[i] - r.getBoundingClientRect().top;
            if (!d) return;
            c.an(r, [{transform:'translateY('+d+'px)'},{transform:'translateY(0)'}],
                 {duration:SP.tuck.duration, easing:SP.tuck.easing});
          });
          kick.textContent = '14d \u00b7 never sent'; kick.classList.add('w');
          foot.textContent = '$312.00 has been claimed for two weeks and never asked for.';
        }
      });
    }
  });

  /* \u2550\u2550 prc-11 \u00b7 dormant, not empty (GAP) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
  M.push({
    id:'prc-11', name:'Dormant, not empty', family:FAM,
    purpose:'GAP: the Offers tab is empty because provider_promotions is still dormant behind a shadow-mode pipeline, and an empty state reads to an owner as "no vendor ever offered you anything". Proposed motion: a dormant intake breathes and says so; a true zero is completely still. The card shows both so the difference is the demo.',
    spec:'dormant: opacity .34\u2192.62 + scale .994\u21921.006, 2400ms cubic-bezier(.45,0,.55,1) alternate infinite \u00b7 true zero: no animation declared at all \u00b7 label crossfade 240ms',
    source:'06-pages/promotions.md \u00a79 \u2014 provider_promotions dormant',
    html:'<div class="mx-prc mx-prc-11">'+
      '<div class="p-h"><span class="p-k">Offers</span><span class="p-k on c11-mode">dormant</span></div>'+
      '<div class="c11-pane"><div class="c11-intake"><i></i><i></i><i></i></div>'+
        '<div class="c11-say"><b>Vendor-mail extraction is in shadow mode.</b><br>Nothing has been published yet.</div></div>'+
      '<div class="c11-foot">A dormant intake breathes. A true zero is still.</div></div>',
    play:function(root){
      var c = ctl(root),
          pane = root.querySelector('.c11-pane'), intake = root.querySelector('.c11-intake'),
          say = root.querySelector('.c11-say'), mode = root.querySelector('.c11-mode');

      function dormant(){
        pane.classList.remove('live');
        intake.classList.add('c11-breathe'); intake.style.opacity = '';
        mode.textContent = 'dormant'; mode.classList.add('on');
        say.innerHTML = '<b>Vendor-mail extraction is in shadow mode.</b><br>Nothing has been published yet.';
      }
      function zero(){
        pane.classList.add('live');
        intake.classList.remove('c11-breathe');
        intake.style.opacity = '1';        // still, and fully present \u2014 nothing is waking up
        mode.textContent = 'live'; mode.classList.remove('on');
        say.innerHTML = '<b>No offers this week.</b><br>The intake is awake and found nothing.';
      }
      dormant();
      c.at(2600, function(){ c.an(say,[{opacity:0},{opacity:1}],{duration:240}); zero(); });
      c.at(5200, function(){ c.an(say,[{opacity:0},{opacity:1}],{duration:240}); dormant(); });
    }
  });
})();
</script>
