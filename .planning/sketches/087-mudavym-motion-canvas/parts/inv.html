<style>
/* ══ inv &#183; Inventory &amp; receiving ═══════════════════════════════════════
   Stock and the loading dock. Every selector is prefixed .mx-inv; every
   colour comes from a host variable. Springs are integrated at runtime in
   the script below and sampled into CSS linear() easings, so the numbers
   printed on each card are measured, not asserted.                        */

.mx-inv{
  font-family:var(--m-sans);
  font-size:11px;line-height:1.4;color:var(--m-ink);
  width:100%;position:relative;
  -webkit-font-smoothing:antialiased;
  --e-settle:cubic-bezier(.16,1,.3,1);   /* house */
  --e-turn:cubic-bezier(.32,.72,0,1);    /* house */
  --e-ink:cubic-bezier(.16,1,.3,1);      /* house, 160ms, <=2px */
  --e-out:cubic-bezier(.4,0,.9,1);
}
.mx-inv .iv-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.mx-inv .iv-k{font:500 8px/1.25 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap}
.mx-inv .iv-k.on{color:var(--m-accent)}
.mx-inv .iv-k.ok{color:var(--m-ok)}
.mx-inv .iv-k.wn{color:var(--m-warn)}
.mx-inv .n{font-family:var(--m-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mx-inv .iv-note{font-family:var(--m-serif);font-style:italic;font-size:10.5px;color:var(--m-mut);line-height:1.35}
.mx-inv .iv-sunk{background:var(--m-surface);border:1px solid var(--m-line);border-radius:3px}

/* ── 01 &#183; count lands before the network does ──────────────────────── */
.mx-inv .iv1-card{border:1px solid var(--m-line);border-radius:3px;background:var(--m-surface);
  padding:6px 8px 7px}
.mx-inv .iv1-nm{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-inv .iv1-fig{display:flex;align-items:baseline;gap:6px;margin:3px 0 6px}
.mx-inv .iv1-q{font-family:var(--m-mono);font-size:23px;font-weight:500;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1}
.mx-inv .iv1-u{font:500 8px/1 var(--m-mono);letter-spacing:.11em;text-transform:uppercase;color:var(--m-mut)}
.mx-inv .iv1-btn{display:block;width:100%;height:26px;border:0;border-radius:2px;cursor:pointer;
  background:var(--m-accent);color:var(--m-accent-ink);font:600 10.5px/26px var(--m-sans);
  transform-origin:50% 50%}
.mx-inv .iv1-out{position:relative;margin-top:6px;padding:4px 8px 4px 9px;min-height:24px;
  display:flex;align-items:center;gap:7px;background:var(--m-sunk);border-radius:2px;
  opacity:0;transform:translateY(6px)}
.mx-inv .iv1-rule{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--m-accent);
  transform:scaleY(0);transform-origin:50% 100%}
.mx-inv .iv1-txt{flex:1;font-size:10px}
.mx-inv .iv1-bd{font:500 8px/1 var(--m-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--m-warn);border:1px solid var(--m-line2);border-radius:9px;padding:3px 6px;opacity:0}
.mx-inv .iv1-foot{margin-top:4px}

/* ── 02 &#183; the outbox drains, the table catches up ─────────────────── */
.mx-inv .iv2-slot{display:grid;grid-template-rows:1fr}
.mx-inv .iv2-in{overflow:hidden;min-height:0}
.mx-inv .iv2-i{display:flex;align-items:center;gap:6px;height:17px;padding:0 6px;
  border-bottom:1px solid var(--m-line);background:var(--m-surface);font-size:9.5px}
.mx-inv .iv2-i .d{width:4px;height:4px;border-radius:50%;background:var(--m-mut);flex:none}
.mx-inv .iv2-i .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-inv .iv2-i .st{font:500 7.5px/1 var(--m-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--m-mut)}
.mx-inv .iv2-tbl{margin-top:5px;position:relative;overflow:hidden}
.mx-inv .iv2-hd{display:flex;justify-content:space-between;padding:0 6px 3px;border-bottom:1px solid var(--m-line)}
.mx-inv .iv2-r{display:flex;justify-content:space-between;align-items:center;gap:6px;height:16px;
  padding:0 6px;border-bottom:1px solid var(--m-line);font-size:9.5px}
.mx-inv .iv2-r .v{font-family:var(--m-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mx-inv .iv2-sweep{position:absolute;left:0;right:0;height:1px;background:var(--m-accent);opacity:0;top:0}

/* ── 03 &#183; one key, two sends ───────────────────────────────────────── */
.mx-inv .iv3-key{font:500 9px/1.5 var(--m-mono);letter-spacing:-.02em;color:var(--m-accent);
  background:var(--m-sunk);border-radius:2px;padding:2px 6px;display:inline-block;margin-bottom:7px}
.mx-inv .iv3-wire{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.mx-inv .iv3-e{font:500 7.5px/1 var(--m-mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap}
.mx-inv .iv3-line{position:relative;flex:1;height:9px}
.mx-inv .iv3-line:before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--m-line2)}
.mx-inv .iv3-pkt{position:absolute;top:1px;left:0;width:7px;height:7px;background:var(--m-accent);
  border-radius:1px;opacity:0}
.mx-inv .iv3-cut{position:absolute;top:0;left:54%;width:1px;height:9px;background:var(--m-no);
  opacity:0;transform:scaleY(0)}
.mx-inv .iv3-log{margin-bottom:6px}
.mx-inv .iv3-l{display:flex;gap:6px;align-items:baseline;font-size:9.5px;opacity:0;
  padding:1.5px 0;border-bottom:1px solid var(--m-line)}
.mx-inv .iv3-l i{font-style:normal;font:500 7.5px/1.5 var(--m-mono);letter-spacing:.08em;color:var(--m-mut);width:38px;flex:none}
.mx-inv .iv3-l.no i{color:var(--m-no)}
.mx-inv .iv3-l.ok i{color:var(--m-ok)}
.mx-inv .iv3-seal{display:inline-block;font:500 7.5px/1 var(--m-mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--m-ok);border:1px solid var(--m-ok);border-radius:2px;
  padding:2px 4px;opacity:0;transform:scale(.6) rotate(-5deg);transform-origin:0 50%}
.mx-inv .iv3-stock{display:flex;align-items:baseline;gap:6px}
.mx-inv .iv3-stock b{font-family:var(--m-mono);font-size:16px;font-weight:500;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}

/* ── 04 &#183; three taps at the door ───────────────────────────────────── */
.mx-inv.iv4{max-width:190px;margin:0 auto}
.mx-inv .iv4-bar{display:flex;justify-content:space-between;align-items:center;
  padding-bottom:5px;border-bottom:1px solid var(--m-line);margin-bottom:8px}
.mx-inv .iv4-stage{position:relative;height:96px}
.mx-inv .iv4-p{position:absolute;inset:0;opacity:0;pointer-events:none}
.mx-inv .iv4-p.on{opacity:1;pointer-events:auto}
.mx-inv .iv4-t{font-family:var(--m-serif);font-size:13px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.mx-inv .iv4-hint{font-size:9.5px;color:var(--m-mut);margin-bottom:7px}
.mx-inv .iv4-cam{width:100%;height:52px;border:0;border-radius:4px;background:var(--m-accent);
  color:var(--m-accent-ink);font:600 11px/52px var(--m-sans);cursor:pointer}
.mx-inv .iv4-step{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.mx-inv .iv4-tap{flex:1;height:34px;border:1px solid var(--m-line2);border-radius:4px;background:var(--m-surface);
  color:var(--m-ink);font:500 15px/1 var(--m-sans);cursor:pointer}
.mx-inv .iv4-v{width:46px;text-align:center;font-family:var(--m-mono);font-size:24px;font-weight:500;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;display:inline-block}
.mx-inv .iv4-done{width:100%;height:30px;border:0;border-radius:4px;background:var(--m-ok);
  color:var(--m-accent-ink);font:600 11px/30px var(--m-sans);cursor:pointer}
.mx-inv .iv4-ok{width:34px;height:34px;border-radius:50%;background:var(--m-ok);margin:2px auto 8px;
  position:relative;transform:scale(.4);opacity:0}
.mx-inv .iv4-ok:before{content:"";position:absolute;left:11px;top:8px;width:9px;height:15px;
  border:2px solid var(--m-accent-ink);border-top:0;border-left:0;transform:rotate(42deg)}
.mx-inv .iv4-msg{text-align:center;font-size:10px;color:var(--m-mut);line-height:1.4}

/* ── 05 &#183; offline to reconciled ────────────────────────────────────── */
.mx-inv .iv5-pill{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:5px;
  background:var(--m-surface);border:1px solid var(--m-line)}
.mx-inv .iv5-dot{width:15px;height:15px;border-radius:50%;background:var(--m-mut);flex:none;position:relative}
.mx-inv .iv5-dot:before{content:"";position:absolute;left:4px;top:3px;width:5px;height:8px;
  border:1.5px solid var(--m-accent-ink);border-top:0;border-left:0;transform:rotate(42deg) scale(0);
  transform-origin:50% 50%;opacity:0}
.mx-inv .iv5-dot.done{background:var(--m-ok)}
.mx-inv .iv5-dot.done:before{opacity:1}
.mx-inv .iv5-tx{flex:1;min-width:0}
.mx-inv .iv5-ttl{font-size:11.5px;font-weight:600;display:block;line-height:1.25}
.mx-inv .iv5-sub{display:block;font-size:9.5px;color:var(--m-mut);position:relative;overflow:hidden}
.mx-inv .iv5-sub.busy{background:linear-gradient(90deg,var(--m-mut) 12%,var(--m-ink) 44%,var(--m-mut) 76%);
  background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:inv-shim 1900ms cubic-bezier(.45,0,.55,1) infinite}
@keyframes inv-shim{from{background-position:120% 0}to{background-position:-120% 0}}
.mx-inv .iv5-cnt{font-family:var(--m-mono);font-size:13px;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;color:var(--m-warn)}
.mx-inv .iv5-tl{display:flex;gap:0;margin-top:9px;position:relative}
.mx-inv .iv5-s{flex:1;text-align:center;font:500 7.5px/1 var(--m-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--m-mut);padding-bottom:5px}
.mx-inv .iv5-s.on{color:var(--m-accent)}
.mx-inv .iv5-track{height:1px;background:var(--m-line2);position:relative}
.mx-inv .iv5-mk{position:absolute;top:0;left:0;height:1px;width:25%;background:var(--m-accent)}

/* ── 06 &#183; shadow folds into live ───────────────────────────────────── */
.mx-inv .iv6-chip{font:500 7.5px/1 var(--m-mono);letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--m-line2);border-radius:9px;padding:3px 6px;color:var(--m-warn)}
.mx-inv .iv6-fig{display:flex;align-items:baseline;gap:6px;margin:2px 0 6px}
.mx-inv .iv6-tot{font-family:var(--m-mono);font-size:23px;font-weight:500;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;line-height:1}
.mx-inv .iv6-par{font:500 8px/1 var(--m-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--m-mut)}
.mx-inv .iv6-bar{position:relative;display:flex;height:7px;background:var(--m-sunk);border-radius:2px;overflow:hidden}
.mx-inv .iv6-live{height:100%;background:var(--m-accent);width:60%}
.mx-inv .iv6-sh{height:100%;width:20%;background:repeating-linear-gradient(-45deg,
  var(--m-mut) 0 2px,transparent 2px 5px)}
.mx-inv .iv6-tick{position:absolute;top:-2px;bottom:-2px;left:66.7%;width:1px;background:var(--m-ink);opacity:.7}
.mx-inv .iv6-lg{display:flex;gap:12px;margin-top:6px;font:500 9px/1 var(--m-mono);letter-spacing:.02em}
.mx-inv .iv6-lg .a{color:var(--m-accent)}
.mx-inv .iv6-lg .b{color:var(--m-mut)}
.mx-inv .iv6-lg b{font-variant-numeric:tabular-nums;font-weight:500}
.mx-inv .iv6-st{margin-top:8px;height:13px;position:relative;overflow:hidden}
.mx-inv .iv6-st span{position:absolute;left:0;top:0;font:500 8px/1.4 var(--m-mono);
  letter-spacing:.11em;text-transform:uppercase}
.mx-inv .iv6-st .w{color:var(--m-warn)}
.mx-inv .iv6-st .g{color:var(--m-ok)}

/* ── 07 &#183; their slip against their invoice ─────────────────────────── */
.mx-inv .iv7-cols{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:5px}
.mx-inv .iv7-c{border:1px solid var(--m-line);border-radius:2px;padding:4px 5px 5px;background:var(--m-surface);
  opacity:0;transform:translateY(5px)}
.mx-inv .iv7-c .k{display:block;font:500 7px/1.3 var(--m-mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--m-mut)}
.mx-inv .iv7-c .v{display:block;font-family:var(--m-mono);font-size:15px;font-weight:500;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:1px}
.mx-inv .iv7-c.hot{border-color:var(--m-no)}
.mx-inv .iv7-c.hot .v{color:var(--m-no)}
.mx-inv .iv7-link{position:relative;height:9px;margin-bottom:5px}
.mx-inv .iv7-link i{position:absolute;top:4px;left:26%;width:52%;height:1px;background:var(--m-no);
  transform:scaleX(0);transform-origin:0 50%}
.mx-inv .iv7-link u{position:absolute;top:0;left:26%;width:1px;height:9px;background:var(--m-no);opacity:0}
.mx-inv .iv7-link u.r{left:calc(78% - 1px)}
.mx-inv .iv7-v{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.mx-inv .iv7-vc{font:500 8px/1 var(--m-mono);letter-spacing:.09em;text-transform:uppercase;
  background:var(--m-no);color:var(--m-accent-ink);border-radius:2px;padding:4px 6px;
  opacity:0;transform:scale(.55) rotate(-4deg);transform-origin:0 50%}
.mx-inv .iv7-amt{margin-left:auto;font-family:var(--m-mono);font-size:14px;font-weight:500;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--m-no);opacity:0}
.mx-inv .iv7-book{display:grid;grid-template-rows:0fr;overflow:hidden}
.mx-inv .iv7-book > span{min-height:0;overflow:hidden;display:block;font-size:9.5px;color:var(--m-ok);
  padding-top:3px;border-top:1px solid var(--m-line)}

/* ── 08 &#183; a menu becomes candidates ────────────────────────────────── */
.mx-inv .iv8-wrap{display:flex;gap:9px;align-items:flex-start}
.mx-inv .iv8-doc{position:relative;width:56px;height:76px;flex:none;overflow:hidden;
  background:var(--m-surface);border:1px solid var(--m-line);padding:6px 5px}
.mx-inv .iv8-doc i{display:block;height:2px;background:var(--m-line2);margin-bottom:5px}
.mx-inv .iv8-doc i:nth-child(2){width:72%}
.mx-inv .iv8-doc i:nth-child(4){width:64%}
.mx-inv .iv8-doc i:nth-child(6){width:80%}
.mx-inv .iv8-sw{position:absolute;left:0;right:0;top:0;height:2px;background:var(--m-accent);opacity:0}
.mx-inv .iv8-list{flex:1;min-width:0}
.mx-inv .iv8-r{display:flex;align-items:center;gap:5px;height:18px;border-bottom:1px solid var(--m-line);
  font-size:9.5px;opacity:0;transform:translateY(5px)}
.mx-inv .iv8-r .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-inv .iv8-r .cf{font:500 7.5px/1 var(--m-mono);letter-spacing:.06em;color:var(--m-mut)}
.mx-inv .iv8-r.shaky .cf{color:var(--m-warn)}
.mx-inv .iv8-r .q{width:26px;text-align:right;font-family:var(--m-mono);font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;color:var(--m-accent)}
.mx-inv .iv8-r.shaky .q{color:var(--m-warn)}
.mx-inv .iv8-sum{margin-top:6px;font:500 8px/1.3 var(--m-mono);letter-spacing:.09em;
  text-transform:uppercase;color:var(--m-mut);opacity:0}

/* ── 09 &#183; nothing vanishes; the drop becomes a pin ──────────────────── */
.mx-inv .iv9-i{display:flex;align-items:center;gap:6px;height:20px;padding:0 7px;font-size:9.5px;
  background:var(--m-surface);border:1px solid var(--m-line);border-radius:2px;position:relative}
.mx-inv .iv9-i .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-inv .iv9-rt{font:500 8px/1 var(--m-mono);letter-spacing:.06em;color:var(--m-mut)}
.mx-inv .iv9-rt.no{color:var(--m-no)}
.mx-inv .iv9-today{margin:6px 0;padding:4px 7px;border-left:2px solid var(--m-line2);opacity:.42}
.mx-inv .iv9-today .lb{font:500 7.5px/1.4 var(--m-mono);letter-spacing:.11em;text-transform:uppercase;
  color:var(--m-mut);display:block}
.mx-inv .iv9-today .bd{font-size:9.5px;color:var(--m-mut)}
.mx-inv .iv9-today .bd b{font-family:var(--m-mono);font-variant-numeric:tabular-nums;font-weight:500}
.mx-inv .iv9-rail{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px;
  padding-top:6px;border-top:1px solid var(--m-line)}
.mx-inv .iv9-pin{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:600;
  border-radius:11px;padding:3px 9px;background:var(--m-accent);color:var(--m-accent-ink);
  opacity:0;transform:scale(.6) translateY(-8px);transform-origin:0 50%}
/* The refused modal lives IN FLOW, not absolutely: a 2px dashed sliver that
   grows where a dialog would have opened and retracts again. Absolute
   positioning put its own label on top of the queue row it was refusing to
   cover, which is a joke the demo cannot afford to make. */
.mx-inv .iv9-refuse{display:flex;align-items:center;gap:7px;height:13px;margin:5px 0 2px;opacity:0}
.mx-inv .iv9-ghost{flex:1;height:0;border:1px dashed var(--m-line2);border-radius:3px;background:var(--m-sunk)}
.mx-inv .iv9-rlb{font:500 7.5px/1 var(--m-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--m-mut);white-space:nowrap}

/* ── 10 &#183; auto-locate fills a map nobody opens ──────────────────────── */
.mx-inv .iv10-z{display:grid;grid-template-columns:1fr 34px;gap:5px;align-items:center;margin-bottom:4px}
.mx-inv .iv10-z .nm{font-size:9.5px;display:flex;align-items:baseline;gap:5px}
.mx-inv .iv10-z .tp{font:500 7.5px/1 var(--m-mono);letter-spacing:.06em;color:var(--m-mut)}
.mx-inv .iv10-z .ct{font-family:var(--m-mono);font-size:9px;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;text-align:right;color:var(--m-mut)}
.mx-inv .iv10-bar{grid-column:1 / -1;height:3px;background:var(--m-sunk);border-radius:2px;overflow:hidden;margin-top:-2px}
.mx-inv .iv10-bar i{display:block;height:100%;background:var(--m-accent);width:0}
.mx-inv .iv10-tray{display:flex;gap:4px;margin:7px 0 5px;min-height:17px}
.mx-inv .iv10-w{font-size:8.5px;border:1px solid var(--m-line2);border-radius:9px;padding:2px 6px;
  white-space:nowrap;background:var(--m-surface)}
.mx-inv .iv10-why{height:24px;position:relative;overflow:hidden}
.mx-inv .iv10-why span{position:absolute;left:0;right:0;top:0;font-size:9px;color:var(--m-mut);opacity:0;line-height:1.3}
.mx-inv .iv10-why b{font-family:var(--m-mono);font-variant-numeric:tabular-nums;font-weight:500;color:var(--m-ink)}
.mx-inv .iv10-foot{font:500 7.5px/1.35 var(--m-mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--m-warn);opacity:0}

/* ── 11 &#183; the column that says why it is empty ──────────────────────── */
.mx-inv .iv11-t{display:grid;grid-template-columns:1fr 44px 62px;gap:4px}
.mx-inv .iv11-t .h{font:500 7.5px/1.5 var(--m-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--m-mut);border-bottom:1px solid var(--m-line);padding-bottom:3px}
.mx-inv .iv11-t .h.r{text-align:right}
.mx-inv .iv11-t .c{font-size:9.5px;padding:3.5px 0;border-bottom:1px solid var(--m-line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-inv .iv11-t .c.r{text-align:right;font-family:var(--m-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mx-inv .iv11-mk{position:relative;display:inline-block;width:100%;height:13px;overflow:hidden;vertical-align:middle}
.mx-inv .iv11-mk span{position:absolute;right:0;top:0;line-height:13px}
.mx-inv .iv11-mk .dash{color:var(--m-mut)}
.mx-inv .iv11-mk .why{font:500 7.5px/13px var(--m-mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--m-warn);opacity:0}
.mx-inv .iv11-hn{color:var(--m-warn);opacity:0;font:500 7px/1 var(--m-mono)}

</style>
<script>
(function(){
  /* ═══ inv — Inventory & receiving ══════════════════════════════════════
     Grounded in apps/web/src: the two offline outboxes, the door receipt,
     the live/shadow gauge, the four-way match, the menu scanner, the
     auto-locate engine — plus three motions that answer gaps the page
     notes record (a silent queue drop, a stranded engine, a column with
     no data).                                                             */

  window.MUDAVYM_MOTIONS = window.MUDAVYM_MOTIONS || [];
  var FAM = 'Inventory & receiving';
  var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ── real springs: integrate, then sample into a CSS linear() ─────────
     Euler-Cromer at 1kHz on  a = (-k(x-1) - c*v)/m , stop when the curve
     is inside +/-0.5% of target. The house constants, measured here so
     every number printed on a card is one this file actually computed. */
  var LINEAR_OK = (function(){
    try { return CSS.supports('animation-timing-function','linear(0, 0.5, 1)'); } catch(e){ return false; }
  })();
  function spring(k, c, m){
    m = m || 1;
    var dt = 1/1000, x = 0, v = 0, t = 0, tr = [0], peak = 0, settled = 0;
    while (t < 3){
      v += ((-k*(x-1) - c*v)/m)*dt; x += v*dt; t += dt;
      tr.push(x); if (x > peak) peak = x;
      if (Math.abs(1-x) > 0.005) settled = t;
      /* 120ms of confirmation, not 20ms: an underdamped curve passes THROUGH
         the tolerance band on its way to the overshoot, and a short window
         stops the integration mid-crossing — which silently turns a spring
         into an ease-out and under-reports its overshoot. */
      if (t - settled > 0.12) break;
    }
    /* sample only the part the CSS duration actually covers — the confirmation
       tail is proof the curve is at rest, not frames anyone will see */
    var last = Math.min(tr.length-1, Math.max(2, Math.round(settled*1000)));
    var n = 40, pts = [], i;
    for (i=0;i<=n;i++) pts.push(+tr[Math.round(i/n*last)].toFixed(4));
    pts[0] = 0; pts[n] = 1;
    return {
      k:k, c:c, pts:pts,
      duration: Math.round(settled*1000),
      overshoot: +(Math.max(0,peak-1)*100).toFixed(1),
      easing: LINEAR_OK ? 'linear('+pts.join(',')+')' : 'cubic-bezier(.16,1,.3,1)'
    };
  }
  var SP = {
    tuck : spring(380,32),   // house: objects that move under a finger
    stamp: spring(520,26),   // house: the seal landing. the one permitted ceremony
    tally: spring(120,26)    // house: figures arrive, they never bounce past
  };
  function sp(s,label){ return label+' spring '+s.k+'/'+s.c+' → '+s.duration+'ms, '+s.overshoot+'% overshoot'; }
  var EZ = { settle:'cubic-bezier(.16,1,.3,1)', turn:'cubic-bezier(.32,.72,0,1)', out:'cubic-bezier(.4,0,.9,1)' };

  /* ── plumbing ─────────────────────────────────────────────────────── */
  function q(r,s){ return r.querySelector(s); }
  function qa(r,s){ return Array.prototype.slice.call(r.querySelectorAll(s)); }
  function rate(){
    var v = 1;
    try { if (typeof window.MUDAVYM_RATE === 'function') v = window.MUDAVYM_RATE(); } catch(e){}
    return (!v || v < 0.05) ? 1 : v;
  }
  function ms(n){ return Math.round(n/rate())+'ms'; }
  function stop(root){
    (root.__t||[]).forEach(clearTimeout); root.__t = [];
    (root.__f||[]).forEach(cancelAnimationFrame); root.__f = [];
  }
  function at(root,d,fn){ root.__t = root.__t||[]; root.__t.push(setTimeout(fn, d/rate())); }
  function reflow(el){ void el.offsetWidth; }
  function evalPts(pts,u){
    if (u <= 0) return 0; if (u >= 1) return 1;
    var f = u*(pts.length-1), i = Math.floor(f), t = f-i;
    return pts[i] + (pts[i+1]-pts[i])*t;
  }
  /* Overdamped ticker on the house "tally" curve. Never bounces past. */
  function tick(root, el, from, to, dur, fmt){
    root.__f = root.__f||[];
    if (REDUCED){ el.textContent = fmt(to); return; }
    var t0 = null, d = dur/rate(), done = false;
    function step(ts){
      if (t0 === null) t0 = ts;
      var u = Math.min(1,(ts-t0)/d);
      el.textContent = fmt(from + (to-from)*evalPts(SP.tally.pts,u));
      if (u < 1) root.__f.push(requestAnimationFrame(step)); else done = true;
    }
    root.__f.push(requestAnimationFrame(step));
    /* Guard: a background tab, a throttled frame clock or a headless capture
       can starve rAF entirely. A figure stuck on its start value is worse than
       one that arrives without the count, so the end state is not optional. */
    root.__t = root.__t||[];
    root.__t.push(setTimeout(function(){ if(!done) el.textContent = fmt(to); }, d + 80));
  }
  var int0 = function(v){ return String(Math.round(v)); };
  var money2 = function(v){ return '$'+v.toFixed(2); };

  function push(o){ o.family = FAM; window.MUDAVYM_MOTIONS.push(o); }
  /* wire an interactive control once, no matter how often play() runs */
  function once(el,ev,fn){ if(!el||el['__w'+ev]) return; el['__w'+ev]=1; el.addEventListener(ev,fn); }

  /* ══════════════════════════════════════════════════════════════════════
     01 — the tap succeeds locally, the network is not consulted
     ════════════════════════════════════════════════════════════════════ */
  push({
    id:'inv-01', name:'Count lands before the network does',
    purpose:'Spot count on /inventory: a counter in the cellar taps Submit with no signal. submitSpotCount queues it and returns synced:false, so the screen must say SAVED, not FAILED — the tap is answered by the device, never by a spinner waiting on a round trip.',
    spec:'button press 160ms house ink (2px, no scale below .98) · receipt latches with the house '+sp(SP.tuck,'tuck')+' · the accent rule draws scaleY 0→1 over 320ms cubic-bezier(.16,1,.3,1) · there is no spinner state at all, by design.',
    source:'apps/web/src/lib/spotCountOutbox.ts:51',
    html:'<div class="mx-inv iv1">'+
      '<div class="iv-h"><span class="iv-k">Spot count &#183; main cellar</span>'+
      '<span class="iv-k iv1-net">no signal</span></div>'+
      '<div class="iv1-card">'+
        '<div class="iv1-nm">Bodega &Aacute;lvaro &#183; Tempranillo 2019</div>'+
        '<div class="iv1-fig"><span class="iv1-q">34</span><span class="iv1-u">counted</span></div>'+
        '<button class="iv1-btn" type="button">Submit count</button>'+
      '</div>'+
      '<div class="iv1-out"><span class="iv1-rule"></span>'+
        '<span class="iv1-txt">Saved on this phone</span>'+
        '<span class="iv1-bd">1 to send</span></div>'+
      '<div class="iv-note iv1-foot">Their next action is the next shelf.</div>'+
      '</div>',
    play:function(root){
      stop(root);
      var btn=q(root,'.iv1-btn'), out=q(root,'.iv1-out'), rule=q(root,'.iv1-rule'), bd=q(root,'.iv1-bd');
      function reset(){
        [btn,out,rule,bd].forEach(function(el){ el.style.transition='none'; });
        btn.style.transform='scale(1)';
        out.style.opacity='0'; out.style.transform='translateY(6px)';
        rule.style.transform='scaleY(0)'; bd.style.opacity='0';
        reflow(out);
      }
      function land(){
        stop(root); reset();   /* a real tap mid-demo cancels the demo, not the other way round */
        if (REDUCED){ out.style.opacity='1'; out.style.transform='none';
          rule.style.transform='scaleY(1)'; bd.style.opacity='1'; return; }
        at(root,140,function(){
          btn.style.transition='transform '+ms(160)+' '+EZ.settle;
          btn.style.transform='scale(.98)';
        });
        at(root,300,function(){ btn.style.transform='scale(1)'; });
        /* The receipt does not wait on the server: it arrives 40ms after the
           finger leaves the button, which is faster than any request. */
        at(root,340,function(){
          out.style.transition='opacity '+ms(180)+' '+EZ.settle+', transform '+ms(SP.tuck.duration)+' '+SP.tuck.easing;
          out.style.opacity='1'; out.style.transform='translateY(0)';
          rule.style.transition='transform '+ms(320)+' '+EZ.settle;
          rule.style.transform='scaleY(1)';
        });
        at(root,560,function(){
          bd.style.transition='opacity '+ms(160)+' '+EZ.settle;
          bd.style.opacity='1';
        });
      }
      once(btn,'click',land);
      land();
    }
  });

  /* ══════════════════════════════════════════════════════════════════════
     02 — drain, then refetch
     ════════════════════════════════════════════════════════════════════ */
  push({
    id:'inv-02', name:'The outbox drains, the table catches up',
    purpose:'Signal returns while /inventory is open. watchSpotCountOutbox flushes the queue and only then calls refetchInventory — so the queue empties first and the figures beneath it correct themselves afterwards. Two events, deliberately not one.',
    spec:'drain interval 90ms — one network round trip apiece, and the operator is counting them, so it is slower than the 28ms list stagger · each row exits 320ms house settle, its slot closes grid-template-rows 1fr→0fr on the same curve · refetch figures use '+sp(SP.tally,'tally')+', tabular-nums.',
    source:'apps/web/src/pages/inventory/command/InventoryCommandPage.tsx:101',
    html:'<div class="mx-inv iv2">'+
      '<div class="iv-h"><span class="iv-k">Outbox &#183; inventory.spotCount</span>'+
      '<span class="iv-k iv2-net">offline</span></div>'+
      '<div class="iv2-q">'+
        ['Ch&acirc;teau Musar 2017 &#183; 12','Vi&ntilde;a Tondonia 2011 &#183; 4',
         'Cava Brut NV &#183; 28','Barolo Serralunga 2016 &#183; 7'].map(function(n){
          return '<div class="iv2-slot"><div class="iv2-in"><div class="iv2-i">'+
            '<i class="d"></i><span class="nm">'+n+'</span><span class="st">queued</span></div></div></div>';
        }).join('')+
      '</div>'+
      '<div class="iv2-tbl"><span class="iv2-sweep"></span>'+
        '<div class="iv2-hd"><span class="iv-k">On hand</span><span class="iv-k">live</span></div>'+
        '<div class="iv2-r"><span>Musar</span><span class="v" data-to="12">0</span></div>'+
        '<div class="iv2-r"><span>Tondonia</span><span class="v" data-to="4">0</span></div>'+
        '<div class="iv2-r"><span>Cava Brut</span><span class="v" data-to="28">0</span></div>'+
      '</div></div>',
    play:function(root){
      stop(root);
      var net=q(root,'.iv2-net'), slots=qa(root,'.iv2-slot'), sweep=q(root,'.iv2-sweep'),
          vals=qa(root,'.iv2-r .v');
      function reset(){
        net.textContent='offline'; net.className='iv-k iv2-net';
        slots.forEach(function(s){
          var i=q(s,'.iv2-i');
          s.style.transition='none'; s.style.gridTemplateRows='1fr';
          i.style.transition='none'; i.style.opacity='1'; i.style.transform='none';
          q(s,'.st').textContent='queued'; q(s,'.st').style.color='';
        });
        sweep.style.transition='none'; sweep.style.opacity='0'; sweep.style.top='0';
        vals.forEach(function(v){ v.textContent='0'; });
        reflow(sweep);
      }
      function end(){
        slots.forEach(function(s){ s.style.gridTemplateRows='0fr'; q(s,'.iv2-i').style.opacity='0'; });
        vals.forEach(function(v){ v.textContent=v.getAttribute('data-to'); });
      }
      reset();
      if (REDUCED){ net.textContent='synced'; net.className='iv-k iv2-net ok'; end(); return; }
      at(root,220,function(){
        net.style.transition='color '+ms(160)+' '+EZ.settle;
        net.textContent='online'; net.className='iv-k iv2-net on';
      });
      slots.forEach(function(s,i){
        at(root, 380+i*90, function(){
          var inner=q(s,'.iv2-i');
          q(s,'.st').textContent='sent'; q(s,'.st').style.color='var(--m-ok)';
          inner.style.transition='opacity '+ms(200)+' '+EZ.out+', transform '+ms(320)+' '+EZ.settle;
          inner.style.opacity='0'; inner.style.transform='translateX(14px)';
          s.style.transition='grid-template-rows '+ms(320)+' '+EZ.settle;
          at(root,110,function(){ s.style.gridTemplateRows='0fr'; });
        });
      });
      /* Only now does the page refetch: the queue is authoritative until it is empty. */
      var after = 380+slots.length*90+340;
      at(root, after, function(){
        sweep.style.transition='opacity '+ms(120)+' linear, top '+ms(420)+' '+EZ.turn;
        sweep.style.opacity='1'; sweep.style.top='100%';
        net.textContent='synced'; net.className='iv-k iv2-net ok';
        vals.forEach(function(v,i){
          at(root, i*70, function(){ tick(root,v,0,+v.getAttribute('data-to'),SP.tally.duration,int0); });
        });
      });
      at(root, after+460, function(){ sweep.style.opacity='0'; });
    }
  });

  /* ══════════════════════════════════════════════════════════════════════
     03 — the same key, sent twice
     ════════════════════════════════════════════════════════════════════ */
  push({
    id:'inv-03', name:'One key, two sends',
    purpose:'newIdempotencyKey is generated at the moment of the tap and reused on every retry, so a request that reached the server before the connection dropped cannot book the delivery twice. The whole motion exists to show a number NOT moving.',
    spec:'packet travel 520ms LINEAR — a network hop has no easing and pretending otherwise is a lie · the break is 160ms house ink · the ALREADY RECORDED seal is the house '+sp(SP.stamp,'stamp')+' · the stock figure is given no animation whatsoever, which is the entire point.',
    source:'apps/web/src/lib/doorOutbox.ts:35',
    html:'<div class="mx-inv iv3">'+
      '<div class="iv3-key">door:PO-1038:8f3c1a&#8230;</div>'+
      '<div class="iv3-wire"><span class="iv3-e">phone</span>'+
        '<span class="iv3-line"><i class="iv3-pkt"></i><i class="iv3-cut"></i></span>'+
        '<span class="iv3-e">server</span></div>'+
      '<div class="iv3-log">'+
        '<div class="iv3-l no" data-i="0"><i>send 1</i><span>lost in flight &#183; queued</span></div>'+
        '<div class="iv3-l" data-i="1"><i>send 2</i><span>same key, replayed</span></div>'+
        '<div class="iv3-l ok" data-i="2"><i>200</i><span class="iv3-seal">already recorded</span></div>'+
      '</div>'+
      '<div class="iv3-stock"><b>24</b><span class="iv-k">booked, unchanged</span></div>'+
      '</div>',
    play:function(root){
      stop(root);
      var pkt=q(root,'.iv3-pkt'), cut=q(root,'.iv3-cut'), seal=q(root,'.iv3-seal'),
          logs=qa(root,'.iv3-l');
      function reset(){
        pkt.style.transition='none'; pkt.style.opacity='0'; pkt.style.left='0';
        cut.style.transition='none'; cut.style.opacity='0'; cut.style.transform='scaleY(0)';
        seal.style.transition='none'; seal.style.opacity='0'; seal.style.transform='scale(.6) rotate(-5deg)';
        logs.forEach(function(l){ l.style.transition='none'; l.style.opacity='0'; });
        reflow(pkt);
      }
      reset();
      if (REDUCED){
        logs.forEach(function(l){ l.style.opacity='1'; });
        cut.style.opacity='1'; cut.style.transform='scaleY(1)';
        seal.style.opacity='1'; seal.style.transform='none'; return;
      }
      /* attempt 1: gets 54% of the way and dies there */
      at(root,200,function(){
        pkt.style.transition='opacity '+ms(80)+' linear, left '+ms(520)+' linear';
        pkt.style.opacity='1'; pkt.style.left='calc(54% - 8px)';
      });
      at(root,740,function(){
        cut.style.transition='opacity '+ms(90)+' linear, transform '+ms(160)+' '+EZ.settle;
        cut.style.opacity='1'; cut.style.transform='scaleY(1)';
        pkt.style.transition='opacity '+ms(140)+' '+EZ.out;
        pkt.style.opacity='0';
      });
      at(root,860,function(){
        logs[0].style.transition='opacity '+ms(180)+' '+EZ.settle; logs[0].style.opacity='1';
      });
      /* attempt 2: identical key, all the way across */
      at(root,1180,function(){
        logs[1].style.transition='opacity '+ms(180)+' '+EZ.settle; logs[1].style.opacity='1';
        pkt.style.transition='none'; pkt.style.left='0'; reflow(pkt);
        pkt.style.transition='opacity '+ms(80)+' linear, left '+ms(520)+' linear';
        pkt.style.opacity='1'; pkt.style.left='calc(100% - 7px)';
        cut.style.transition='opacity '+ms(220)+' '+EZ.out; cut.style.opacity='0';
      });
      at(root,1740,function(){
        pkt.style.transition='opacity '+ms(140)+' '+EZ.out; pkt.style.opacity='0';
        logs[2].style.transition='opacity '+ms(160)+' '+EZ.settle; logs[2].style.opacity='1';
        seal.style.transition='opacity '+ms(120)+' linear, transform '+ms(SP.stamp.duration)+' '+SP.stamp.easing;
        seal.style.opacity='1'; seal.style.transform='scale(1) rotate(0deg)';
      });
    }
  });

  /* ══════════════════════════════════════════════════════════════════════
     04 — the door flow, and you can drive it
     ════════════════════════════════════════════════════════════════════ */
  push({
    id:'inv-04', name:'Three taps at the door',
    purpose:'DoorReceipt on a phone at 12% with a driver double-parked: photo, boxes, done. Steppers not a keypad, because a typo in a stairwell is ten times the real number and nobody is there to catch it. Try the +/- and Done — they are wired.',
    spec:'panel change 420ms house turn (it opens a step, not a row) · the digit is '+sp(SP.tally,'tally')+' so a count never overshoots · tap feedback 160ms ink · the check lands on the house '+sp(SP.stamp,'stamp')+' · every target is 56px, the smallest a cold gloved hand hits reliably.',
    source:'apps/web/src/pages/receiving/DoorReceipt.tsx:45',
    html:'<div class="mx-inv iv4">'+
      '<div class="iv4-bar"><span class="iv-k">Delivery</span><span class="iv-k wn">12% &#183; offline</span></div>'+
      '<div class="iv4-stage">'+
        '<div class="iv4-p p1 on"><div class="iv4-t">Photograph the paperwork</div>'+
          '<div class="iv4-hint">Whatever the driver handed you.</div>'+
          '<button class="iv4-cam" type="button">Take photo</button></div>'+
        '<div class="iv4-p p2"><div class="iv4-t">How many boxes?</div>'+
          '<div class="iv4-step"><button class="iv4-tap iv4-m" type="button">&#8722;</button>'+
            '<span class="iv4-v">1</span>'+
            '<button class="iv4-tap iv4-pl" type="button">+</button></div>'+
          '<button class="iv4-done" type="button">Done</button></div>'+
        '<div class="iv4-p p3"><div class="iv4-ok"></div>'+
          '<div class="iv4-msg">Saved on this phone. It will send itself when you have signal.</div></div>'+
      '</div></div>',
    play:function(root){
      stop(root);
      var ps=qa(root,'.iv4-p'), v=q(root,'.iv4-v'), ok=q(root,'.iv4-ok'),
          cam=q(root,'.iv4-cam'), done=q(root,'.iv4-done'),
          plus=q(root,'.iv4-pl'), minus=q(root,'.iv4-m');
      function show(i){
        ps.forEach(function(p,j){
          p.style.transition = REDUCED ? 'none' : 'opacity '+ms(240)+' '+EZ.turn+', transform '+ms(420)+' '+EZ.turn;
          p.classList.toggle('on', j===i);
          p.style.opacity = j===i ? '1' : '0';
          p.style.transform = j===i ? 'translateX(0)' : (j<i ? 'translateX(-8px)' : 'translateX(8px)');
        });
      }
      function pop(el){
        if (REDUCED) return;
        el.style.transition='none'; el.style.transform='scale(.94)'; reflow(el);
        el.style.transition='transform '+ms(SP.tuck.duration)+' '+SP.tuck.easing;
        el.style.transform='scale(1)';
      }
      function bump(d){
        var n = Math.max(0, (+v.textContent||0) + d);
        v.textContent = String(n); pop(v);
      }
      /* Real taps take the demo off its rails rather than fighting it. */
      once(plus,'click',function(){ stop(root); bump(1); });
      once(minus,'click',function(){ stop(root); bump(-1); });
      once(cam,'click',function(){ stop(root); show(1); });
      once(done,'click',function(){ stop(root); show(2); land(); });
      function land(){
        ok.style.transition='none'; ok.style.opacity='0'; ok.style.transform='scale(.4)'; reflow(ok);
        if (REDUCED){ ok.style.opacity='1'; ok.style.transform='none'; return; }
        ok.style.transition='opacity '+ms(120)+' linear, transform '+ms(SP.stamp.duration)+' '+SP.stamp.easing;
        ok.style.opacity='1'; ok.style.transform='scale(1)';
      }
      v.textContent='1';
      show(0);
      ok.style.opacity='0'; ok.style.transform='scale(.4)';
      if (REDUCED){ show(2); v.textContent='6'; land(); return; }
      at(root,900,function(){ pop(cam); show(1); });
      [1500,1740,1980,2220,2460].forEach(function(t){ at(root,t,function(){ pop(plus); bump(1); }); });
      at(root,2900,function(){ pop(done); show(2); land(); });
    }
  });

  /* ══════════════════════════════════════════════════════════════════════
     05 — the status pill crossing offline -> reconciled
     ════════════════════════════════════════════════════════════════════ */
  push({
    id:'inv-05', name:'Offline to reconciled',
    purpose:'The SyncStatus indicator, which is the only thing on screen at 1am telling a manager whether the night is actually saved. It holds its success state for exactly 2000ms and then retires to a resting line — the constant is in the component, not invented here.',
    spec:'state text 160ms house ink · the working state is the house 1900ms shimmer sweep across the label, never a spinner — spinners promise a duration nobody can honour · the check is '+sp(SP.stamp,'stamp')+' · success holds 2000ms exactly (SyncStatus.tsx:57) then settles back over 320ms.',
    source:'apps/web/src/components/ui/SyncStatus.tsx:57',
    html:'<div class="mx-inv iv5">'+
      '<div class="iv5-pill"><span class="iv5-dot"></span>'+
        '<span class="iv5-tx"><b class="iv5-ttl">Offline</b><i class="iv5-sub">3 changes saved locally</i></span>'+
        '<span class="iv5-cnt">3</span></div>'+
      '<div class="iv5-tl">'+['offline','syncing','synced','resting'].map(function(s){
          return '<span class="iv5-s">'+s+'</span>'; }).join('')+'</div>'+
      '<div class="iv5-track"><i class="iv5-mk"></i></div>'+
      '</div>',

          hn=q(root,'.iv11-hn'), truth=q(root,'.iv11-truth'), cta=q(root,'.iv11-cta');
      function reset(){
        dashes.forEach(function(d){ d.style.transition='none'; d.style.opacity='1'; d.style.transform='none'; });
        whys.forEach(function(w){ w.style.transition='none'; w.style.opacity='0'; w.style.transform='translateY(9px)'; });
        hn.style.transition='none'; hn.style.opacity='0';
        truth.style.transition='none'; truth.style.gridTemplateRows='0fr';
        cta.style.transition='none'; cta.style.opacity='0'; cta.style.transform='translateY(4px)';
        reflow(truth);
      }
      reset();
      if (REDUCED){
        dashes.forEach(function(d){ d.style.opacity='0'; });
        whys.forEach(function(w){ w.style.opacity='1'; w.style.transform='none'; });
        hn.style.opacity='1'; truth.style.gridTemplateRows='1fr';
        cta.style.opacity='1'; cta.style.transform='none'; return;
      }
      /* a beat of today's screen first: three grey dashes, saying nothing */
      at(root,900,function(){
        hn.style.transition='opacity '+ms(160)+' '+EZ.settle; hn.style.opacity='1';
      });
      dashes.forEach(function(d,i){
        at(root, 1000+i*90, function(){
          d.style.transition='opacity '+ms(200)+' '+EZ.out+', transform '+ms(420)+' '+EZ.turn;
          d.style.opacity='0'; d.style.transform='translateY(-9px)';
          var w=whys[i];
          w.style.transition='opacity '+ms(240)+' '+EZ.settle+', transform '+ms(420)+' '+EZ.turn;
          w.style.opacity='1'; w.style.transform='translateY(0)';
        });
      });
      at(root,1480,function(){
        truth.style.transition='grid-template-rows '+ms(420)+' '+EZ.turn;
        truth.style.gridTemplateRows='1fr';
      });
      at(root,1780,function(){
        cta.style.transition='opacity '+ms(200)+' '+EZ.settle+', transform '+ms(320)+' '+EZ.settle;
        cta.style.opacity='1'; cta.style.transform='translateY(0)';
      });
    }
  });
})();
</script>
