<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>030 — Honest Inventory (integrated)</title>
  <link rel="stylesheet" href="../themes/default.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: #f7f8f9; color: var(--color-text); padding-top: 46px; }

    #variant-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
      background: #17131a; border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 7px 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    #variant-nav .brand { color: #fff; font-weight: 800; font-family: var(--font-display); font-size: 13px; }
    #variant-nav .tag { color: rgba(255,255,255,0.35); font-size: 11px; margin-right: 12px; font-family: var(--font-mono); }
    .variant-tab { padding: 5px 14px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.72); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; }
    .variant-tab:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .variant-tab.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
    .variant { display: none; }
    .variant.active { display: block; }

    /* ─── Real app header ─── */
    .app-header { background: #fff; border-bottom: 1px solid var(--color-border); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; }
    .app-header h1 { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    .app-header p { font-size: 13px; color: var(--color-text-muted); margin-top: 2px; }
    .sync-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--color-success); background: var(--color-success-bg); border: 1px solid var(--color-success-border); padding: 6px 12px; border-radius: var(--radius-full); }
    .sync-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-success); }

    .page { padding: 24px 28px 80px; max-width: 1400px; margin: 0 auto; }
    .row { display: flex; gap: 20px; }
    .section { margin-bottom: 22px; }

    /* value toggle */
    .val-toggle-wrap { display: flex; align-items: center; gap: 12px; }
    .val-toggle-wrap .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-muted); }
    .val-toggle { display: inline-flex; background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 3px; box-shadow: var(--shadow-xs); }
    .val-opt { padding: 7px 15px; border-radius: var(--radius-full); font-size: 12px; font-weight: 700; color: var(--color-text-muted); cursor: pointer; border: none; background: none; transition: var(--transition-base); }
    .val-opt.active { background: var(--color-text); color: #fff; }
    .val-opt.active[data-mode="retail"] { background: #1d4ed8; }
    .val-opt.active[data-mode="potential"] { background: var(--color-primary); }

    /* ─── Stat cards (real 6-up) ─── */
    .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
    .stat { background: #fff; border: 1px solid #f0f0f2; border-radius: var(--radius-lg); padding: 15px 16px; box-shadow: var(--shadow-sm); position: relative; }
    .stat .lbl { font-size: 12px; color: var(--color-text-muted); display: flex; align-items: center; gap: 6px; }
    .stat .val { font-size: 24px; font-weight: 800; font-family: var(--font-display); margin-top: 6px; }
    .stat .basis { font-size: 10px; font-weight: 700; margin-top: 3px; }
    .basis-cost { color: var(--color-text-secondary); }
    .basis-retail { color: #1d4ed8; }
    .basis-potential { color: var(--color-primary); }
    .stat.value-stat { cursor: pointer; transition: var(--transition-base); }
    .stat.value-stat:hover { box-shadow: var(--shadow-md); }
    .stat .explain-pill { position: absolute; top: 12px; right: 12px; font-size: 9px; font-weight: 800; color: var(--color-primary); background: var(--color-primary-light); padding: 3px 7px; border-radius: var(--radius-full); opacity: 0; transition: var(--transition-base); }
    .stat.value-stat:hover .explain-pill { opacity: 1; }
    .c-blue { color: #2563eb; } .c-purple { color: #7c3aed; } .c-emerald { color: var(--color-success); } .c-amber { color: var(--color-warning); } .c-rose { color: var(--color-danger); }

    /* ─── Insights panel ─── */
    .insights { background: #fff; border: 1px solid #f0f0f2; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .insights-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; cursor: pointer; }
    .insights-head:hover { background: #fafafa; }
    .insights-head .t { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
    .insights-body { border-top: 1px solid #f0f0f2; padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .ins-col h4 { font-size: 13px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .loc-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #f7f8f9; border-radius: var(--radius-md); margin-bottom: 8px; }
    .loc-left { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
    .loc-dot { width: 10px; height: 10px; border-radius: 50%; }
    .loc-cnt { font-size: 13px; font-weight: 700; } .loc-cap { font-size: 11px; color: var(--color-text-muted); }
    .health-card { background: linear-gradient(135deg, #faf5ff, #eef2ff); border-radius: var(--radius-lg); padding: 16px; }
    .health-score { font-family: var(--font-display); font-size: 30px; font-weight: 800; color: #7c3aed; }
    .health-bar { height: 8px; background: #fff; border-radius: 4px; overflow: hidden; margin-top: 10px; }
    .health-bar i { display: block; height: 100%; background: linear-gradient(90deg, #a855f7, #6366f1); }
    .trust-card { background: linear-gradient(135deg, #ecfdf5, #f0fdfa); border: 1px solid var(--color-success-border); border-radius: var(--radius-lg); padding: 16px; }
    .trust-score { font-family: var(--font-display); font-size: 30px; font-weight: 800; color: var(--color-success); }
    .metric-line { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: var(--radius-md); font-size: 12px; font-weight: 600; margin-top: 8px; }

    /* ─── View tabs ─── */
    .tabs-row { display: flex; align-items: center; gap: 14px; }
    .tabs { display: inline-flex; background: #eef0f3; border-radius: var(--radius-md); padding: 4px; }
    .tab { padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; color: var(--color-text-secondary); cursor: pointer; border: none; background: none; display: flex; align-items: center; gap: 6px; transition: var(--transition-base); }
    .tab.active { background: #fff; color: var(--color-text); box-shadow: var(--shadow-xs); }

    /* ─── Toolbar ─── */
    .toolbar { background: #fff; border: 1px solid #f0f0f2; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .search { flex: 1; min-width: 220px; position: relative; }
    .search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 13px; outline: none; }
    .search input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(205,45,91,0.1); }
    .search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); }
    .tbtn { display: flex; align-items: center; gap: 7px; padding: 10px 15px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: #fff; font-size: 13px; font-weight: 600; color: var(--color-text-secondary); cursor: pointer; transition: var(--transition-base); }
    .tbtn:hover { background: #fafafa; }
    .tbtn.primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; box-shadow: var(--shadow-wine); }
    .tbtn.danger { border-color: var(--color-danger-border); color: var(--color-danger); }

    /* ─── Table ─── */
    .table-card { background: #fff; border: 1px solid #f0f0f2; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 1120px; }
    thead th { text-align: left; font-size: 11px; font-weight: 700; color: #6b7280; padding: 12px 14px; border-bottom: 1px solid var(--color-border); background: #fafbfc; white-space: nowrap; }
    thead th.c { text-align: center; } thead th.r { text-align: right; }
    tbody td { padding: 13px 14px; border-bottom: 1px solid #f4f5f7; font-size: 13px; vertical-align: middle; }
    tbody tr:hover { background: #fbf7f8; }
    .wine-name { font-weight: 700; font-size: 13.5px; }
    .wine-meta { font-size: 11px; color: var(--color-text-muted); margin-top: 1px; }
    .type-pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-full); text-transform: capitalize; }
    .type-red { background: #fdf2f4; color: #b91c4b; } .type-white { background: #fefce8; color: #a16207; } .type-spark { background: #fff7ed; color: #c2410c; } .type-rose { background: #fdf2f8; color: #be185d; }
    .num { text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .r { text-align: right; }
    .money { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
    .loc-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: var(--radius-full); background: #f3f4f6; }

    .live { font-size: 16px; font-weight: 700; color: #2563eb; }
    .shadow { font-size: 16px; font-weight: 700; color: #7c3aed; }
    .muted { color: var(--color-text-muted); }

    /* honest stock states */
    .stock-unknown { color: var(--color-text-muted); font-style: italic; font-size: 12px; }
    .stock-zero { color: var(--color-danger); font-weight: 700; }

    /* unified status */
    .status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: var(--radius-full); }
    .status .dot { width: 6px; height: 6px; border-radius: 50%; }
    .st-critical { background: var(--color-danger-bg); color: var(--color-danger); } .st-critical .dot { background: var(--color-danger); }
    .st-low { background: var(--color-warning-bg); color: var(--color-warning); } .st-low .dot { background: var(--color-warning); }
    .st-healthy { background: var(--color-success-bg); color: var(--color-success); } .st-healthy .dot { background: var(--color-success); }
    .st-unknown { background: #f3f4f6; color: #9ca3af; } .st-unknown .dot { background: #9ca3af; }

    /* trust badge */
    .trust { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-full); cursor: pointer; }
    .trust-hi { background: #ecfdf5; color: #059669; } .trust-mid { background: #fffbeb; color: #D97706; } .trust-lo { background: #fef2f2; color: #DC2626; }

    /* value cell w/ explain */
    .val-cell { position: relative; cursor: pointer; }
    .val-cell:hover .money { color: var(--color-primary); }
    .val-cell .explain-i { opacity: 0; font-size: 10px; color: var(--color-primary); font-weight: 700; margin-left: 4px; }
    .val-cell:hover .explain-i { opacity: 1; }

    .icon-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--color-border); background: #fff; cursor: pointer; font-size: 13px; color: var(--color-text-secondary); }
    .icon-btn:hover { background: #f3f4f6; }

    /* ─── Ledger drawer ─── */
    .scrim { position: fixed; inset: 0; background: rgba(20,15,22,0.4); backdrop-filter: blur(2px); z-index: 9990; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 92vw; background: #fff; z-index: 9991; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow: -20px 0 60px rgba(0,0,0,0.18); display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--color-border); position: relative; }
    .drawer-eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-primary); }
    .drawer-title { font-family: var(--font-display); font-size: 20px; font-weight: 800; margin-top: 3px; }
    .drawer-sub { font-size: 12px; color: var(--color-text-muted); margin-top: 3px; }
    .drawer-close { position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--color-border); background: #fff; cursor: pointer; font-size: 15px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
    .bal-line { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: var(--radius-md); background: #fbf7f8; border: 1px solid var(--color-primary-light); margin-bottom: 16px; }
    .bal-line b { font-family: var(--font-display); font-size: 22px; }
    .led-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px dashed #eceef1; }
    .led-icon { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .led-main { flex: 1; } .led-type { font-size: 12.5px; font-weight: 700; } .led-meta { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; font-family: var(--font-mono); }
    .led-delta { font-family: var(--font-mono); font-weight: 700; font-size: 13px; } .delta-pos { color: #059669; } .delta-neg { color: #DC2626; }
    .led-after { font-family: var(--font-mono); font-size: 10px; color: var(--color-text-muted); text-align: right; margin-top: 2px; }
    .immutable { font-size: 11px; color: var(--color-text-muted); text-align: center; padding: 14px; font-style: italic; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--color-text); color: #fff; padding: 11px 20px; border-radius: var(--radius-full); font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 9995; box-shadow: var(--shadow-xl); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #sketch-tools { position: fixed; bottom: 12px; right: 12px; z-index: 9999; font-size: 12px; background: rgba(0,0,0,0.72); color: #fff; padding: 8px 12px; border-radius: 8px; opacity: 0.35; transition: opacity 0.2s; }
    #sketch-tools:hover { opacity: 1; }

    @media (max-width: 1000px) { .stats { grid-template-columns: repeat(3,1fr); } .insights-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="variant-nav">
    <span class="brand">WineOps</span><span class="tag">030 · honest-integration</span>
    <button class="variant-tab active" onclick="showVariant('a')">A · Minimal Retrofit</button>
    <button class="variant-tab" onclick="showVariant('b')">B · Explain-First</button>
    <button class="variant-tab" onclick="showVariant('c')">C · Synthesis ★</button>
  </div>

  <div id="variant-a" class="variant active"></div>
  <div id="variant-b" class="variant"></div>
  <div id="variant-c" class="variant"></div>

  <div class="scrim" id="scrim" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-eyebrow" id="drTitleEyebrow">Explain this number</div>
      <div class="drawer-title" id="drTitle">—</div>
      <div class="drawer-sub" id="drSub">Every figure traces to the immutable ledger</div>
      <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="drBody"></div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="sketch-tools">030 Honest · integrated</div>

  <script>
    const WINES = [
      { name:'Barolo, G.D. Vajra', producer:'2019 · Nebbiolo', type:'red', loc:'Rack B4', live:6, shadow:0, min:8, cost:68, menu:180, status:'critical', trust:'mid', trustVal:78 },
      { name:'Sancerre, Domaine V.', producer:'2023 · Sauvignon Blanc', type:'white', loc:'Rack A2', live:11, shadow:2, min:10, cost:24, menu:68, status:'healthy', trust:'hi', trustVal:97 },
      { name:'Chianti Classico', producer:'2021 · Sangiovese', type:'red', loc:'Rack A1', live:8, shadow:0, min:6, cost:18, menu:52, status:'healthy', trust:'hi', trustVal:99 },
      { name:'Chablis Premier Cru', producer:'2021 · Chardonnay', type:'white', loc:'Rack B5', live:null, shadow:0, min:6, cost:32, menu:88, status:'unknown', trust:'lo', trustVal:62 },
      { name:'Prosecco Superiore', producer:'NV · Glera', type:'spark', loc:'Bar Back', live:14, shadow:0, min:12, cost:14, menu:44, status:'healthy', trust:'hi', trustVal:95 },
      { name:'Amarone della Valp.', producer:'2018 · Corvina', type:'red', loc:'Reserve', live:2, shadow:0, min:4, cost:54, menu:145, status:'low', trust:'mid', trustVal:85 },
      { name:'Rosé de Provence', producer:'2022 · Grenache', type:'rose', loc:'Bar Back', live:0, shadow:0, min:4, cost:16, menu:42, status:'critical', trust:'hi', trustVal:100 },
    ];

    const LEDGER = [
      { type:'POS Sale', icon:'🍷', bg:'#fef2f2', meta:'Toast · Fri 21:14', delta:-1, after:7 },
      { type:'POS Sale', icon:'🍷', bg:'#fef2f2', meta:'Toast · Fri 20:02', delta:-1, after:8 },
      { type:'Reconciliation', icon:'⚖️', bg:'#eff6ff', meta:'Count · Thu 18:00', delta:+2, after:9 },
      { type:'Purchase received', icon:'📦', bg:'#ecfdf5', meta:'Invoice #4821 · Mon', delta:+6, after:7 },
      { type:'Comp / waste', icon:'🗑️', bg:'#fffbeb', meta:'Corked · Sun', delta:-1, after:1 },
    ];

    const LOCATIONS = [
      { name:'Main Cellar', color:'#CD2D5B', cnt:78, cap:100 },
      { name:'Bar Back', color:'#3b82f6', cnt:34, cap:60 },
      { name:'Reserve Room', color:'#059669', cnt:46, cap:50 },
      { name:'Kitchen Rack', color:'#d97706', cnt:12, cap:24 },
    ];

    const val = { a:'cost', b:'cost', c:'cost' };

    function fmt(n){ return '$' + Math.round(n).toLocaleString(); }
    function valueOf(w, mode){
      const stock = (w.live||0) + (w.shadow||0);
      if (mode==='cost') return stock * w.cost;
      if (mode==='retail') return stock * w.menu;
      return stock * (w.menu - w.cost);
    }
    function basisLabel(mode){ return mode==='cost'?'at cost (WAC)':mode==='retail'?'at menu price':'potential margin'; }
    function basisClass(mode){ return mode==='cost'?'basis-cost':mode==='retail'?'basis-retail':'basis-potential'; }

    function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2000); }

    function openDrawer(title, sub, kind){
      document.getElementById('drTitle').textContent = title;
      document.getElementById('drSub').textContent = sub;
      const bal = kind==='value' ? '$1,224 at cost' : '7 bottles';
      let html = `<div class="bal-line"><span style="font-size:12px;font-weight:700;color:var(--color-text-secondary);">Current balance</span><b>${bal}</b></div>`;
      html += `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-muted);margin-bottom:6px;">Ledger transactions</div>`;
      html += LEDGER.map(l=>`
        <div class="led-item">
          <div class="led-icon" style="background:${l.bg}">${l.icon}</div>
          <div class="led-main"><div class="led-type">${l.type}</div><div class="led-meta">${l.meta}</div></div>
          <div style="text-align:right;"><div class="led-delta ${l.delta>0?'delta-pos':'delta-neg'}">${l.delta>0?'+':''}${l.delta}</div><div class="led-after">→ ${l.after}</div></div>
        </div>`).join('');
      html += `<div class="immutable">🔒 Immutable ledger · no edits or deletes · every number is defensible at a stocktake</div>`;
      document.getElementById('drBody').innerHTML = html;
      document.getElementById('scrim').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }
    function closeDrawer(){ document.getElementById('scrim').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); }

    function typeClass(t){ return t==='red'?'type-red':t==='white'?'type-white':t==='spark'?'type-spark':'type-rose'; }
    function typeName(t){ return t==='spark'?'sparkling':t; }

    function insightsPanel(variant, open){
      const trustBlock = variant!=='a' ? `
        <div class="ins-col">
          <h4>🛡️ Ledger Integrity</h4>
          <div class="trust-card">
            <div style="font-size:12px;font-weight:600;color:var(--color-text-secondary);">Overall trust score</div>
            <div class="trust-score">94%</div>
            <div style="font-size:11px;color:var(--color-text-secondary);margin-top:4px;">ledger ↔ physical shelf agreement</div>
          </div>
          <div class="metric-line" style="background:#fef2f2;color:#b91c1c;"><span>2 wines drifting</span><span>review</span></div>
          <div class="metric-line" style="background:#ecfdf5;color:#047857;"><span>5 counts this week</span><span>on track</span></div>
        </div>` : `
        <div class="ins-col">
          <h4>📊 Inventory Health</h4>
          <div class="health-card">
            <div style="font-size:12px;font-weight:600;color:var(--color-text-secondary);">Overall health score</div>
            <div class="health-score">86<span style="font-size:14px;color:#9ca3af;">/100</span></div>
            <div class="health-bar"><i style="width:86%"></i></div>
          </div>
          <div class="metric-line" style="background:#ecfdf5;color:#047857;"><span>✓ Healthy stock</span><span>4 wines</span></div>
          <div class="metric-line" style="background:#fffbeb;color:#b45309;"><span>⚠ Needs attention</span><span>3 wines</span></div>
        </div>`;
      return `
      <div class="insights section">
        <div class="insights-head" onclick="this.parentElement.querySelector('.insights-body').style.display = this.parentElement.querySelector('.insights-body').style.display==='none'?'grid':'none'">
          <div class="t">⚡ Inventory Insights & Organization</div>
          <span class="muted">▾</span>
        </div>
        <div class="insights-body" style="display:${open?'grid':'none'}">
          <div class="ins-col">
            <h4>🗂️ Storage Locations</h4>
            ${LOCATIONS.map(l=>`<div class="loc-item"><div class="loc-left"><span class="loc-dot" style="background:${l.color}"></span>${l.name}</div><div><span class="loc-cnt">${l.cnt}</span> <span class="loc-cap">/ ${l.cap}</span></div></div>`).join('')}
          </div>
          <div class="ins-col">
            <h4>📱 QR Quick Access</h4>
            <div style="background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border-radius:var(--radius-lg);padding:20px;text-align:center;">
              <div style="width:96px;height:96px;margin:0 auto 10px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:44px;">▦</div>
              <div style="font-size:13px;font-weight:700;">Inventory QR Code</div>
              <div style="font-size:11px;color:var(--color-text-muted);margin:4px 0 10px;">Scan to count on mobile</div>
              <button class="tbtn" style="width:100%;justify-content:center;background:#059669;color:#fff;border:none;" onclick="toast('QR generated')">Generate QR Code</button>
            </div>
          </div>
          ${trustBlock}
        </div>
      </div>`;
    }

    function tableRows(variant){
      return WINES.map((w,i)=>{
        const total = (w.live||0)+(w.shadow||0);
        const mode = val[variant];
        const liveCell = w.live===null
          ? `<span class="stock-unknown">unknown</span>`
          : (w.live===0 ? `<span class="live stock-zero">0</span>` : `<span class="live">${w.live}</span>`);
        const shadowCell = w.shadow>0 ? `<span class="shadow">${w.shadow}</span>` : `<span class="muted">—</span>`;
        const totalCell = w.live===null ? `<span class="stock-unknown">?</span>` : `<span style="font-weight:700">${total}</span>`;
        const st = {critical:['st-critical','Critical'],low:['st-low','Low'],healthy:['st-healthy','Healthy'],unknown:['st-unknown','Unknown']}[w.status];
        const trustCls = w.trust==='hi'?'trust-hi':w.trust==='mid'?'trust-mid':'trust-lo';
        const valNum = w.live===null ? '—' : fmt(valueOf(w, mode));
        const trustCol = variant!=='a' ? `<td><span class="trust ${trustCls}" onclick="openDrawer('${w.name}','Trust ${w.trustVal}% · ledger vs shelf','stock')">${w.trustVal}%</span></td>` : '';
        const valCell = variant==='a'
          ? `<td class="r"><span class="money">${valNum}</span></td>`
          : `<td class="r val-cell" onclick="openDrawer('${w.name}','Value ${valNum} · ${basisLabel(mode)}','value')"><span class="money">${valNum}</span><span class="explain-i">explain</span></td>`;
        return `<tr>
          <td><div class="wine-name">${w.name}</div><div class="wine-meta">${w.producer}</div></td>
          <td><span class="type-pill ${typeClass(w.type)}">${typeName(w.type)}</span></td>
          <td><span class="loc-tag">📍 ${w.loc}</span></td>
          <td class="num">${liveCell}</td>
          <td class="num">${shadowCell}</td>
          <td class="num">${totalCell}</td>
          <td class="num muted">${w.min}</td>
          <td class="r money">${fmt(w.cost)}</td>
          <td class="r money" style="color:#2563eb">${fmt(w.menu)}</td>
          ${valCell}
          <td><span class="status ${st[0]}"><span class="dot"></span>${st[1]}</span></td>
          ${trustCol}
          <td class="r"><button class="icon-btn" onclick="toast('Edit ${w.name}')">✎</button></td>
        </tr>`;
      }).join('');
    }

    function buildPage(variant){
      const mode = val[variant];
      const totalCost = WINES.reduce((s,w)=> w.live===null?s:s+valueOf(w,'cost'),0);
      const totalRetail = WINES.reduce((s,w)=> w.live===null?s:s+valueOf(w,'retail'),0);
      const totalPot = WINES.reduce((s,w)=> w.live===null?s:s+valueOf(w,'potential'),0);
      const totalVal = mode==='cost'?totalCost:mode==='retail'?totalRetail:totalPot;
      const trustCol = variant!=='a' ? '<th>Trust</th>' : '';

      const valueStat = `
        <div class="stat value-stat" onclick="${variant==='a'?'':`openDrawer('Total inventory value','${fmt(totalVal)} · ${basisLabel(mode)}','value')`}">
          ${variant!=='a'?'<span class="explain-pill">explain</span>':''}
          <div class="lbl">💰 Total Value</div>
          <div class="val">${fmt(totalVal)}</div>
          <div class="basis ${basisClass(mode)}">${basisLabel(mode)}</div>
        </div>`;

      return `
      <div class="app-header">
        <div>
          <h1>Inventory</h1>
          <p>Manage live and shadow stock levels</p>
        </div>
        <span class="sync-chip"><span class="dot"></span>Ledger in sync · last count 2d ago</span>
      </div>
      <div class="page">
        <div class="section" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <div class="val-toggle-wrap">
            <span class="lbl">Value shown as</span>
            <div class="val-toggle">
              <button class="val-opt ${mode==='cost'?'active':''}" data-mode="cost" onclick="setVal('${variant}','cost')">Cost</button>
              <button class="val-opt ${mode==='retail'?'active':''}" data-mode="retail" onclick="setVal('${variant}','retail')">Retail</button>
              <button class="val-opt ${mode==='potential'?'active':''}" data-mode="potential" onclick="setVal('${variant}','potential')">Potential margin</button>
            </div>
          </div>
          <span class="muted" style="font-size:12px;">7 SKUs · 1 with unknown count</span>
        </div>

        <div class="stats section">
          <div class="stat"><div class="lbl">Total Wines</div><div class="val">7</div></div>
          <div class="stat"><div class="lbl">👁 Live Stock</div><div class="val c-blue">41</div></div>
          <div class="stat"><div class="lbl">◐ Shadow Stock</div><div class="val c-purple">2</div></div>
          <div class="stat"><div class="lbl">Healthy</div><div class="val c-emerald">4</div></div>
          <div class="stat"><div class="lbl">Low / Critical</div><div class="val c-amber">3</div></div>
          ${valueStat}
        </div>

        ${insightsPanel(variant, variant==='c')}

        <div class="tabs-row section">
          <div class="tabs">
            <button class="tab active">All Stock</button>
            <button class="tab">👁 Live Stock</button>
            <button class="tab">◐ Shadow Stock</button>
          </div>
          <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#7c3aed;background:#f3e8ff;padding:6px 12px;border-radius:99px;">↻ 1 item needs reconciliation</span>
        </div>

        <div class="toolbar section">
          <div class="search"><span class="ic">⌕</span><input placeholder="Search wines, producers..."></div>
          <button class="tbtn">⚙ Filters</button>
          <button class="tbtn">⭳ Export</button>
          <button class="tbtn primary">＋ Add Wine</button>
          <button class="tbtn danger">↺ Reset Stock</button>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table>
              <thead><tr>
                <th>Wine</th><th>Type</th><th>Location</th>
                <th class="c">Live</th><th class="c">Shadow</th><th class="c">Total</th><th class="c">Min</th>
                <th class="r">Cost</th><th class="r">Menu</th><th class="r">Value (${mode})</th>
                <th>Status</th>${trustCol}<th class="r">Actions</th>
              </tr></thead>
              <tbody>${tableRows(variant)}</tbody>
            </table>
          </div>
        </div>
      </div>`;
    }

    function setVal(variant, mode){ val[variant]=mode; render(variant); }
    function render(variant){ document.getElementById('variant-'+variant).innerHTML = buildPage(variant); }
    function showVariant(id){
      document.querySelectorAll('.variant').forEach(v=>v.classList.remove('active'));
      document.querySelectorAll('.variant-tab').forEach((t,i)=>t.classList.toggle('active',['a','b','c'][i]===id));
      document.getElementById('variant-'+id).classList.add('active');
    }
    ['a','b','c'].forEach(render);
  </script>
</body>
</html>
