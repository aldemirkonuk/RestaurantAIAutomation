<style>
/* ============================================================
   srf — Product surfaces. Media display · order bars · comms ·
   mail · team · invitations. Every selector is prefixed .mx-srf.
   Springs below are simulated (m x'' + c x' + k x = k), sampled
   into linear() at the stated step count. Measured overshoot is
   noted beside each one and matches the 059 house vocabulary.
   ============================================================ */
.mx-srf{
  /* house curves */
  --e-ink:cubic-bezier(.16,1,.3,1);      /* 160ms micro-states   */
  --e-settle:cubic-bezier(.16,1,.3,1);   /* 320ms the house curve*/
  --e-turn:cubic-bezier(.32,.72,0,1);    /* 420ms open a record  */
  /* tuck — spring 380/32/1, 450ms to rest, measured overshoot 1.09% */
  --e-tuck:linear(0.0000 0.0%,0.0548 4.2%,0.1788 8.3%,0.3285 12.5%,0.4773 16.7%,0.6110 20.8%,0.7229 25.0%,0.8119 29.2%,0.8794 33.3%,0.9284 37.5%,0.9624 41.7%,0.9848 45.8%,0.9986 50.0%,1.0063 54.2%,1.0099 58.3%,1.0109 62.5%,1.0104 66.7%,1.0090 70.8%,1.0074 75.0%,1.0058 79.2%,1.0043 83.3%,1.0031 87.5%,1.0021 91.7%,1.0013 95.8%,1.0000 100.0%);
  /* stamp — spring 520/26/1, 560ms to rest, measured overshoot 11.11% */
  --e-stamp:linear(0.0000 0.0%,0.0869 3.6%,0.2841 7.1%,0.5155 10.7%,0.7303 14.3%,0.9010 17.9%,1.0182 21.4%,1.0850 25.0%,1.1111 28.6%,1.1089 32.1%,1.0902 35.7%,1.0647 39.3%,1.0393 42.9%,1.0179 46.4%,1.0023 50.0%,0.9927 53.6%,0.9881 57.1%,0.9873 60.7%,0.9889 64.3%,0.9916 67.9%,0.9945 71.4%,0.9971 75.0%,0.9991 78.6%,1.0005 82.1%,1.0012 85.7%,1.0014 89.3%,1.0013 92.9%,1.0011 96.4%,1.0000 100.0%);
  /* tally — spring 120/26/1, 1408ms to rest, measured overshoot 0.00% */
  --e-tally:linear(0.0000 0.0%,0.1463 4.5%,0.3705 9.1%,0.5579 13.6%,0.6951 18.2%,0.7913 22.7%,0.8575 27.3%,0.9029 31.8%,0.9338 36.4%,0.9549 40.9%,0.9693 45.5%,0.9791 50.0%,0.9857 54.5%,0.9903 59.1%,0.9934 63.6%,0.9955 68.2%,0.9969 72.7%,0.9979 77.3%,0.9986 81.8%,0.9990 86.4%,0.9993 90.9%,0.9995 95.5%,1.0000 100.0%);
  /* arc — the up-then-down path an attachment takes when it detaches.
     Negative early stops lift it against the drop direction: peak hop is
     0.21 x the fall distance, i.e. ~15px on a 70px drop. */
  --e-arc:linear(0.00,-0.12 12%,-0.20 26%,-0.21 40%,-0.12 54%,0.10 66%,0.42 76%,0.74 86%,0.93 93%,1.00);

  --hair:1px solid var(--m-line);
  --tint:color-mix(in srgb, var(--m-accent) 12%, transparent);
  --lift:0 1px 2px color-mix(in srgb, var(--m-ink) 12%, transparent),
         0 8px 22px color-mix(in srgb, var(--m-ink) 16%, transparent);

  position:relative; width:100%; height:150px; overflow:hidden;
  padding:11px; border-radius:7px;
  font-family:var(--m-sans); color:var(--m-ink);
  font-size:11px; line-height:1.32; letter-spacing:.005em;
  background:transparent;
}
.mx-srf *{box-sizing:border-box; margin:0; padding:0;}
.mx-srf b{font-weight:600;}
.mx-srf .num{font-family:var(--m-mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.mx-srf .mut{color:var(--m-mut);}

/* the AI's only permitted working state — the house shimmer */
.mx-srf .shim{
  background:linear-gradient(90deg,var(--m-mut) 18%,var(--m-ink) 50%,var(--m-mut) 82%);
  background-size:240% 100%; -webkit-background-clip:text; background-clip:text;
  color:transparent; animation:srf-shim 1900ms cubic-bezier(.45,0,.55,1) infinite;
}
@keyframes srf-shim{from{background-position:118% 0}to{background-position:-18% 0}}

/* generic hatch used wherever stock is missing */
.mx-srf .hatch{
  background-color:color-mix(in srgb, var(--m-no) 12%, transparent);
  background-image:repeating-linear-gradient(45deg,
    color-mix(in srgb, var(--m-no) 46%, transparent) 0 2px,
    transparent 2px 6px);
}

/* ---------- 01 · full-bleed lightbox (FLIP shared element) ---------- */
.mx-srf .s1-row{display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:5px;
  border:var(--hair); background:var(--m-sunk); margin-bottom:6px;
  transition:opacity 200ms var(--e-ink), filter 200ms var(--e-ink);}
.mx-srf .s1-thumb{flex:0 0 auto; width:30px; height:38px; border-radius:2px; background:var(--m-surface);
  border:var(--hair); padding:4px 3px; display:flex; flex-direction:column; gap:3px; overflow:hidden;}
.mx-srf .s1-thumb i{display:block; height:2px; border-radius:1px; background:var(--m-line2);}
.mx-srf .s1-thumb i:nth-child(1){width:70%; background:var(--m-mut);}
.mx-srf .s1-thumb i:nth-child(3){width:45%;}
.mx-srf .s1-txt{display:flex; flex-direction:column; min-width:0;}
.mx-srf .s1-txt span{color:var(--m-mut); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mx-srf .s1-tag{margin-left:auto; font-size:9px; color:var(--m-mut); border:var(--hair); border-radius:20px; padding:1px 6px;}
.mx-srf .s1-full{position:absolute; inset:0; background:var(--m-bg); z-index:4;
  transform-origin:0 0; opacity:0; visibility:hidden; padding:10px; display:flex; flex-direction:column;}
.mx-srf .s1-page{flex:1; border:var(--hair); background:var(--m-surface); border-radius:3px;
  padding:9px 10px; display:flex; flex-direction:column; gap:5px; overflow:hidden;}
.mx-srf .s1-page em{font-family:var(--m-serif); font-style:italic; font-size:12px; color:var(--m-mut);}
.mx-srf .s1-page i{display:block; height:2px; border-radius:1px; background:var(--m-line2); width:88%;}
.mx-srf .s1-page i:nth-of-type(2){width:64%;}
.mx-srf .s1-page s{margin-top:auto; text-decoration:none; font-family:var(--m-mono); font-size:13px; color:var(--m-accent);}
.mx-srf .s1-cap{padding-top:6px; font-size:9px; color:var(--m-mut); text-align:center;
  opacity:0; transition:opacity 200ms var(--e-ink);}

/* ---------- 02 · page turn (3D leaf + specular sweep) ---------- */
.mx-srf .s2-book{position:relative; height:106px; perspective:820px; perspective-origin:50% 50%;}
.mx-srf .s2-pg{position:absolute; top:0; bottom:0; width:50%; border:var(--hair); background:var(--m-sunk);
  padding:8px; overflow:hidden; display:flex; flex-direction:column; gap:5px;}
.mx-srf .s2-pg i{display:block; height:2px; border-radius:1px; background:var(--m-line2); width:86%;}
.mx-srf .s2-pg i:nth-of-type(2){width:58%;} .mx-srf .s2-pg i:nth-of-type(4){width:70%;}
.mx-srf .s2-left{left:0; border-radius:3px 0 0 3px;}
.mx-srf .s2-under{right:0; border-radius:0 3px 3px 0;}
.mx-srf .s2-leaf{position:absolute; right:0; top:0; bottom:0; width:50%;
  transform-origin:left center; transform-style:preserve-3d; transform:rotateY(0deg);}
.mx-srf .s2-face{position:absolute; inset:0; backface-visibility:hidden; border:var(--hair);
  background:var(--m-surface); padding:8px; overflow:hidden; display:flex; flex-direction:column; gap:5px;
  border-radius:0 3px 3px 0;}
.mx-srf .s2-face i{display:block; height:2px; border-radius:1px; background:var(--m-line2); width:84%;}
.mx-srf .s2-face i:nth-of-type(2){width:62%;} .mx-srf .s2-face i:nth-of-type(3){width:74%;}
.mx-srf .s2-back{transform:rotateY(180deg); border-radius:3px 0 0 3px;}
.mx-srf .s2-face s{margin-top:auto; text-decoration:none; font-family:var(--m-mono); font-size:10px; color:var(--m-accent);}
.mx-srf .s2-shine{position:absolute; inset:0; pointer-events:none; opacity:0; border-radius:0 3px 3px 0;
  background:linear-gradient(102deg,transparent 34%,
    color-mix(in srgb,var(--m-ink) 26%,transparent) 50%, transparent 66%);
  background-size:280% 100%; background-position:100% 0;}
.mx-srf .s2-cast{position:absolute; right:0; top:0; bottom:0; width:50%; opacity:0; pointer-events:none;
  background:linear-gradient(90deg,color-mix(in srgb,var(--m-ink) 34%,transparent),transparent 62%);}
.mx-srf .s2-foot{padding-top:6px; font-size:9px; color:var(--m-mut);}

/* ---------- 03 · scan resolve (blur + deskew, fields stamp) ---------- */
.mx-srf.srf03{display:flex; gap:9px;}
.mx-srf .s3-plate{flex:0 0 74px; position:relative; border:var(--hair); border-radius:4px;
  background:var(--m-sunk); overflow:hidden;}
.mx-srf .s3-doc{position:absolute; inset:9px; background:var(--m-surface); border:var(--hair); border-radius:2px;
  padding:6px 5px; display:flex; flex-direction:column; gap:4px; transform-origin:50% 50%;
  filter:blur(5px) contrast(.62); transform:rotate(-3.6deg) scale(1.1);}
.mx-srf .s3-doc b{font-size:8px; letter-spacing:.14em; color:var(--m-mut);}
.mx-srf .s3-doc i{display:block; height:2px; border-radius:1px; background:var(--m-line2); width:84%;}
.mx-srf .s3-doc i:nth-of-type(2){width:56%;}
.mx-srf .s3-doc s{margin-top:auto; text-decoration:none; font-family:var(--m-mono); font-size:9px; color:var(--m-accent);}
.mx-srf .s3-scan{position:absolute; left:0; right:0; height:22px; top:-24px; opacity:0;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--m-accent) 30%,transparent),transparent);
  border-bottom:1px solid var(--m-accent);}
.mx-srf .s3-side{flex:1; display:flex; flex-direction:column; gap:5px; min-width:0;}
.mx-srf .s3-status{font-family:var(--m-serif); font-style:italic; font-size:11px;}
.mx-srf .s3-status.done{color:var(--m-ok); font-style:normal; font-family:var(--m-sans); font-size:10px;}
.mx-srf .s3-f{display:flex; justify-content:space-between; gap:6px; align-items:baseline;
  border-bottom:var(--hair); padding-bottom:3px; opacity:0; transform:translateY(5px) scale(.9);
  transform-origin:0 50%;}
.mx-srf .s3-f span{font-size:9px; color:var(--m-mut); text-transform:uppercase; letter-spacing:.08em;}
.mx-srf .s3-f b{font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---------- 04 · PO status bar advancing ---------- */
.mx-srf .s4-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.mx-srf .s4-head span{font-size:9px; color:var(--m-mut); white-space:nowrap;}
.mx-srf .s4-rail{position:relative; height:4px; border-radius:3px; background:var(--m-sunk);
  border:var(--hair); margin:22px 5px 0;}
.mx-srf .s4-fill{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:3px;
  background:var(--m-accent); transition:width 320ms var(--e-settle);}
.mx-srf .s4-pip{position:absolute; top:50%; width:9px; height:9px; border-radius:50%; margin:-4.5px 0 0 -4.5px;
  background:var(--m-surface); border:1.5px solid var(--m-line2); transform:scale(1);}
.mx-srf .s4-pip.on{border-color:var(--m-accent); background:var(--m-accent);}
.mx-srf .s4-pip.fin{border-color:var(--m-ok); background:var(--m-ok);}
.mx-srf .s4-labels{display:flex; justify-content:space-between; margin-top:7px; padding:0 1px;}
.mx-srf .s4-labels span{font-size:8.5px; color:var(--m-mut); transition:color 160ms var(--e-ink), font-weight 160ms;}
.mx-srf .s4-labels span.on{color:var(--m-ink); font-weight:600;}
.mx-srf .s4-note{margin-top:9px; font-size:9.5px; color:var(--m-mut); transition:opacity 160ms var(--e-ink);}

/* ---------- 05 · ordered vs landed, the gap drawn in ---------- */
.mx-srf .s5-head{display:flex; justify-content:space-between; align-items:baseline;}
.mx-srf .s5-bar{position:relative; height:16px; border-radius:3px; background:var(--m-sunk);
  border:var(--hair); overflow:hidden; margin-top:12px;}
.mx-srf .s5-land{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--m-ok);}
.mx-srf .s5-gap{position:absolute; right:0; top:0; bottom:0; width:0;
  border-left:1px solid color-mix(in srgb,var(--m-no) 70%,transparent);
  background-position:0 0; transition:width 420ms var(--e-turn);}
.mx-srf .s5-ticks{position:absolute; inset:0; display:flex; pointer-events:none;}
.mx-srf .s5-ticks span{flex:1; border-right:1px solid color-mix(in srgb,var(--m-ink) 8%,transparent);}
.mx-srf .s5-key{display:flex; gap:12px; margin-top:8px; font-size:9px; color:var(--m-mut);}
.mx-srf .s5-key i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:-1px;}
.mx-srf .s5-short{margin-top:9px; font-size:10px; opacity:0; transform:translateY(4px);
  transition:opacity 240ms var(--e-ink), transform 240ms var(--e-settle);}
.mx-srf .s5-short b{color:var(--m-no); font-family:var(--m-mono);}

/* ---------- 06 · stacked order lines rebalancing ---------- */
.mx-srf .s6-head{display:flex; justify-content:space-between; align-items:baseline;}
.mx-srf .s6-stack{display:flex; height:26px; margin-top:12px; border-radius:3px; overflow:hidden;
  border:var(--hair); background:var(--m-sunk);}
.mx-srf .s6-seg{position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-family:var(--m-mono); font-size:9.5px; color:var(--m-accent-ink);
  transition:width 420ms var(--e-turn), box-shadow 160ms var(--e-ink);}
.mx-srf .s6-a{width:50%; background:var(--m-accent);}
.mx-srf .s6-b{width:33.34%; background:color-mix(in srgb,var(--m-accent) 62%, var(--m-sunk));}
.mx-srf .s6-c{width:16.66%; background:color-mix(in srgb,var(--m-accent) 30%, var(--m-sunk)); color:var(--m-ink);}
.mx-srf .s6-x{width:0;}
.mx-srf .s6-seg.flag{box-shadow:inset 0 0 0 2px var(--m-no);}
.mx-srf .s6-keys{display:flex; gap:9px; margin-top:9px; font-size:9px; color:var(--m-mut); flex-wrap:wrap;}
.mx-srf .s6-keys i{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:4px; vertical-align:-1px;}
.mx-srf .s6-ka{background:var(--m-accent);}
.mx-srf .s6-kb{background:color-mix(in srgb,var(--m-accent) 62%, var(--m-sunk));}
.mx-srf .s6-kc{background:color-mix(in srgb,var(--m-accent) 30%, var(--m-sunk));}
.mx-srf .s6-note{margin-top:8px; font-size:9.5px; color:var(--m-mut); opacity:0; transition:opacity 200ms var(--e-ink);}

/* ---------- 07 · vendor thread drawer, arrival then awaiting ---------- */
.mx-srf .s7-row{display:flex; align-items:center; gap:7px; width:100%; text-align:left; cursor:pointer;
  font:inherit; color:inherit; background:var(--m-sunk); border:var(--hair); border-radius:5px; padding:5px 8px;
  transition:background 160ms var(--e-ink), border-color 160ms var(--e-ink);}
.mx-srf .s7-row:hover{border-color:var(--m-line2);}
.mx-srf .s7-row span{font-size:9px; color:var(--m-mut);}
.mx-srf .s7-chev{margin-left:auto; width:6px; height:6px; border-right:1.5px solid var(--m-mut);
  border-bottom:1.5px solid var(--m-mut); transform:rotate(45deg); transition:transform 320ms var(--e-settle);}
.mx-srf .s7-row.open .s7-chev{transform:rotate(-135deg);}
.mx-srf .s7-drawer{display:grid; grid-template-rows:0fr; transition:grid-template-rows 420ms var(--e-turn);}
.mx-srf .s7-drawer.open{grid-template-rows:1fr;}
.mx-srf .s7-inner{overflow:hidden; min-height:0;}
.mx-srf .s7-pad{padding-top:6px; display:flex; flex-direction:column; gap:4px;}
.mx-srf .s7-m{max-width:82%; font-size:9.5px; padding:4px 7px; border-radius:8px; opacity:0;}
.mx-srf .s7-in{align-self:flex-start; background:var(--m-sunk); border:var(--hair); border-bottom-left-radius:2px;
  transform:translate(-9px,7px);}
.mx-srf .s7-out{align-self:flex-end; background:var(--m-accent); color:var(--m-accent-ink); border-bottom-right-radius:2px;
  transform:translate(9px,7px);}
.mx-srf .s7-typing{align-self:flex-start; display:flex; gap:3px; padding:5px 8px; border-radius:8px;
  background:var(--m-sunk); border:var(--hair); opacity:0; height:0; overflow:hidden;
  transition:opacity 200ms var(--e-ink), height 240ms var(--e-settle), padding 240ms var(--e-settle);}
.mx-srf .s7-typing.on{opacity:1; height:18px;}
.mx-srf .s7-typing i{width:4px; height:4px; border-radius:50%; background:var(--m-mut);
  animation:srf-dot 1100ms ease-in-out infinite;}
.mx-srf .s7-typing i:nth-child(2){animation-delay:140ms;}
.mx-srf .s7-typing i:nth-child(3){animation-delay:280ms;}
@keyframes srf-dot{0%,64%,100%{transform:translateY(0); opacity:.45} 32%{transform:translateY(-3px); opacity:1}}
.mx-srf .s7-state{font-size:9px; color:var(--m-mut); opacity:0; transition:opacity 240ms var(--e-ink);}
.mx-srf .s7-state b{color:var(--m-warn);}

/* ---------- 08 · AI draft composes, then waits for a human ---------- */
.mx-srf .s8-head{display:flex; align-items:center; gap:6px;}
.mx-srf .s8-chip{font-size:8.5px; letter-spacing:.07em; text-transform:uppercase; padding:2px 6px; border-radius:20px;
  border:1px solid color-mix(in srgb,var(--m-accent) 46%,transparent); color:var(--m-accent); background:var(--tint);}
.mx-srf .s8-st{font-size:9.5px; color:var(--m-mut);}
.mx-srf .s8-st.ready{color:var(--m-warn);} .mx-srf .s8-st.ok{color:var(--m-ok);}
.mx-srf .s8-body{margin-top:6px; height:44px; overflow:hidden; border-left:2px solid var(--m-line2); padding-left:7px;}
.mx-srf .s8-txt{font-family:var(--m-serif); font-style:italic; font-size:10.5px; line-height:1.42;}
.mx-srf .s8-txt w{display:inline-block; opacity:0; filter:blur(3px); transform:translateY(2px);}
.mx-srf .s8-bar{display:flex; gap:6px; margin-top:7px; align-items:stretch;}
.mx-srf .s8-hold{position:relative; flex:1; overflow:hidden; cursor:pointer; font:inherit; color:var(--m-ink);
  border:1px solid var(--m-line2); background:var(--m-sunk); border-radius:4px; padding:4px 0; font-size:9.5px;
  touch-action:none; user-select:none;}
.mx-srf .s8-fill{position:absolute; inset:0; background:var(--tint); transform:scaleX(0); transform-origin:0 50%;}
.mx-srf .s8-lab{position:relative;}
.mx-srf .s8-hold.done{border-color:var(--m-ok); color:var(--m-ok);}
.mx-srf .s8-send{font:inherit; font-size:9.5px; padding:4px 11px; border-radius:4px; border:var(--hair);
  background:transparent; color:var(--m-mut); opacity:.45; transition:opacity 160ms var(--e-ink), color 160ms var(--e-ink), border-color 160ms var(--e-ink);}
.mx-srf .s8-send.live{opacity:1; color:var(--m-ink); border-color:var(--m-line2); cursor:pointer;}
.mx-srf .s8-guard{margin-top:6px; font-size:8.5px; color:var(--m-mut);}
.mx-srf .s8-seal{position:absolute; right:7px; top:6px; width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--m-ok); color:var(--m-ok); display:flex; align-items:center; justify-content:center;
  font-size:11px; opacity:0; transform:scale(.3) rotate(-14deg);}

/* ---------- 09 · inbox row triaging into a lane ---------- */
.mx-srf .s9-lanes{display:flex; gap:5px;}
.mx-srf .s9-lane{display:flex; align-items:center; gap:4px; font-size:9px; font-weight:500; padding:3px 7px;
  border-radius:20px; border:var(--hair); color:var(--m-mut); background:var(--m-sunk);
  transition:border-color 160ms var(--e-ink), color 160ms var(--e-ink), background 160ms var(--e-ink);}
.mx-srf .s9-lane.hot{border-color:var(--m-accent); color:var(--m-accent); background:var(--tint);}
.mx-srf .s9-lane i{font-family:var(--m-mono); font-style:normal; font-size:9px;}
.mx-srf .s9-list{margin-top:7px;}
.mx-srf .s9-wrap{display:grid; grid-template-rows:1fr; transition:grid-template-rows 420ms var(--e-turn);}
.mx-srf .s9-wrap.gone{grid-template-rows:0fr;}
.mx-srf .s9-clip{overflow:hidden; min-height:0;}
.mx-srf .s9-row{position:relative; display:flex; align-items:center; gap:6px; padding:5px 7px; margin-bottom:4px;
  border:var(--hair); border-radius:4px; background:var(--m-sunk); font-size:9.5px; white-space:nowrap;}
.mx-srf .s9-row span{color:var(--m-mut); font-size:9px; overflow:hidden; text-overflow:ellipsis;}
.mx-srf .s9-dot{flex:0 0 auto; width:5px; height:5px; border-radius:50%; background:var(--m-accent);}
.mx-srf .s9-tag{margin-left:auto; font-style:normal; font-size:8.5px; padding:1px 6px; border-radius:20px;

  push({
    id:'srf-11', name:'Shift drops into a slot', family:'Product surfaces',
    purpose:'Building Friday dinner is a physical act — the block lifts under the finger, the target slot admits it, and it lands with weight rather than snapping, so the manager trusts where it went. Drag it yourself.',
    spec:'lift 220ms cubic-bezier(.16,1,.3,1); travel and snap on spring 380/32 sampled to linear() (1.09% overshoot); live pointer drag has NO transition — it tracks 1:1',
    html:'<div class="mx-srf srf11">'+
      '<div class="s11-grid">'+
        '<div></div><div class="s11-h">Thu</div><div class="s11-h">Fri</div><div class="s11-h">Sat</div>'+
        '<div class="s11-rl">L</div><div class="s11-cell"></div><div class="s11-cell"></div><div class="s11-cell"></div>'+
        '<div class="s11-rl">D</div><div class="s11-cell"></div><div class="s11-cell" data-t="1"></div><div class="s11-cell"></div>'+
      '</div>'+
      '<div class="s11-tray"><div class="s11-block"><b>17:00</b> Marta</div>'+
      '<span class="s11-hint">drag me</span></div>'+
      '</div>',
    play:function(root){
      reset(root);
      var block=q(root,'.s11-block'), cells=qa(root,'.s11-cell'), target=q(root,'.s11-cell[data-t="1"]');
      function place(el){
        var cr=el.getBoundingClientRect(), br=block.getBoundingClientRect(), rr=root.getBoundingClientRect();
        var cur=block.__pos||{x:0,y:0};
        return {x:cur.x+(cr.left+cr.width/2)-(br.left+br.width/2),
                y:cur.y+(cr.top+cr.height/2)-(br.top+br.height/2)};
      }
      function set(p,trans){ block.__pos=p; block.style.transition=trans||'none';
        block.style.transform='translate('+p.x+'px,'+p.y+'px)'; }
      cells.forEach(function(c){ c.classList.remove('hot','filled'); });
      block.classList.remove('lift');
      set({x:0,y:0});
      reflow(block);
      at(root,420,function(){
        block.classList.add('lift');
        block.style.transition='box-shadow 220ms var(--e-ink), transform 220ms var(--e-ink)';
        block.style.transform='translate(0px,0px) scale(1.03)';
      });
      at(root,660,function(){
        target.classList.add('hot');
        var p=place(target); p.y-=0;
        set(p,'transform 450ms var(--e-tuck)');

        block.classList.remove('lift'); target.classList.add('filled'); target.classList.remove('hot');

          base=block.__pos||{x:0,y:0}; sx=ev.clientX; sy=ev.clientY;
          block.classList.add('lift'); block.style.transition='box-shadow 220ms var(--e-ink)';
        });
        block.addEventListener('pointermove',function(ev){
          if(!dragging) return;

          cells.forEach(function(c){
            var r=c.getBoundingClientRect();

          });
        });
        block.addEventListener('pointerup',function(ev){
          if(!dragging) return; dragging=false;
          try{ block.releasePointerCapture(ev.pointerId); }catch(e){}
          block.classList.remove('lift');
          var hit=null;
          cells.forEach(function(c){ if(c.classList.contains('hot')) hit=c; c.classList.remove('hot'); });
          cells.forEach(function(c){ c.classList.remove('filled'); });
          if(hit){ set(place(hit),'transform 450ms var(--e-tuck)'); hit.classList.add('filled'); }
          else { set({x:0,y:0},'transform 450ms var(--e-tuck)'); }
        });

  push({
    id:'srf-12', name:'Call-out opens a gap, a cover closes it', family:'Product surfaces',
    purpose:'Marta calls out at 16:10 for Friday dinner; the consequence has to travel visibly from her chip to the coverage bar, because a hole in the floor plan is the thing the manager actually has to act on.',
    spec:'pulse travels 520ms cubic-bezier(.32,.72,0,1); gap opens on widths 420ms; cover slides in on spring 380/32 (1.09% overshoot); badge counts on spring 120/26',
    html:'<div class="mx-srf srf12">'+
      '<div class="s12-head"><b>Friday dinner</b><span class="s12-badge">0 gaps</span></div>'+
      '<div class="s12-people"><span class="s12-p s12-out">MA</span><span class="s12-p">JO</span>'+
      '<span class="s12-p">RT</span><span class="s12-p">EL</span></div>'+
      '<div class="s12-wire"><span class="s12-pulse"></span></div>'+
      '<div class="s12-bar"><span class="s12-s"></span><span class="s12-s"></span><span class="s12-s"></span>'+
      '<span class="s12-s s12-lost"></span><span class="s12-hole hatch"></span><span class="s12-cover">DE</span></div>'+
      '<div class="s12-note">Marta called out 16:10</div>'+
      '</div>',
    play:function(root){
      reset(root);
      var p=q(root,'.s12-out'), pulse=q(root,'.s12-pulse'), badge=q(root,'.s12-badge'),
          lost=q(root,'.s12-lost'), hole=q(root,'.s12-hole'), cover=q(root,'.s12-cover'), note=q(root,'.s12-note');
      p.classList.remove('out');
      pulse.style.transition='none'; pulse.style.transform='translateX(0)'; pulse.style.opacity='0';
      badge.className='s12-badge'; badge.textContent='0 gaps';
      [lost,hole,cover].forEach(function(e){ e.style.transition='none'; });
      lost.style.width='25%'; hole.style.width='0%'; cover.style.width='0%';
      note.style.opacity='0'; note.textContent='Marta called out 16:10';
      reflow(pulse);
      at(root,300,function(){ p.classList.add('out'); note.style.opacity='1'; });
      at(root,620,function(){
        pulse.style.transition='transform 520ms var(--e-turn), opacity 160ms var(--e-ink)';
        pulse.style.opacity='1';
        pulse.style.transform='translateX('+(q(root,'.s12-wire').offsetWidth-7)+'px)';
      });
      at(root,1140,function(){ pulse.style.opacity='0'; });
      at(root,1180,function(){
        lost.style.transition='width 420ms var(--e-turn)';
        hole.style.transition='width 420ms var(--e-turn)';
        lost.style.width='0%'; hole.style.width='25%';
        badge.className='s12-badge bad';
        tick(root,badge,0,1,840,function(v){ return int0(v)+' gap'; });
      });
      at(root,2300,function(){
        note.style.opacity='0';
        hole.style.transition='width 450ms var(--e-tuck)';
        cover.style.transition='width 450ms var(--e-tuck)';
        hole.style.width='0%'; cover.style.width='25%';
      });
      at(root,2500,function(){
        badge.className='s12-badge good'; badge.textContent='covered';
        note.textContent='Deniz took the cover 16:14'; note.style.opacity='1';
      });
    }
  });

  /* =========================================================
     INVITATIONS
     ========================================================= */

  push({
    id:'srf-13', name:'Invite code becomes a person', family:'Product surfaces',
    purpose:'A code is consumed exactly once, so it is spent character by character and then collapses into the seal — and the roster row it produces opens like a record, because that is what a new colleague is.',
    spec:'characters spent 60ms apart on the 160ms house curve; chip collapse 320ms cubic-bezier(.16,1,.3,1); seal + avatar spring 520/26 (11.1% overshoot); row turn 420ms',
    html:'<div class="mx-srf srf13">'+
      '<div class="s13-code"><i>M</i><i>D</i><i>V</i><i>-</i><i>7</i><i>K</i><i>4</i><i>Q</i></div>'+
      '<div class="s13-seal">&#10003;</div>'+
      '<div class="s13-wrap"><div class="s13-clip"><div class="s13-row">'+
      '<span class="s13-av">RT</span><b>Rosa Ter&aacute;n</b><span class="s13-role">Sommelier</span>'+
      '</div></div></div>'+
      '<div class="s13-foot">Team <b class="s13-n num">6</b> &middot; Friday dinner</div>'+
      '</div>',
    play:function(root){
      reset(root);
      var code=q(root,'.s13-code'), chars=qa(root,'.s13-code i'), seal=q(root,'.s13-seal'),
          wrap=q(root,'.s13-wrap'), av=q(root,'.s13-av'), role=q(root,'.s13-role'), n=q(root,'.s13-n');
      code.style.transition='none'; code.style.width=''; code.style.padding='';
      code.style.borderRadius='5px'; code.style.borderColor='var(--m-line2)';
      chars.forEach(function(c){ c.style.transition='none'; c.style.opacity='1'; c.style.transform='none'; c.classList.remove('used'); });
      seal.style.transition='none'; seal.style.opacity='0'; seal.style.transform='scale(.2) rotate(-16deg)';
      wrap.classList.remove('on');
      av.style.transition='none'; av.style.opacity='0'; av.style.transform='scale(.4)';
      role.style.opacity='0'; n.textContent='6';
      reflow(code);
      var w0=code.offsetWidth;
      code.style.width=w0+'px';
      var cr=code.getBoundingClientRect(), rr=root.getBoundingClientRect();
      seal.style.left=(cr.left-rr.left)+'px'; seal.style.top=(cr.top-rr.top)+'px';
      chars.forEach(function(c,i){
        at(root,240+i*60,function(){
          c.classList.add('used');
          c.style.transition='opacity 160ms var(--e-ink) 100ms, transform 160ms var(--e-ink) 100ms, color 120ms var(--e-ink)';
          c.style.opacity='0'; c.style.transform='scale(.55)';
        });
      });
      at(root,860,function(){
        code.style.transition='width 320ms var(--e-settle), padding 320ms var(--e-settle), border-radius 320ms var(--e-settle), border-color 200ms var(--e-ink)';
        code.style.width='26px'; code.style.padding='5px 0'; code.style.borderRadius='50%';
        code.style.borderColor='var(--m-accent)';
      });
      at(root,1120,function(){
        seal.style.transition='opacity 140ms var(--e-ink), transform 560ms var(--e-stamp)';
        seal.style.opacity='1'; seal.style.transform='scale(1) rotate(0deg)';
      });
      at(root,1420,function(){ wrap.classList.add('on'); });
      at(root,1560,function(){
        av.style.transition='opacity 140ms var(--e-ink), transform 560ms var(--e-stamp)';
        av.style.opacity='1'; av.style.transform='scale(1)';
        role.style.opacity='1';
        tick(root,n,6,7,840,int0);
      });
    }
  });

  push({
    id:'srf-14', name:'Pending invite expires', family:'Product surfaces',
    purpose:'An unaccepted invite is a security hole with a clock on it; the ring drains in real time, and when it hits zero the row goes dead in place instead of quietly vanishing from the team page.',
    spec:'stroke-dashoffset 0->94.25 over 3200ms LINEAR (a deadline is literal, not eased); death state 320ms house curve; strike-through 320ms cubic-bezier(.32,.72,0,1). Resend restarts it.',
    html:'<div class="mx-srf srf14">'+
      '<div class="s14-card">'+
        '<svg class="s14-ring" viewBox="0 0 36 36"><circle class="s14-trk" cx="18" cy="18" r="15"></circle>'+
        '<circle class="s14-arc" cx="18" cy="18" r="15"></circle></svg>'+
        '<div class="s14-who"><span class="s14-mail">tomas@vinosdelnorte.es</span>'+
        '<span class="s14-when">expires in 3d 04h</span></div>'+
      '</div>'+
      '<div class="s14-act"><button class="s14-resend" type="button">Resend invite</button></div>'+
      '<div class="s14-foot">Invited 11 Aug by Marta &middot; role: Sommelier</div>'+
      '</div>',
    play:function(root){
      reset(root);
      var card=q(root,'.s14-card'), arc=q(root,'.s14-arc'), when=q(root,'.s14-when'), act=q(root,'.s14-act');
      function run(){
        reset(root);
        card.classList.remove('dead'); act.classList.remove('on');
        arc.style.transition='none'; arc.style.strokeDashoffset='0';
        when.textContent='expires in 3d 04h';
        reflow(arc);
        if(RM()){ card.classList.add('dead'); arc.style.strokeDashoffset='94.25';
          when.textContent='expired 14 Aug'; act.classList.add('on'); return; }
        at(root,240,function(){
          arc.style.transition='stroke-dashoffset 3200ms linear';
          arc.style.strokeDashoffset='94.25';
        });
        var labels=['expires in 2d 12h','expires in 1d 18h','expires in 22h','expires in 4h'];
        labels.forEach(function(t,i){ at(root,700+i*620,function(){ when.textContent=t; }); });
        at(root,3480,function(){
          card.classList.add('dead');
          when.textContent='expired 14 Aug · never accepted';
        });
        at(root,3720,function(){ act.classList.add('on'); });
      }
      if(!q(root,'.s14-resend').__wired){
        q(root,'.s14-resend').__wired=true;
        q(root,'.s14-resend').addEventListener('click',run);
      }
      run();
    }
  });
})();
</script>
