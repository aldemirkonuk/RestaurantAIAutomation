<!doctype html>
<html><head><meta charset="utf-8"><title>srf harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, [data-skin="branded"]{
  --m-bg:#15130F; --m-surface:#1D1813; --m-sunk:#241E17;
  --m-line:rgba(239,231,217,.14); --m-line2:rgba(239,231,217,.30);
  --m-ink:#EFE7D9; --m-mut:#8E8576;
  --m-accent:#5FB0BC; --m-accent-ink:#15130F;
  --m-ok:#78B58E; --m-warn:#D3A458; --m-no:#E0776B;
  --m-serif:'Fraunces',Georgia,serif;
  --m-sans:'Instrument Sans',-apple-system,'Segoe UI',sans-serif;
  --m-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
[data-skin="neutral"]{
  --m-bg:#FAFAFA; --m-surface:#FFFFFF; --m-sunk:#F3F3F5;
  --m-line:#E3E3E7; --m-line2:#C4C4CB;
  --m-ink:#18181B; --m-mut:#71717A;
  --m-accent:#3F3F46; --m-accent-ink:#FFFFFF;
  --m-ok:#3F6B4E; --m-warn:#8A6A22; --m-no:#A33F35;
}
body{margin:0;padding:24px;background:var(--m-bg);color:var(--m-ink);font-family:var(--m-sans);}
h1{font-family:var(--m-serif);font-size:18px;font-weight:600;margin:0 0 4px;}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:18px;}
button.ctl{font:inherit;font-size:12px;padding:5px 12px;border-radius:5px;border:1px solid var(--m-line2);
  background:var(--m-surface);color:var(--m-ink);cursor:pointer;}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px;}
.card{background:var(--m-surface);border:1px solid var(--m-line);border-radius:9px;padding:0;overflow:hidden;}
.card h2{font-size:12px;margin:0;padding:8px 10px 2px;font-weight:600;}
.card p{font-size:10px;color:var(--m-mut);margin:0;padding:0 10px 6px;line-height:1.35;}
.card .hold{padding:0 6px 6px;}
.card .foot{display:flex;gap:6px;align-items:center;padding:6px 10px 8px;border-top:1px solid var(--m-line);}
.card .foot code{font-family:var(--m-mono);font-size:9px;color:var(--m-mut);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card .foot button{font:inherit;font-size:10px;padding:3px 9px;border-radius:4px;border:1px solid var(--m-line2);
  background:transparent;color:var(--m-ink);cursor:pointer;}
#err{white-space:pre-wrap;font-family:var(--m-mono);font-size:11px;color:#E0776B;}
</style></head>
<body data-skin="branded">
<h1>srf — Product surfaces (harness)</h1>
<div class="bar">
  <button class="ctl" id="skin">skin: branded</button>
  <button class="ctl" id="all">replay all</button>
  <span id="count" style="font-size:12px;color:var(--m-mut)"></span>
</div>
<div id="err"></div>
<div id="grid"></div>
<script>
window.MUDAVYM_MOTIONS = [];
window.addEventListener('error', function(e){
  document.getElementById('err').textContent += 'ERROR: '+e.message+' @'+e.filename+':'+e.lineno+'\n';
});
fetch('srf.html?'+Date.now()).then(function(r){ return r.text(); }).then(function(txt){
  var doc = new DOMParser().parseFromString('<div>'+txt+'</div>','text/html');
  var st = doc.querySelector('style');
  if(st){ var s=document.createElement('style'); s.textContent=st.textContent; document.head.appendChild(s); }
  var sc = doc.querySelector('script');
  var ns = document.createElement('script'); ns.textContent = sc ? sc.textContent : '';
  document.body.appendChild(ns);
  render();
}).catch(function(e){ document.getElementById('err').textContent += 'FETCH: '+e+'\n'; });

function render(){
  var grid = document.getElementById('grid');
  document.getElementById('count').textContent = window.MUDAVYM_MOTIONS.length + ' motions';
  window.MUDAVYM_MOTIONS.forEach(function(m){
    var card = document.createElement('div'); card.className='card';
    var h = document.createElement('h2'); h.textContent = m.id + ' · ' + m.name;
    var p = document.createElement('p'); p.textContent = m.purpose;
    var hold = document.createElement('div'); hold.className='hold'; hold.innerHTML = m.html;
    var foot = document.createElement('div'); foot.className='foot';
    var code = document.createElement('code'); code.textContent = m.spec; code.title = m.spec;
    var b = document.createElement('button'); b.textContent='replay';
    foot.appendChild(code); foot.appendChild(b);
    card.appendChild(h); card.appendChild(p); card.appendChild(hold); card.appendChild(foot);
    grid.appendChild(card);
    var root = hold.firstElementChild;
    m.__root = root;
    b.addEventListener('click', function(){ try{ m.play(root); }catch(e){
      document.getElementById('err').textContent += m.id+' PLAY: '+e+'\n'; } });
    setTimeout(function(){ try{ m.play(root); }catch(e){
      document.getElementById('err').textContent += m.id+' PLAY: '+e+'\n'; } }, 120);
  });
}
document.getElementById('skin').addEventListener('click', function(){
  var b=document.body, n = b.dataset.skin==='branded' ? 'neutral':'branded';
  b.dataset.skin=n; this.textContent='skin: '+n;
});
document.getElementById('all').addEventListener('click', function(){
  window.MUDAVYM_MOTIONS.forEach(function(m){ try{ m.play(m.__root); }catch(e){
    document.getElementById('err').textContent += m.id+' PLAY: '+e+'\n'; } });
});
</script>
</body></html>
