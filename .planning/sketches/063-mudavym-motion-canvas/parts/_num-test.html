<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>num harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --m-serif:'Fraunces',Georgia,serif;
  --m-sans:'Instrument Sans',system-ui,sans-serif;
  --m-mono:'JetBrains Mono',ui-monospace,monospace;
  --m-bg:#15130F; --m-surface:#1D1A15; --m-sunk:#100E0B;
  --m-line:#2E2A23; --m-line2:#403A30;
  --m-ink:#F2ECE1; --m-mut:#9C9384;
  --m-accent:#3E7C6E; --m-accent-ink:#0B1512;
  --m-ok:#6FA88C; --m-warn:#C98A2E; --m-no:#C4635C;
}
html[data-skin="neutral"]{
  --m-bg:#FFFFFF; --m-surface:#FAFAFA; --m-sunk:#F0F0F0;
  --m-line:#E2E2E2; --m-line2:#CBCBCB;
  --m-ink:#161616; --m-mut:#767676;
  --m-accent:#3A3A3A; --m-accent-ink:#FFFFFF;
  --m-ok:#4A7A5C; --m-warn:#8A6A1E; --m-no:#9A3A34;
}
body{margin:0;background:var(--m-bg);color:var(--m-ink);font-family:var(--m-sans);padding:22px}
#bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
#bar button{font:500 12px var(--m-sans);padding:7px 12px;border-radius:6px;cursor:pointer;
  background:var(--m-surface);color:var(--m-ink);border:1px solid var(--m-line2)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--m-surface);border:1px solid var(--m-line);border-radius:10px;padding:14px;
  display:flex;flex-direction:column;gap:10px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd .id{font:500 10px var(--m-mono);color:var(--m-mut)}
.hd .nm{font:600 13px var(--m-sans)}
.stage{background:var(--m-bg);border:1px solid var(--m-line);border-radius:8px;padding:12px;
  min-height:148px;display:flex;align-items:center;width:272px}
.stage>*{width:100%}
.sp{font:400 10px/1.4 var(--m-mono);color:var(--m-mut)}
.rp{align-self:flex-start;font:500 11px var(--m-sans);padding:5px 10px;border-radius:5px;
  background:transparent;color:var(--m-ink);border:1px solid var(--m-line2);cursor:pointer}
#diag{font:400 12px/1.6 var(--m-mono);color:var(--m-mut);margin-top:20px;white-space:pre-wrap}
</style></head><body>
<div id="bar">
  <button id="skin">skin: branded</button>
  <button id="all">replay all</button>
  <span id="cnt" class="sp"></span>
</div>
<div id="grid"></div>
<pre id="diag"></pre>
<script>
window.MUDAVYM_MOTIONS = [];
var diag = document.getElementById('diag');
function log(s){ diag.textContent += s + "\n"; }

document.getElementById('skin').addEventListener('click', function(){
  var n = document.documentElement.getAttribute('data-skin') === 'neutral';
  document.documentElement.setAttribute('data-skin', n ? 'branded' : 'neutral');
  this.textContent = 'skin: ' + (n ? 'branded' : 'neutral');
});

fetch('./num.html').then(function(r){ return r.text(); }).then(function(txt){
  var close = '<' + '/script>';
  var styleM = txt.match(/<style>([\s\S]*?)<\/style>/);
  var si = txt.indexOf('<script>');
  var se = txt.indexOf(close, si);
  var js = txt.slice(si + 8, se);

  if(!styleM){ log('FAIL: no <style> block'); return; }
  var st = document.createElement('style'); st.textContent = styleM[1];
  document.head.appendChild(st);

  var stripped = txt.replace(/<style>[\s\S]*?<\/style>/,'');
  stripped = stripped.slice(0, stripped.indexOf('<script>')) + stripped.slice(stripped.indexOf(close) + close.length);
  log('top-level residue outside style/script: ' + JSON.stringify(stripped.trim()));

  var sc = document.createElement('script'); sc.textContent = js;
  document.body.appendChild(sc);

  var list = window.MUDAVYM_MOTIONS;
  document.getElementById('cnt').textContent = list.length + ' motions registered';
  log('registered: ' + list.length);

  var ids = {}, fams = {};
  list.forEach(function(m){
    ids[m.id] = (ids[m.id]||0)+1; fams[m.family]=1;
    ['id','name','family','purpose','spec','html','play'].forEach(function(k){
      if(!m[k]) log('FAIL ' + m.id + ' missing ' + k);
    });
    if(typeof m.play !== 'function') log('FAIL ' + m.id + ' play not a function');
  });
  Object.keys(ids).forEach(function(k){ if(ids[k]>1) log('FAIL duplicate id ' + k); });
  log('families: ' + Object.keys(fams).join(' | '));

  var grid = document.getElementById('grid');
  list.forEach(function(m){
    var c = document.createElement('div'); c.className='card';
    var hd = document.createElement('div'); hd.className='hd';
    hd.innerHTML = '<span class="nm"></span><span class="id"></span>';
    hd.querySelector('.nm').textContent = m.name;
    hd.querySelector('.id').textContent = m.id;
    var stage = document.createElement('div'); stage.className='stage';
    stage.innerHTML = m.html;
    var sp = document.createElement('div'); sp.className='sp'; sp.textContent = m.spec;
    var rp = document.createElement('button'); rp.className='rp'; rp.textContent='replay';
    rp.addEventListener('click', function(){ try{ m.play(stage); }catch(e){ log('PLAY ERR '+m.id+': '+e.message); } });
    c.appendChild(hd); c.appendChild(stage); c.appendChild(rp); c.appendChild(sp);
    grid.appendChild(c);
    m.__stage = stage;
  });

  var rules = st.sheet.cssRules, bad = [], hexes = [];
  (function walk(rs){
    for(var i=0;i<rs.length;i++){
      var r = rs[i];
      if(r.type === 1){
        r.selectorText.split(',').forEach(function(s){
          s = s.trim();
          if(s.indexOf('.mx-num') !== 0) bad.push(s);
        });
        if(/#[0-9a-fA-F]{3,8}\b/.test(r.cssText)) hexes.push(r.selectorText);
      } else if(r.cssRules) walk(r.cssRules);
    }
  })(rules);
  log('selectors not prefixed .mx-num: ' + (bad.length ? bad.join(' , ') : 'none'));
  log('rules containing a hex colour: ' + (hexes.length ? hexes.join(' , ') : 'none'));

  // overflow audit at a 272px stage
  var over = [];
  list.forEach(function(m){
    var s = m.__stage;
    if(s.scrollWidth - s.clientWidth > 1) over.push(m.id + ' +' + (s.scrollWidth - s.clientWidth) + 'px');
  });
  log('stages overflowing horizontally at 272px: ' + (over.length ? over.join(' , ') : 'none'));

  function playAll(){ list.forEach(function(m){ try{ m.play(m.__stage); }catch(e){ log('PLAY ERR '+m.id+': '+e.message); } }); }
  document.getElementById('all').addEventListener('click', playAll);
  window.__playAll = playAll;
  window.__list = list;
  setTimeout(playAll, 200);
}).catch(function(e){ log('FETCH/PARSE ERR: ' + e.message); });
</script>
</body></html>
