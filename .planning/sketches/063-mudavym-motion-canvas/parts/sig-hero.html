<style>
/* sig-01 — swipe up to approve. Every selector is scoped .mx-sig-01. */
.mx-sig-01{--p:0;--w:236px;font-family:var(--m-sans);user-select:none;-webkit-user-select:none}
.mx-sig-01 .phone{position:relative;width:var(--w);height:474px;margin:0 auto;border-radius:30px;
  background:var(--m-bg);border:1px solid var(--m-line2);overflow:hidden;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.85)}
.mx-sig-01 .notch{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:64px;height:5px;
  border-radius:99px;background:var(--m-line2);opacity:.7}
.mx-sig-01 .top{padding:20px 16px 0;display:flex;justify-content:space-between;align-items:baseline}
.mx-sig-01 .kick{font:500 8.5px/1 var(--m-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--m-mut)}
.mx-sig-01 .clock{font:500 9px/1 var(--m-mono);color:var(--m-mut);font-variant-numeric:tabular-nums}

/* the order being committed to — lifts as the thumb travels */
.mx-sig-01 .doc{margin:12px 12px 0;padding:13px 13px 11px;border-radius:12px;background:var(--m-surface);
  border:1px solid var(--m-line);transform:translateY(0) scale(1);transform-origin:50% 100%}
.mx-sig-01 .vend{font-family:var(--m-serif);font-size:15px;font-weight:600;color:var(--m-ink);margin-bottom:2px}
.mx-sig-01 .po{font:500 9px/1 var(--m-mono);letter-spacing:.1em;color:var(--m-mut)}
.mx-sig-01 .lines{margin-top:10px;border-top:1px solid var(--m-line);padding-top:8px;
  display:flex;flex-direction:column;gap:5px}
.mx-sig-01 .li{display:flex;justify-content:space-between;font-size:10.5px;color:var(--m-mut)}
.mx-sig-01 .li b{color:var(--m-ink);font-weight:500}
.mx-sig-01 .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;
  padding-top:8px;border-top:1px solid var(--m-line);border-bottom:3px double var(--m-line2);padding-bottom:7px}
.mx-sig-01 .tot span{font-size:9.5px;color:var(--m-mut)}
.mx-sig-01 .tot b{font:600 17px/1 var(--m-mono);color:var(--m-ink);font-variant-numeric:tabular-nums}

/* the seal: ghost during the travel, pressed on commit */
.mx-sig-01 .sealwrap{position:absolute;z-index:3;left:50%;top:196px;transform:translate(-50%,0);
  width:78px;height:78px;pointer-events:none;opacity:0}
.mx-sig-01 .halo{position:absolute;inset:0;border-radius:50%;background:var(--m-accent);opacity:0;transform:scale(.5)}
.mx-sig-01 .seal{position:absolute;inset:0}
.mx-sig-01 .seal svg{width:100%;height:100%;display:block}
/* the die presses INTO the wax, so the mark is shadow, not more wax */
.mx-sig-01 .seal .mark{stroke:var(--m-bg);opacity:.62}
.mx-sig-01.sealed .sealwrap{opacity:1 !important;transform:translate(-50%,0) scale(1) !important}
.mx-sig-01.sealed .approved{opacity:1 !important}
.mx-sig-01.sealed .pill{opacity:0 !important}
.mx-sig-01 .approved{position:absolute;left:0;right:0;top:288px;z-index:3;text-align:center;opacity:0;
  font:500 9.5px/1 var(--m-mono);letter-spacing:.09em;color:var(--m-accent)}

/* the track: thumb-true, 150px of real travel */
.mx-sig-01 .track{position:absolute;left:14px;right:14px;bottom:14px;height:172px;border-radius:16px;
  background:var(--m-sunk);border:1px solid var(--m-line);overflow:hidden}
.mx-sig-01 .fill{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--m-accent);
  opacity:.12;transform:scaleY(0);transform-origin:50% 100%}
.mx-sig-01 .hint{position:absolute;left:0;right:0;top:13px;text-align:center;
  font:500 9px/1 var(--m-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--m-mut)}
.mx-sig-01 .pill{position:absolute;left:10px;right:10px;bottom:10px;height:46px;border-radius:12px;
  background:var(--m-surface);border:1px solid var(--m-line2);display:flex;align-items:center;
  justify-content:center;gap:8px;cursor:grab;touch-action:none;
  font-size:12.5px;font-weight:600;color:var(--m-ink);will-change:transform}
.mx-sig-01 .pill:active{cursor:grabbing}
.mx-sig-01 .chev{width:9px;height:9px;border-left:2px solid var(--m-accent);border-top:2px solid var(--m-accent);
  transform:rotate(45deg);margin-top:2px}
.mx-sig-01 .say{position:absolute;left:0;right:0;bottom:-1px;text-align:center;padding:6px 0;
  font:500 9px/1.3 var(--m-mono);color:var(--m-mut);opacity:0}
.mx-sig-01 .rail{position:absolute;left:50%;top:14px;width:1px;height:120px;transform:translateX(-50%);
  background:linear-gradient(to bottom,transparent,var(--m-line2));opacity:.55}
@media (prefers-reduced-motion: reduce){
  .mx-sig-01 .pill,.mx-sig-01 .doc,.mx-sig-01 .sealwrap,.mx-sig-01 .fill{transition:none !important}
}
</style>
<script>
(function(){
  var TRAVEL = 150;            // px of thumb travel — a real reach, not a tap
  var COMMIT = 0.68;           // fraction that means "yes"

  // damped spring -> CSS linear(), so the numbers on the card are the real curve
  function spring(k, c, m){
    var dt = 1/240, x = 1, v = 0, t = 0, pts = [];
    while (t < 3){
      v += ((-k * x - c * v) / m) * dt; x += v * dt; t += dt;
      pts.push(1 - x);
      if (Math.abs(x) < 0.0006 && Math.abs(v) < 0.0006) break;
    }
    var N = 60, out = [];
    for (var i = 0; i < N; i++) out.push(pts[Math.min(pts.length - 1, Math.round(i * (pts.length - 1) / (N - 1)))].toFixed(4));
    return { easing: 'linear(' + out.join(',') + ')', ms: Math.max(140, Math.round(t * 1000)) };
  }
  var STAMP = spring(500, 26, 1);   // the ceremonial one
  var TUCK  = spring(380, 32, 1);   // the rubber-band home
  var HOUSE = 'cubic-bezier(.16,1,.3,1)';

  var HTML =
    '<div class="mx-sig-01">' +
      '<div class="phone">' +
        '<div class="notch"></div>' +
        '<div class="top"><span class="kick">Approve</span><span class="clock">16:22</span></div>' +
        '<div class="doc">' +
          '<div class="vend">Vinos del Norte</div>' +
          '<div class="po">PO-1042</div>' +
          '<div class="lines">' +
            '<div class="li"><span>Rioja Reserva 2019</span><b>12</b></div>' +
            '<div class="li"><span>Albari&#241;o 2022</span><b>12</b></div>' +
          '</div>' +
          '<div class="tot"><span>Total</span><b>$1,860</b></div>' +
        '</div>' +
        '<div class="sealwrap"><div class="halo"></div><div class="seal">' +
          '<svg viewBox="0 0 100 100" aria-hidden="true">' +
            '<path class="wax" fill="currentColor" d="M50 6c9 0 14 6 22 8s16-2 21 5-1 15 1 23 8 13 5 21-13 8-18 14-6 15-14 17-14-4-22-4-14 6-22 4-9-11-14-17-15-6-18-14 3-13 5-21-3-16 1-23 13-3 21-5S41 6 50 6z"/>' +
            '<g class="mark" fill="none" stroke-width="4.4" stroke-linecap="square">' +
              '<path d="M31 62V40l12 14 12-14v22" stroke-width="5"/>' +
              '<path class="r1" d="M30 71h40"/><path class="r2" d="M30 77h40" stroke-width="2.6"/>' +
            '</g>' +
          '</svg>' +
        '</div></div>' +
        '<div class="approved">APPROVED 16:22 &#183; SEALED</div>' +
        '<div class="track">' +
          '<div class="fill"></div><div class="rail"></div>' +
          '<div class="hint">Swipe up to approve</div>' +
          '<div class="pill"><span class="chev"></span><span class="label">$1,860</span></div>' +
          '<div class="say"></div>' +
        '</div>' +
      '</div>' +
    '</div>';

  function wire(root){
    var el = root.querySelector('.mx-sig-01'); if (!el) return null;
    var pill = el.querySelector('.pill'), fill = el.querySelector('.fill'),
        doc = el.querySelector('.doc'), sealw = el.querySelector('.sealwrap'),
        halo = el.querySelector('.halo'), seal = el.querySelector('.seal'),
        hint = el.querySelector('.hint'), say = el.querySelector('.say'),
        appr = el.querySelector('.approved'), label = el.querySelector('.label');
    var committed = false;

    function paint(p, animate){
      // progressive resistance: the last third of the reach costs more than the first
      var eased = p * (1 - p * 0.22);
      var y = -eased * TRAVEL;
      var tr = animate ? 'transform ' + animate : 'none';
      pill.style.transition = tr;
      fill.style.transition = animate ? 'transform ' + animate : 'none';
      doc.style.transition = animate ? 'transform ' + animate : 'none';
      sealw.style.transition = animate ? 'opacity ' + animate + ', transform ' + animate : 'none';
      pill.style.transform = 'translateY(' + y + 'px)';
      fill.style.transform = 'scaleY(' + p + ')';
      doc.style.transform = 'translateY(' + (-p * 7) + 'px) scale(' + (1 - p * 0.012) + ')';
      // the ghost seal: you see what you are about to commit to, before you commit
      sealw.style.opacity = String(Math.min(0.34, p * 0.42));
      sealw.style.transform = 'translate(-50%,' + (10 - p * 10) + 'px) scale(' + (0.86 + p * 0.10) + ')';
      seal.style.color = 'var(--m-accent)';
      hint.style.opacity = String(1 - p * 1.4);
    }

    function release(p){
      if (committed) return;
      if (p >= COMMIT){ commit(); return; }
      // honest about what did NOT happen
      say.textContent = 'Released at ' + Math.round(p * 100) + '% — nothing sent.';
      say.style.transition = 'opacity 160ms ' + HOUSE; say.style.opacity = '1';
      paint(0, TUCK.ms + 'ms ' + TUCK.easing);
      setTimeout(function(){ say.style.opacity = '0'; }, 1500);
    }

    function commit(){
      committed = true;
      paint(1, 200 + 'ms ' + HOUSE);
      hint.style.opacity = '0';
      setTimeout(function(){
        // the seal lands on the stamp spring — the one ceremonial curve in the system
        sealw.style.transition = 'opacity 120ms linear, transform ' + STAMP.ms + 'ms ' + STAMP.easing;
        el.classList.add('sealed');
        halo.style.transition = 'opacity 90ms linear, transform 520ms ' + HOUSE;
        halo.style.opacity = '.30'; halo.style.transform = 'scale(1.5)';
        setTimeout(function(){ halo.style.transition = 'opacity 420ms linear'; halo.style.opacity = '0'; }, 140);
        pill.style.transition = 'opacity 180ms linear'; pill.style.opacity = '0';
        label.textContent = 'Approved';
        appr.style.transition = 'opacity 260ms ' + HOUSE; appr.style.opacity = '1';
      }, 150);
    }

    // real gesture — the founder should be able to try it, not just watch it
    var dragging = false, y0 = 0;
    pill.addEventListener('pointerdown', function(e){
      if (committed) return;
      dragging = true; y0 = e.clientY; pill.setPointerCapture(e.pointerId);
      say.style.opacity = '0';
    });
    pill.addEventListener('pointermove', function(e){
      if (!dragging || committed) return;
      var p = Math.max(0, Math.min(1, (y0 - e.clientY) / TRAVEL));
      paint(p, null);
    });
    function end(e){
      if (!dragging || committed) return;
      dragging = false;
      var p = Math.max(0, Math.min(1, (y0 - e.clientY) / TRAVEL));
      release(p);
    }
    pill.addEventListener('pointerup', end);
    pill.addEventListener('pointercancel', end);

    return {
      reset: function(){
        committed = false;
        el.classList.remove('sealed');
        pill.style.opacity = '1'; label.textContent = '$1,860';
        appr.style.opacity = '0'; halo.style.opacity = '0'; halo.style.transform = 'scale(.5)';
        say.style.opacity = '0'; say.textContent = ''; hint.style.opacity = '1';
        sealw.style.transition = 'none';
        paint(0, null);
      },
      demo: function(){
        // auto-demonstration: hesitate, retreat, then commit — the shape of a real decision
        var t = [];
        t.push(setTimeout(function(){ paint(0.42, '420ms ' + HOUSE); }, 260));
        t.push(setTimeout(function(){ release(0.42); }, 900));
        t.push(setTimeout(function(){ paint(0.96, '520ms ' + HOUSE); }, 2050));
        t.push(setTimeout(function(){ commit(); }, 2600));
        return t;
      }
    };
  }

  var timers = [], lastPlay = 0;
  window.MUDAVYM_MOTIONS.push({
    id: 'sig-01',
    name: 'Swipe up to approve — the seal lands',
    family: 'Signature moments',
    purpose: 'The founder’s two asks as one gesture: Robinhood’s swipe-to-commit, ending in the Mudavym seal pressed into the order. 150px of real thumb travel with progressive resistance, so approving $1,860 cannot happen by accident. Drag it yourself — release under 68% and it says exactly what did not happen.',
    spec: 'travel 150px · commit at 68% · resistance p(1−0.22p) · seal on stamp spring 500/26 sampled to linear() · retreat on tuck 380/32',
    source: 'apps/web/src/pages/Orders.tsx:514 (approve) · 059 motion.json stamp · ref: Robinhood swipe-to-buy',
    html: HTML,
    play: function(root){
      // A ceremony is allowed to finish. The canvas replays on hover as well as on
      // click, and without this a stray pointer restarts the run mid-press — the seal
      // lands and is immediately wiped. Re-entry inside one full run is ignored.
      var now = Date.now();
      if (now - lastPlay < 3200) return;
      lastPlay = now;
      timers.forEach(clearTimeout); timers = [];
      var api = wire(root); if (!api) return;
      api.reset();
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      timers = api.demo();
    }
  });
})();
</script>
